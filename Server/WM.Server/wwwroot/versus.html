<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마녀여 영원히 — 대결</title>
<style>
	:root {
		color-scheme: dark;
		--ground: #14121a;
		--floor: #23202c;
		--wall: #3a3548;
		--me: #5aa6ff;
		--foe: #ff8f5a;
		--ink: #d8d2e8;
		--dim: #8d86a6;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--ground);
		color: var(--ink);
		font: 14px/1.5 system-ui, sans-serif;
		overflow: hidden;
	}
	#board { position: fixed; inset: 0; display: block; cursor: crosshair; }
	.panel {
		position: fixed; z-index: 2;
		background: #1d1a26cc;
		border: 1px solid #322c42;
		border-radius: 10px;
		padding: 10px 14px;
	}
	#score { top: 14px; left: 14px; font-size: 18px; }
	#hint { bottom: 14px; left: 14px; color: var(--dim); }
	#offer { top: 14px; right: 14px; min-width: 260px; }
	#offer button {
		display: block; width: 100%; margin: 6px 0; padding: 8px 10px;
		background: #2a2536; color: var(--ink);
		border: 1px solid #3d3650; border-radius: 8px; cursor: pointer; text-align: left;
	}
	#offer button:hover { background: #342d44; }
	#offer[hidden] { display: none; }
	#status { top: 64px; left: 14px; }
	#rematch { top: 112px; left: 14px; }
	#rematch[hidden] { display: none; }
	#rematch button {
		padding: 10px 18px; font-size: 16px;
		background: #2a2536; color: var(--ink);
		border: 1px solid #3d3650; border-radius: 8px; cursor: pointer;
	}
	#rematchNote { color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div class="panel" id="score">— vs —</div>
<div class="panel" id="status">붙는 중…</div>
<div class="panel" id="offer" hidden><b>졌다 — 카드를 고른다</b><div id="cards"></div></div>
<div class="panel" id="rematch" hidden><button id="rematchButton">한 판 더</button><div id="rematchNote"></div></div>
<div class="panel" id="hint">WASD 이동 · 마우스 조준 · 좌클릭 발사 · Space 대시</div>

<script type="module">
// 브라우저로 하는 1대1 대결 (TASK-WM-411).
//
// ★ 3D 로 그린다 — WM Web(세계 창)이 쓰는 것과 <b>같은 three.js</b>(서버 옆 vendor).
//   처음엔 2D 캔버스로 따로 팠는데, 그러면 같은 게임이 창마다 다른 그림이 된다.
//   대결은 쿼터뷰 고정(유니티 창과 같은 각) — 둘 다 한 화면에 담는 각도다.
import * as THREE from './vendor/three.module.min.js';
//
// ★ 이 창은 규칙을 하나도 모른다. 서버(또는 P2P 호스트)가 심판이고, 여기는
//   ① 내 의도를 보내고 ② 받은 그림을 그린다. 유니티 창이 하는 일과 정확히 같다 —
//   같은 말(DomainSDK/Net)을 쓰기 때문에 둘이 같은 방에서 붙을 수 있다.

const board = document.getElementById('board');
const scorePanel = document.getElementById('score');
const statusPanel = document.getElementById('status');
const offerPanel = document.getElementById('offer');
const rematchPanel = document.getElementById('rematch');
const rematchNote = document.getElementById('rematchNote');
const cardsPanel = document.getElementById('cards');
const hintPanel = document.getElementById('hint');

const params = new URLSearchParams(location.search);
const room = params.get('room') ?? '';
const fillWithBot = params.get('bot') !== '0';

// 판 크기는 서버가 알려 준다(vsstart). 그 전에는 그리지 않는다.
let arena = null;
let seat = -1;
let tick = 0;

// ★ 그림은 초당 20번 오고 화면은 60번 그린다. 온 것을 그대로 그리면 뚝뚝 끊긴다.
//   그래서 <b>바로 전 그림과 방금 온 그림 사이를 채워</b> 그린다(보간).
//   ⚠ 이건 예측이 아니다 — 내 조작도 서버 왕복만큼 늦다. 브라우저에서 같은 규칙을 돌리려면
//     판정을 WASM 으로 굽는 길뿐인데(규칙 사본은 절대 만들지 않는다) 그건 아직 안 열렸다.
let previousState = null;
let currentState = null;
let previousAt = 0;
let currentAt = 0;

// 그림이 오는 간격(초). 실제로 재서 쓴다 — 회선이 느리면 그만큼 천천히 채운다.
let arrivalInterval = 1 / 20;

function pushState(message) {
	previousState = currentState ?? message;
	previousAt = currentAt || performance.now();
	currentState = message;
	currentAt = performance.now();

	const gap = (currentAt - previousAt) / 1000;
	if (gap > 0.005 && gap < 0.5)
		arrivalInterval = arrivalInterval * 0.8 + gap * 0.2;
}

// 두 그림 사이의 지금 자리. 같은 것끼리만 이어 준다(탄은 개수가 계속 변하므로 순서로 잇지 않는다).
function blend(previousBody, currentBody, alpha) {
	if (!previousBody) return currentBody;
	return {
		x: previousBody.x + (currentBody.x - previousBody.x) * alpha,
		y: previousBody.y + (currentBody.y - previousBody.y) * alpha,
		r: currentBody.r,
		owner: currentBody.owner,
		alive: currentBody.alive,
	};
}

const held = new Set();
const pointer = { x: 0, y: 0 };
let firing = false;
let dashQueued = false;

addEventListener('keydown', (event) => {
	held.add(event.code);
	if (event.code === 'Space') { dashQueued = true; event.preventDefault(); }
});
addEventListener('keyup', (event) => held.delete(event.code));
board.addEventListener('mousemove', (event) => { pointer.x = event.clientX; pointer.y = event.clientY; });
board.addEventListener('mousedown', () => { firing = true; });
addEventListener('mouseup', () => { firing = false; });

document.getElementById('rematchButton').addEventListener('click', () => {
	socket.send(JSON.stringify({ type: 'vsrematch' }));
	rematchNote.textContent = '상대를 기다린다…';
});

// ★ 판정을 브라우저에 올린다 (TASK-WM-411).
//   같은 C# 소스를 웹어셈블리로 구운 것이라 <b>규칙 사본이 없다</b>. 올라오면 내 조작이 즉시 반응하고
//   (미리 굴리기 + 되감기), 못 올라오면 예전처럼 서버 그림을 보간해 그린다 — 판이 멈추지는 않는다.
let bridge = null;

async function bootJudgment() {
	try {
		const runtime = await import('./versus/_framework/dotnet.js');
		const { getAssemblyExports, getConfig } = await runtime.dotnet.create();
		const exports = await getAssemblyExports(getConfig().mainAssemblyName);
		bridge = exports.WitchMendokusai.Wasm.VersusBridge;
		bridge.Open(0);
		if (hintPanel.dataset.judged !== '1') {
			hintPanel.textContent += ' · 판정이 이 창에서 돈다(즉시 반응)';
			hintPanel.dataset.judged = '1';
		}

		// 밖에서도 상태를 볼 수 있게 열어 둔다 — 「돈다」와 「그린다」가 갈릴 때 여기부터 본다.
		globalThis.wmVersus = bridge;
		console.log('[wm-versus] 판정이 브라우저에 올라왔다');
	} catch (error) {
		// 못 구웠거나 아직 배포 안 됐을 때 — 조용히 예전 길로 간다.
		console.warn('[versus] 판정을 브라우저에 못 올렸다 — 서버 그림만 그린다', error);
	}
}

const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/vs`);

socket.addEventListener('open', () => {
	statusPanel.textContent = '방을 찾는 중…';
	socket.send(JSON.stringify({ type: 'vsjoin', room, fillWithBot }));
});

socket.addEventListener('close', () => { statusPanel.textContent = '줄이 끊겼다'; });
socket.addEventListener('error', () => { statusPanel.textContent = '못 붙었다'; });

socket.addEventListener('message', (event) => {
	// 판정이 브라우저에 있으면 <b>그쪽이 먼저</b> 본다(되감기·예측은 그 안에서 일어난다).
	if (bridge) bridge.Receive(event.data);

	const message = JSON.parse(event.data);

	if (message.type === 'vsstart') {
		seat = message.seat;
		arena = { halfWidth: message.halfWidth, halfDepth: message.halfDepth, roundsToWin: message.roundsToWin };
		statusPanel.textContent = `내 자리 ${seat + 1}P — 상대를 기다린다`;
		return;
	}

	if (message.type === 'vsstate') {
		pushState(message);
		statusPanel.hidden = true;
		rematchPanel.hidden = true;
		const mine = seat === 0 ? message.scoreA : message.scoreB;
		const theirs = seat === 0 ? message.scoreB : message.scoreA;
		scorePanel.textContent = `나 ${mine}  vs  ${theirs} 상대`;
		return;
	}

	if (message.type === 'vsoffer') {
		showOffer(message);
		return;
	}

	if (message.type === 'vsroundend') {
		statusPanel.hidden = false;
		statusPanel.textContent = message.winner === seat ? '한 판 이겼다' : (message.winner < 0 ? '무승부' : '한 판 졌다');
		setTimeout(() => { statusPanel.hidden = true; }, 900);
		return;
	}

	if (message.type === 'vsmatchend') {
		statusPanel.hidden = false;
		statusPanel.textContent = message.winner === seat ? '내가 이겼다' : '상대가 이겼다';
		rematchPanel.hidden = false;
		rematchNote.textContent = '';
		return;
	}

	if (message.type === 'vsrematchstate') {
		rematchNote.textContent = `한 판 더 — ${message.ready}/${message.needed} 준비`;
		return;
	}

	if (message.type === 'vsleft') {
		statusPanel.hidden = false;
		statusPanel.textContent = '상대가 나갔다';
	}
});

function showOffer(message) {
	offerPanel.hidden = false;
	cardsPanel.replaceChildren();

	message.texts.forEach((text, index) => {
		const button = document.createElement('button');
		button.textContent = text;
		button.addEventListener('click', () => {
			socket.send(JSON.stringify({ type: 'vspick', index }));
			offerPanel.hidden = true;
		});
		cardsPanel.append(button);
	});
}

// ── 3D 판 (WM Web 과 같은 three.js) ───────────────────────────────────────
// 카메라는 쿼터뷰 고정 — 유니티 창과 같은 각이다. 둘 다 한 화면에 담기고, 조준이 헷갈리지 않는다.
const renderer = new THREE.WebGLRenderer({ canvas: board, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#14121a');

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(0, 26, 20);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight('#8f7fd8', '#241f30', 0.8));
const sun = new THREE.DirectionalLight('#ffe9c0', 1.0);
sun.position.set(10, 22, 8);
scene.add(sun);

// 판 바닥·벽은 서버가 알려 준 크기로 한 번만 짓는다.
let arenaGroup = null;

function buildArena(halfWidth, halfDepth) {
	if (arenaGroup) scene.remove(arenaGroup);

	arenaGroup = new THREE.Group();

	const floor = new THREE.Mesh(
		new THREE.BoxGeometry(halfWidth * 2, 0.4, halfDepth * 2),
		new THREE.MeshLambertMaterial({ color: '#23202c' })
	);
	floor.position.y = -0.2;
	arenaGroup.add(floor);

	const wallMaterial = new THREE.MeshLambertMaterial({ color: '#3a3548' });
	const walls = [
		[0, halfDepth, halfWidth * 2, 0.4],
		[0, -halfDepth, halfWidth * 2, 0.4],
		[halfWidth, 0, 0.4, halfDepth * 2],
		[-halfWidth, 0, 0.4, halfDepth * 2],
	];

	for (const [x, z, sizeX, sizeZ] of walls) {
		const wall = new THREE.Mesh(new THREE.BoxGeometry(sizeX, 1.2, sizeZ), wallMaterial);
		wall.position.set(x, 0.6, z);
		arenaGroup.add(wall);
	}

	scene.add(arenaGroup);

	// 판이 화면에 다 들어오도록 물러난다 — 「둘 다 한 화면」이 이 카메라의 존재 이유다.
	const span = Math.max(halfWidth, halfDepth * 1.4);
	camera.position.set(0, span * 1.9, span * 1.5);
	camera.lookAt(0, 0, 0);
}

// 사람 둘은 계속 살아 있고, 탄은 늘었다 줄었다 한다 — 늘어난 만큼만 새로 짓고 나머지는 숨긴다.
const fighterMeshes = [];
const shotMeshes = [];

function fighterMesh(index) {
	while (fighterMeshes.length <= index) {
		const mesh = new THREE.Mesh(
			new THREE.CapsuleGeometry(0.5, 0.7, 6, 12),
			new THREE.MeshLambertMaterial({ color: '#5aa6ff' })
		);
		scene.add(mesh);
		fighterMeshes.push(mesh);
	}

	return fighterMeshes[index];
}

function shotMesh(index) {
	while (shotMeshes.length <= index) {
		const mesh = new THREE.Mesh(
			new THREE.SphereGeometry(0.25, 12, 8),
			new THREE.MeshBasicMaterial({ color: '#5aa6ff' })
		);
		scene.add(mesh);
		shotMeshes.push(mesh);
	}

	return shotMeshes[index];
}

// 판 평면(y=0) 위에서 마우스가 가리키는 자리 — 조준은 이걸로 정한다.
const pointerRay = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pointerHit = new THREE.Vector3();

function pointerOnGround() {
	const ndc = new THREE.Vector2(
		(pointer.x / innerWidth) * 2 - 1,
		-(pointer.y / innerHeight) * 2 + 1
	);

	pointerRay.setFromCamera(ndc, camera);
	return pointerRay.ray.intersectPlane(groundPlane, pointerHit) ? pointerHit : null;
}

function sendInput() {
	if (socket.readyState !== WebSocket.OPEN || arena === null) return;

	let moveX = 0;
	let moveY = 0;
	if (held.has('KeyD')) moveX += 1;
	if (held.has('KeyA')) moveX -= 1;
	if (held.has('KeyW')) moveY += 1;
	if (held.has('KeyS')) moveY -= 1;

	let aimX = 1;
	let aimY = 0;
	const me = bridge ? predictedView?.fighters?.[seat] : currentState?.fighters?.[seat];
	const ground = pointerOnGround();

	if (me && ground) {
		// 판의 y 는 three 의 z 다(카메라가 그쪽을 본다).
		const dx = ground.x - me.x;
		const dy = ground.z - me.y;
		const length = Math.hypot(dx, dy) || 1;
		aimX = dx / length;
		aimY = dy / length;
	}

	tick += 1;

	if (bridge) {
		// 판정이 여기 있으면 한 틱 미리 굴리고, 보낼 말을 받아 흘린다.
		const outgoing = bridge.StepAndSend(moveX, moveY, aimX, aimY, firing, dashQueued);
		for (const line of outgoing.split(String.fromCharCode(10))) {
			if (line) socket.send(line);
		}
	} else {
		socket.send(JSON.stringify({
			type: 'vsinput', tick,
			moveX, moveY, aimX, aimY,
			fire: firing,
			dash: dashQueued,
		}));
	}

	dashQueued = false;
}

// 브라우저 판정이 있으면 매 프레임 그쪽 판을 읽어 그린다(60Hz · 즉시 반응).
let predictedView = null;

let diagnosedAt = 0;

function pullPredicted() {
	if (!bridge) return;

	bridge.Pump();
	const text = bridge.DrawState();
	predictedView = text ? JSON.parse(text) : null;

	// 1초에 한 번만 — 「판정은 도는데 판이 안 뜬다」를 추측이 아니라 값으로 가른다.
	const now = performance.now();
	if (now - diagnosedAt > 1000) {
		diagnosedAt = now;
		console.log('[wm-versus] 그릴 것 =', text ? text.length : 0, '글자 · 알림 =', bridge.HudState().slice(0, 120));
	}
}

function draw() {
	pullPredicted();

	// 창 크기는 어느 길로 가든 먼저 맞춘다.
	if (board.width !== innerWidth * renderer.getPixelRatio() || board.height !== innerHeight * renderer.getPixelRatio()) {
		renderer.setSize(innerWidth, innerHeight, false);
		camera.aspect = innerWidth / innerHeight;
		camera.updateProjectionMatrix();
	}

	// 판정이 이 창에 있으면 미리 굴린 판을 그대로 그린다(보간 불요 — 이미 60Hz 다).
	const source = (bridge && predictedView) ? predictedView : currentState;
	const previous = (bridge && predictedView) ? null : previousState;
	const alpha = (bridge && predictedView)
		? 1
		: Math.min(1, (performance.now() - currentAt) / 1000 / arrivalInterval);

	if (source) {
		if (bridge && predictedView) {
			arena = arena ?? { halfWidth: predictedView.halfWidth, halfDepth: predictedView.halfDepth, roundsToWin: 5 };
			seat = predictedView.seat;
		}

		if (arena && arenaGroup === null) buildArena(arena.halfWidth, arena.halfDepth);
		if (arena) placeBodies(source, alpha, previous);
	}

	renderer.render(scene, camera);
}

// 판의 (x, y) 를 three 의 (x, z) 로 옮겨 놓는다. 사람만 사이를 채운다(탄은 짝을 못 짓는다).
function placeBodies(source, alpha, previous) {
	const mine = '#5aa6ff';
	const theirs = '#ff8f5a';

	(source.fighters ?? []).forEach((fighter, index) => {
		const mesh = fighterMesh(index);
		mesh.visible = fighter.alive !== false;

		if (mesh.visible === false) return;

		const smooth = blend(previous?.fighters?.[index], fighter, alpha);
		mesh.position.set(smooth.x, fighter.r, smooth.y);
		mesh.scale.setScalar(fighter.r / 0.5);
		mesh.material.color.set(seat >= 0 && index === seat ? mine : theirs);
	});

	const shots = source.shots ?? [];

	for (let index = 0; index < Math.max(shots.length, shotMeshes.length); index++) {
		const mesh = shotMesh(index);
		const shot = shots[index];
		mesh.visible = shot !== undefined;

		if (mesh.visible === false) continue;

		mesh.position.set(shot.x, 0.6, shot.y);
		mesh.scale.setScalar(shot.r / 0.25);
		mesh.material.color.set(shot.owner === seat ? mine : theirs);
	}
}

// 의도는 60Hz 로 보내고, 그림은 화면 주사율에 맞춰 그린다.
setInterval(sendInput, 1000 / 60);

function frame() {
	draw();
	requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// 판정 올리기는 <b>한 번만</b>. 프레임 안에 들어가 있어 매 프레임 다시 부르고 있었다(2026-08-17 실측).
bootJudgment();
</script>
</body>
</html>
