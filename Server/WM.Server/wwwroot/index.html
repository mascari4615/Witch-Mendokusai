<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마녀여 영원히 — 세계</title>
<style>
	:root {
		color-scheme: dark;
		--ground: #14121a;
		--panel: #1d1a26cc;
		--line: #322c42;
		--ink: #d8d2e8;
		--dim: #8d86a6;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--ground);
		color: var(--ink);
		font: 14px/1.5 system-ui, sans-serif;
		overflow: hidden;
	}

	/* 세계가 화면 전체다. 판들은 그 위에 뜬다 — 창틀이 세계를 좁히지 않는다. */
	#board { position: fixed; inset: 0; display: block; }

	header, aside, footer {
		position: fixed; z-index: 2;
		background: var(--panel);
		backdrop-filter: blur(8px);
		border: 1px solid var(--line);
		border-radius: 10px;
	}

	header {
		top: 12px; left: 12px; right: 12px;
		display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
		padding: 8px 14px;
	}
	header .title { font-weight: 600; letter-spacing: .02em; }
	header .when, header .who { font-variant-numeric: tabular-nums; color: var(--dim); }
	header .spacer { flex: 1; }
	header input { flex: 1 1 180px; min-width: 120px; }

	aside {
		top: 64px; right: 12px; width: min(240px, calc(100vw - 24px)); max-height: calc(100vh - 130px);
		padding: 12px; display: flex; flex-direction: column; gap: 16px;
		overflow-y: auto;
	}
	select {
		background: #14121a; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%;
	}
	aside h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; color: var(--dim); font-weight: 600; }

	.bag { display: flex; flex-direction: column; gap: 2px; }
	.bag .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; }
	.bag .row:nth-child(odd) { background: #241f3088; }
	.bag .row span:first-child { flex: 1 1 auto; }
	.bag .row .amount { font-variant-numeric: tabular-nums; color: var(--dim); }
	.bag .row .amount { white-space: nowrap; flex: 0 0 auto; }
	.bag .empty { color: var(--dim); padding: 3px 6px; }

	.pot .line { color: var(--dim); font-variant-numeric: tabular-nums; }
	.buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

	button {
		background: #2a2436; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
		white-space: normal;
	}
	button:hover { background: #352d47; }
	input {
		background: #14121a; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%;
	}
	code { background: #241f30; padding: 3px 7px; border-radius: 5px; letter-spacing: .08em; white-space: pre-wrap; }

	/* 말할 자리 (TASK-WM-268) — 같이 노는 세계에서 말은 곁다리가 아니라 최소 조건이다. */
	#saybox {
		flex: 1 1 220px; min-width: 140px;
		background: rgba(0, 0, 0, 0.35);
		color: inherit; font: inherit;
		border: 1px solid var(--line); border-radius: 8px;
		padding: 4px 10px;
	}

	footer {
		left: 12px; right: 12px; bottom: 12px;
		display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
		padding: 7px 14px; color: var(--dim);
		max-width: min(720px, calc(100vw - 24px));
	}
	footer .status { color: var(--ink); }

	details summary { cursor: pointer; color: var(--dim); font-size: 12px; letter-spacing: .16em; }
	details[open] summary { margin-bottom: 8px; }
	details .stack { display: flex; flex-direction: column; gap: 6px; }
	header > *, aside section, .line, button, input, select, code, footer span { min-width: 0; overflow-wrap: anywhere; }

	@media (max-width: 900px) {
		header { right: 264px; }
	}

	@media (max-width: 720px) {
		header { right: 12px; }
		aside {
			left: 12px; right: 12px; top: auto; bottom: 72px; width: auto;
			max-height: min(42vh, 360px);
		}
		footer { max-width: none; }
	}
</style>
</head>
<body>
	<canvas id="board"></canvas>

	<header>
		<span class="title">마녀여 영원히</span>
		<span class="when" id="clock">—</span>
		<span class="who" id="peers">·</span>
		<span class="spacer"></span>
		<span class="who" id="me">—</span>
		<input id="myname" maxlength="16" placeholder="내 이름" />
		<button id="rename">이렇게 불러</button>
	</header>

	<aside>
		<section>
			<h2>가방</h2>
			<div class="bag" id="bag"><div class="empty">비었다</div></div>
		</section>

		<section>
			<h2>짓기</h2>
			<select id="buildpick"></select>
			<div class="buttons">
				<button id="mode">지금: 짓기</button>
			</div>
		</section>

		<section class="pot">
			<h2>솥</h2>
			<div class="line" id="potwhere">솥이 없다 — 지어서 쓰거나 가까이 가라</div>
			<div class="line" id="brew">아직 안 저음</div>
			<div class="line" id="aiming">—</div>
			<select id="brewpick"></select>
			<div class="buttons">
				<button id="stir">넣고 젓기</button>
				<button id="complete">가져가기</button>
				<button id="clear">비우기</button>
			</div>
		</section>

		<section class="craft">
			<h2>제작</h2>
			<div class="line" id="craftresult">—</div>
			<select id="craftpick"></select>
			<div class="buttons">
				<button id="make">만들기</button>
			</div>
		</section>

		<section id="chestbox" style="display:none">
			<h2>상자</h2>
			<div class="line" id="chestwhere">—</div>
			<div class="bag" id="chest"></div>
			<div class="buttons">
				<button id="chestamount">한 번에: 1개</button>
				<button id="chestclose">닫기</button>
			</div>
		</section>

		<details>
			<summary>나</summary>
			<div class="stack">
				<input id="klcode" placeholder="KarmoLab 코드" />
				<button id="signin">그 계정으로 들어가기</button>
				<button id="invite">이 사람으로 들어올 열쇠 만들기</button>
				<code id="invitecode">—</code>
				<input id="linkcode" placeholder="받은 열쇠" />
				<button id="link">잇기</button>
			</div>
		</details>
	</aside>

	<footer>
		<span class="status" id="status">붙는 중…</span>
		<span>방향키·WASD 로 걷고 · 노란 것을 눌러 줍고 · 땅을 눌러 짓는다 · <b>Enter</b> 로 말한다</span>
		<input id="saybox" maxlength="140" placeholder="Enter 를 눌러 말한다" />
	</footer>

<canvas id="early" style="position:fixed;inset:0;display:block;z-index:1"></canvas>
<script type="module">
/*
 * <b>엔진보다 먼저 세계에 들어간다</b> (TASK-WM-234).
 *
 * ★ 왜: 창의 모든 로직이 three.js 뒤에 묶여 있었다(모듈 맨 위 import). 그래서 엔진 138KB 가
 *   다 오기 전에는 <b>줄조차 안 열렸다</b> — 나쁜 회선(초당 32KB)에서 5.7초, 더 나쁜 회선
 *   (초당 8KB)에서는 20초 동안 사람은 아무것도 못 하고 기다렸다(실측 2026-08-12).
 *
 * ★ 그런데 세계 자체는 <b>가볍다</b>. 줄은 곧바로 열리고 첫 소식은 수십 바이트다.
 *   그러니 먼저 붙어서 <b>위에서 본 지도</b>로 보여 준다 — 사람은 반 초 만에 세계 안에 있고,
 *   엔진은 그 뒤에 조용히 도착해 같은 세계를 세워 그린다(표현만 바뀐다).
 *
 * 여기서 받은 말은 하나도 안 버린다 — 줄째로 넘겨서 본체가 처음부터 다시 읽는다.
 */
const early = { socket: null, queue: [], alive: true };
window.__wmEarly = early;

const paper = document.getElementById('early');
const brush = paper.getContext('2d');
const say = document.getElementById('status');
let mine = null;
let people = [];
let field = [];
let places = [];

function fit() {
	paper.width = Math.floor(window.innerWidth * Math.min(window.devicePixelRatio, 2));
	paper.height = Math.floor(window.innerHeight * Math.min(window.devicePixelRatio, 2));
}

fit();
window.addEventListener('resize', fit);

function draw() {
	if (early.alive === false) return;

	const w = paper.width;
	const h = paper.height;
	brush.fillStyle = '#14121a';
	brush.fillRect(0, 0, w, h);

	const me = early.drawnMe && early.drawnMe()
		? early.drawnMe()
		: (people.find((one) => one.id === mine) || { x: 0, z: 0 });
	const scale = Math.min(w, h) / 70;   // 화면에 대략 70m 가 들어온다
	const at = (x, z) => [w / 2 + (x - me.x) * scale, h / 2 - (z - me.z) * scale];

	brush.strokeStyle = '#2a2438';
	brush.lineWidth = 1;
	for (let line = -40; line <= 40; line += 5) {
		const [ax, ay] = at(me.x + line, me.z - 40);
		const [bx, by] = at(me.x + line, me.z + 40);
		brush.beginPath(); brush.moveTo(ax, ay); brush.lineTo(bx, by); brush.stroke();
		const [cx, cy] = at(me.x - 40, me.z + line);
		const [dx, dy] = at(me.x + 40, me.z + line);
		brush.beginPath(); brush.moveTo(cx, cy); brush.lineTo(dx, dy); brush.stroke();
	}

	// 손이 닿는 것은 밝게 — 사람이 「지금 이걸 집는다」를 알아야 누를 수 있다.
	const near = early.drawnMe && early.drawnMe() ? whatIsInReach(early.drawnMe(), field) : null;
	for (const node of field) {
		const [x, y] = at(node.x, node.z);
		const mine = near !== null && node.id === near.id;
		brush.fillStyle = mine ? '#8fe0a0' : '#3f6b4a';
		brush.fillRect(x - (mine ? 4 : 2), y - (mine ? 4 : 2), mine ? 9 : 5, mine ? 9 : 5);
	}

	brush.fillStyle = '#5a4a7a';
	for (const one of places) {
		const [x, y] = at(one.x, one.z);
		brush.fillRect(x - (one.w || 1) * scale / 2, y - (one.l || 1) * scale / 2,
			(one.w || 1) * scale, (one.l || 1) * scale);
	}

	for (const one of people) {
		const [x, y] = at(one.id === mine ? me.x : one.x, one.id === mine ? me.z : one.z);
		brush.fillStyle = one.id === mine ? '#ffd479' : '#8ab4ff';
		brush.beginPath();
		brush.arc(x, y, one.id === mine ? 7 : 5, 0, Math.PI * 2);
		brush.fill();
	}

	requestAnimationFrame(draw);
}

function read(text) {
	let said;
	try { said = JSON.parse(text); } catch (e) { return; }

	if (said.type === 'welcome') {
		mine = said.id;
		// 이 서버 판의 도장 — 다음에 붙을 때 「나 이거 들고 있다」고 말한다.
		try { if (said.catalogStamp) sessionStorage.setItem('wm.world.catalogstamp', said.catalogStamp); } catch (e) { /* 무시 */ }
	}
	if (said.type === 'me' && said.doll) {
		const without = people.filter((one) => one.id !== said.doll.id);
		people = without.concat([said.doll]);
	}

	if (Array.isArray(said.dolls) && said.type === 'world') {
		if (said.changed) {
			const byId = new Map(people.map((one) => [one.id, one]));
			for (const one of said.dolls) byId.set(one.id, one);
			for (const goneId of said.gone || []) byId.delete(goneId);
			people = [...byId.values()];
		} else {
			people = said.dolls;
		}
	}

	if (said.gatherables) {
		if (said.fieldChanged) {
			const byId = new Map(field.map((one) => [one.id, one]));
			for (const one of said.gatherables) byId.set(one.id, one);
			for (const goneId of said.fieldGone || []) byId.delete(goneId);
			field = [...byId.values()];
		} else {
			field = said.gatherables;
		}
	}

	if (said.buildings) places = said.buildings;
}

// 지도에서도 걷는다 — 3D 와 <b>같은 셈</b>을 쓴다(따로 적으면 갈라진다).
const { stepTowards, stepToSend, whatIsInReach, SEND_EVERY_MS } = await import('./walk.mjs');

const held = {};
window.addEventListener('keydown', (event) => { held[event.key] = true; });
window.addEventListener('keyup', (event) => { held[event.key] = false; });

const pull = (minus, plus) => {
	let value = 0;
	for (const key of minus) if (held[key]) value -= 1;
	for (const key of plus) if (held[key]) value += 1;
	return value;
};

let target = null;      // 내가 그리고 있는 내 자리
let lastStepAt = 0;

setInterval(() => {
	if (early.alive === false || mine === null || socket.readyState !== 1) return;

	const now = performance.now();
	const dt = lastStepAt === 0 ? 0 : Math.min(0.1, (now - lastStepAt) / 1000);
	lastStepAt = now;

	const me = people.find((one) => one.id === mine);
	if (!me) return;

	if (target === null) target = { x: me.x, z: me.z };

	const right = pull(['ArrowLeft', 'a', 'A'], ['ArrowRight', 'd', 'D']);
	const forward = pull(['ArrowDown', 's', 'S'], ['ArrowUp', 'w', 'W']);
	target = stepTowards(target, right, forward, dt);

	// 세계가 아는 자리에서 너무 벌어지면 그쪽으로 당긴다 — 지도가 혼자 딴 데 가 있으면 안 된다.
	const gap = Math.hypot(target.x - me.x, target.z - me.z);
	if (gap > 4) target = { x: me.x, z: me.z };

	const step = stepToSend(target, me);
	if (step !== null) socket.send(JSON.stringify({ type: 'move', x: step.x, z: step.z }));
}, SEND_EVERY_MS);

// 그릴 때는 앞질러 그린 내 자리를 쓴다 — 안 그러면 눌러도 왕복 시간만큼 안 움직인다.
early.drawnMe = () => target;

// ★ 지도에서도 <b>줍는다</b> (TASK-WM-249). 엔진이 영영 안 와도 세계에서 뭔가 할 수 있어야 한다.
//   겨냥은 3D 처럼 눌러 고르는 것이 아니라 <b>손이 닿는 것 중 가장 가까운 하나</b> —
//   지도에서는 그게 사람이 기대하는 것이고, 판정은 어차피 세계가 다시 본다.
const reachable = () => (target === null ? null : whatIsInReach(target, field));

window.addEventListener('keydown', (event) => {
	if (early.alive === false) return;
	if (event.key !== 'e' && event.key !== 'E') return;

	const near = reachable();
	if (near === null || socket.readyState !== 1) return;

	socket.send(JSON.stringify({ type: 'gather', nodeId: near.id }));
});

const address = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
const socket = new WebSocket(address);
early.socket = socket;

socket.onopen = () => {
	// ⚠ 「붙었다」는 창이 <b>다 준비됐다</b>는 뜻으로 쓰인다(관문들도 그렇게 읽는다).
	//   지도 단계는 아직 그게 아니므로 다른 말을 쓴다 — 같은 말을 쓰면 「준비됐다」가 거짓이 된다.
	say.textContent = '세계에 들어왔다 — 지도로 보는 중 (WASD 걷기 · E 줍기)';
	let saved = '';
	try { saved = localStorage.getItem('wm.world.secret') || ''; } catch (e) { saved = ''; }

	let klSession = '';
	try {
		const found = document.cookie.split(';').map((c) => c.trim())
			.filter((c) => c.indexOf('kl_session=') === 0)[0];
		if (found) klSession = decodeURIComponent(found.slice('kl_session='.length));
	} catch (e) { klSession = ''; }

	let klCode = '';
	try { klCode = localStorage.getItem('wm.world.klcode') || ''; } catch (e) { klCode = ''; }

	// 이 서버 판의 낱말표를 이미 들고 있으면 그렇다고 말한다 — 그러면 7.2KB 를 안 받는다.
	// ⚠ 인사는 <b>지도가 먼저</b> 한다. 여기서 「낱말표 안다」고 하면 세계는 안 보내고,
	//   뒤늦게 온 3D 는 손쓸 수 없다 — 그래서 <b>다 있다는 표</b>가 설 때만 도장을 낸다
	//   (TASK-WM-277: 새로고침 뒤 가방에 「석탄」 대신 #41 이 뜨던 자리).
	let knownCatalogs = '';
	try {
		const stamp = sessionStorage.getItem('wm.world.catalogstamp') || '';
		knownCatalogs = sessionStorage.getItem(`wm.world.cat.${stamp}.all`) === '1' ? stamp : '';
	} catch (e) { knownCatalogs = ''; }

	socket.send(JSON.stringify({ type: 'hello', secret: saved, klSession, klCode, knownCatalogs }));
	socket.send(JSON.stringify({ type: 'bagask' }));
};

socket.onmessage = (event) => {
	if (early.alive === false) return;

	early.queue.push(event.data);
	read(event.data);
};

socket.onerror = () => { /* 본체가 이어받아 다시 붙는다 */ };

/** 본체(3D)가 이어받는다 — 지도는 걷어내고, 받아 둔 말은 줄째로 넘긴다. */
/*
 * 시험용 창구 (TASK-WM-249) — 지도만으로도 노는지 밖에서 확인하려면 이게 있어야 한다.
 * 읽기 전용이다.
 */
early.field = () => field.slice();
early.reachable = () => reachable();
early.nearestNode = () => {
	const me = target || { x: 0, z: 0 };
	let best = null;
	let bestAway = Infinity;
	for (const one of field) {
		const away = ((one.x - me.x) ** 2) + ((one.z - me.z) ** 2);
		if (away >= bestAway) continue;

		best = one;
		bestAway = away;
	}

	return best;
};

early.handOver = () => {
	early.alive = false;
	paper.remove();
	return early.queue;
};

requestAnimationFrame(draw);
</script>
<script type="module">
// TASK-WM-216 → 217 — 「서버가 굴리는 세계」를 보는 창.
//
// ★ 왜 3D 인가: WM 은 3D 게임이다. 위에서 본 점판은 「같은 세계」가 아니라 그 세계의 지도였다.
//   판정은 여전히 전부 서버 것이고, 여기는 받은 것을 **세워서** 그린다 — 표현만 다른 같은 세계.
//   three.js 는 서버 옆에 같이 두고 쓴다(남의 CDN 에 세계를 의탁하지 않는다).
import * as THREE from './vendor/three.module.min.js';
// 고르개가 보여 줄 글은 순수 계산이라 따로 두고 시험한다 (wm-web-picker-test).
import { buildLabel, craftLabel, aimingText } from './picker.mjs';
import { createReconnectPlan, linkStatusText } from './link.mjs';
// 걷기의 셈은 지도(2D)와 <b>한 벌</b>로 쓴다 — 두 벌 적으면 갈라진다 (TASK-WM-235).
import { stepTowards, stepToSend, SEND_EVERY_MS } from './walk.mjs';

const statusElement = document.getElementById('status');
const canvas = document.getElementById('board');

let myId = null;
let dolls = [];
let lastWorldSequence = 0;

/** 전체 그림을 한 번이라도 받았나 — 그 전에는 번호가 낮은 전체 그림도 받는다 (TASK-WM-301). */
let sawWholeWorld = false;
let buildings = [];
let gatherables = [];
let bag = [];
let buildKinds = [];      // 지을 수 있는 것 — 들어올 때 한 번 받는다.
// ⚠ 「아직 안 골랐다」를 0 으로 쓰면 안 된다 — 건물 0번(가문의 나무)이 실재해서 그것만 못 짓는다.

function keepCatalog(kind, message) {
	try {
		const stamp = sessionStorage.getItem('wm.world.catalogstamp') || '';
		sessionStorage.setItem(`wm.world.cat.${stamp}.${kind}`, JSON.stringify(message));

		// 다섯이 다 모였을 때만 「다 있다」 표를 세운다 — 지도(2D)도 이 표 하나만 본다.
		if (CATALOG_KINDS.every((one) => sessionStorage.getItem(`wm.world.cat.${stamp}.${one}`) !== null))
			sessionStorage.setItem(`wm.world.cat.${stamp}.all`, '1');
	} catch (e) { /* 못 적어도 게임은 돈다 — 다음에 또 받을 뿐이다 */ }
}

/** 다 적어 뒀을 때의 도장 — 아니면 빈 글자(그러면 세계가 다시 보내 준다). */
function stampIfKept() {
	try {
		const stamp = sessionStorage.getItem('wm.world.catalogstamp') || '';
		return sessionStorage.getItem(`wm.world.cat.${stamp}.all`) === '1' ? stamp : '';
	} catch (e) {

}

/**
 * 적어 둔 낱말표를 되살린다 — <b>창이 뜨자마자</b> 한 번.

 */
function restoreCatalogs() {
	const stamp = stampIfKept();
	if (stamp === '') return '';

	const kept = [];
	for (const kind of CATALOG_KINDS) {
		let raw = null;
		try { raw = sessionStorage.getItem(`wm.world.cat.${stamp}.${kind}`); } catch (e) { raw = null; }
		if (raw === null) return '';

		try { kept.push(JSON.parse(raw)); } catch (e) { return ''; }
	}

	for (const message of kept) onLinkMessage({ data: JSON.stringify(message) });
	return stamp;
}

	if (socket !== null) socket.onmessage = onLinkMessage;
}

/** 넘어간 세계에 이만큼 못 붙으면 돌아온다. */
const GIVE_UP_ON_NEXT_WORLD_MS = 4000;

function worldAddress() {
	if (worldAt) return worldAt;

	return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
}

function connect() {
	if (retryTimer !== null) { clearTimeout(retryTimer); retryTimer = null; }

	// ★ 엔진보다 먼저 열어 둔 줄이 있으면 <b>그걸 이어받는다</b> (TASK-WM-234).
	//   새로 붙으면 세계에 인형이 둘 생기고, 먼저 받아 둔 소식도 통째로 버려진다.
	//   받아 둔 말은 줄째로 넘겨받아 처음부터 다시 읽는다 — 하나도 안 버린다.
	const early = window.__wmEarly;
	if (early && early.socket) {
		const adopt = () => {
			window.__wmEarly = null;
			socket = early.socket;
			socket.onopen = onLinkOpen;
			socket.onclose = onLinkClose;
			socket.onerror = onLinkError;

			// ⚠ 여기서 곧바로 살아 있는 말을 읽으면 안 된다 (실측 2026-08-12): 3D 가 다 설 때까지
			//   몇십 ms 가 걸리고, 그 사이 <b>새 판</b>이 먼저 처리되면 판 번호가 앞서 버린다.
			//   그러면 나중에 되읽는 <b>첫 전체 그림</b>이 「지난 것」으로 버려진다 — 들판 67자리가
			//   0 이 됐다(관문이 세 판에 한 번꼴로 잡았다). 3D 가 설 때까지 <b>계속 담아만 둔다</b>.
			socket.onmessage = (event) => {
				if (replayQueue !== null) replayQueue.push(event.data);
				else onLinkMessage(event);
			};
			reconnect.opened();
			statusElement.textContent = linkStatusText('open', 0);

			// ⚠ 여기서 바로 되읽으면 안 된다 (실측 2026-08-12): 이 자리는 아직 모듈이 <b>다 서기 전</b>이라
			//   3D 쪽 상수들이 초기화되지 않았다 — 세우려는 순간 ReferenceError 로 창이 통째로 죽는다.
			//   받아만 두고, 3D 가 다 선 뒤에 읽는다.
			replayQueue = early.handOver();

			// 엔진이 이미 다 섰으면(느린 회선에서는 이어받기가 늦게 온다) 곧바로 읽는다.
			if (engineReady) drainReplay();
		};

		// 먼저 연 줄이 끝내 안 열리면(회선 사고) 평소대로 우리가 붙는다.
		const giveUp = () => {
			if (window.__wmEarly === null) return;

			window.__wmEarly = null;
			early.handOver();
			connect();
		};

		if (early.socket.readyState === WebSocket.OPEN) {
			adopt();
		} else {
			early.socket.addEventListener('open', adopt, { once: true });
			early.socket.addEventListener('close', giveUp, { once: true });
			early.socket.addEventListener('error', giveUp, { once: true });
		}

		return;
	}

	statusElement.textContent = linkStatusText(reconnect.attempts > 0 ? 'retrying' : 'connecting', reconnect.attempts);

	socket = new WebSocket(worldAddress());
	socket.onopen = onLinkOpen;
	socket.onclose = onLinkClose;
	socket.onerror = onLinkError;
	socket.onmessage = onLinkMessage;
}

/*
 * <b>미리 붙어 두고 넘어간다</b> (TASK-WM-279).
 *
 * ★ 왜: 전에는 「가라」를 듣자마자 이 줄을 끊었다. 그러면 <b>끊고 · 붙고 · 첫 그림</b> 동안
 *   화면이 통째로 멎는다 — 왕복 200ms 회선에서 <b>1097ms</b> 였다(WM-278 실측).
 *   사람 눈에는 국경마다 한 번씩 세계가 멈추는 것이다.
 *
 * ★ 그래서 <b>새 줄을 먼저 연다</b>. 보낸 세계는 200ms 를 기다려 주므로 그동안 소식이 계속 온다.
 *   저 세계의 <b>첫 그림</b>이 오면 그때 옛 줄을 놓는다 — 멎는 자리가 없다.
 *
 * ★ 저 세계가 안 열리면? 옛 줄을 안 놓았으니 그냥 옛 줄로 남는다. 그러다 옛 줄마저 끊기면
 *   지금까지의 길(WM-256, 왔던 곳으로 돌아가기)이 그대로 받는다.
 */
let crossing = null;

function crossOver(address) {
	if (crossing !== null) return;

	const next = new WebSocket(address);
	const waiting = [];
	crossing = { socket: next, waiting };

	// 저 세계가 늦으면 옛 줄을 그냥 쓴다 — 끊지 않았으니 잃는 것이 없다.
	const giveUp = setTimeout(() => {
		if (crossing === null || crossing.socket !== next) return;

		crossing = null;
		try { next.close(); } catch (e) { /* 이미 닫혔다 */ }
		statusElement.textContent = '저 세계가 안 열린다 — 여기 그대로 있는다';
	}, GIVE_UP_ON_NEXT_WORLD_MS);

	next.onopen = () => {
		let knownCatalogs = stampIfKept();
		let saved = '';
		try { saved = localStorage.getItem(KEY_NAME) || ''; } catch (e) { saved = ''; }

		const pass = travelPass;
		travelPass = '';
		next.send(JSON.stringify({ type: 'hello', secret: saved, knownCatalogs, pass }));
		next.send(JSON.stringify({ type: 'bagask' }));
	};

	// 첫 그림이 올 때까지는 <b>담아만 둔다</b> — 옛 세계의 소식과 섞이면 자리가 튄다.
	next.onmessage = (event) => {
		let said;
		try { said = JSON.parse(event.data); } catch (e) { said = null; }

		waiting.push(event.data);
		if (said === null || said.type !== 'world') return;

		clearTimeout(giveUp);
		takeOver(next, waiting);
	};

	next.onerror = () => { /* onclose 가 정리한다 */ };
	next.onclose = () => {
		if (crossing === null || crossing.socket !== next) return;

		clearTimeout(giveUp);
		crossing = null;
	};
}

/** 저 세계의 첫 그림이 왔다 — 이제 옛 줄을 놓고 이 줄로 산다. */
function takeOver(next, waiting) {
	crossing = null;

	// 옛 줄은 <b>조용히</b> 놓는다 — 닫힘을 그냥 두면 「끊겼다」로 읽고 다시 붙으러 간다.
	const old = socket;
	if (old) {
		old.onmessage = null;
		old.onclose = null;
		old.onerror = null;
		try { old.close(); } catch (e) { /* 이미 닫혔다 */ }
	}

	// 새 세계는 나를 처음부터 그려 준다 — 지난 판 번호를 들고 있으면 새 그림을 옛것으로 읽는다.
	myId = null;
	lastWorldSequence = 0;
	sawWholeWorld = false;
	stepNumber = 0;
	stepsWaiting = [];
	sentUpTo = null;
	cameFrom = '';

	socket = next;
	socket.onopen = onLinkOpen;
	socket.onclose = onLinkClose;
	socket.onerror = onLinkError;
	socket.onmessage = onLinkMessage;
	reconnect.opened();
	statusElement.textContent = linkStatusText('open', 0);

	for (const data of waiting) onLinkMessage({ data });
}

function onLinkClose() {
	// 다시 붙으면 세계는 나를 처음부터 그려 준다 — 지난 판의 번호·차례를 들고 있으면
	// 새 스냅샷을 「오래된 것」으로 읽고 버린다(화면이 영원히 안 갱신된다).
	myId = null;
	lastWorldSequence = 0;
	sawWholeWorld = false;

	const next = reconnect.closed();
	if (next.retry === false) {
		statusElement.textContent = linkStatusText('evicted', 0);
		return;
	}

	// ★ 넘어간 세계에 <b>한 번도 못 붙었으면</b> 원래 세계로 돌아간다 (TASK-WM-256).
	//   저쪽이 꺼져 있는데 계속 두드리면 그 사람은 영영 어디에도 없다.
	if (cameFrom && next.delayMs >= GIVE_UP_ON_NEXT_WORLD_MS) {
		statusElement.textContent = '저 세계가 안 열린다 — 왔던 곳으로 돌아간다';
		worldAt = cameFrom;
		cameFrom = '';
		travelPass = passKeptFor;
		reconnect.opened();
		retryTimer = setTimeout(connect, 200);
		return;
	}

	statusElement.textContent = linkStatusText('retrying', next.attempts);
	retryTimer = setTimeout(connect, next.delayMs);
}

function onLinkError() {
	// 여기서는 알리기만 한다 — 다시 붙는 것은 언제나 onclose 가 맡는다(두 번 붙지 않게).
	if (reconnect.evicted === false && reconnect.attempts === 0) {
		statusElement.textContent = linkStatusText('error', 0);
	}
}

/**
 * 「내가 이 사람들을 그리고 있다」를 이따금 세계에 물어본다 (TASK-WM-329).
 *
 * ★ 왜: 「그 사람 나갔다」(gone)는 <b>한 번밖에 안 온다</b>. 그 한 번을 놓친 창은 그 사람을
 *   영영 유령으로 그린다 — 오류도 없고, 사람이 눈으로 볼 때까지 아무도 모른다. 실제로 한 번
 *   20초 넘게 그랬는데 26판을 돌려도 재현이 안 됐다(WM-314). 원인을 못 잡으면 <b>물어보면 된다.</b>
 *
 * ⚠ 이건 「나갔다」를 대신하는 길이 아니다 — 그건 즉시고, 이건 10초에 한 번이다.
 *   덮개이지 바닥이 아니다.
 */
let rosterTimer = null;
function startRosterCheck() {
	if (rosterTimer !== null) return;
	rosterTimer = setInterval(() => {
		if (socket === null || socket.readyState !== 1) return;
		const ids = dolls.map((one) => one.id);
		if (ids.length === 0) return;
		socket.send(JSON.stringify({ type: 'roster', ids }));
	}, 10000);
}

/** 세계가 「없다」고 한 사람을 지운 횟수 — 관문이 이 수를 본다. */
window.__wmGhostsErased = 0;

// ★ 가만히 있어도 <b>내가 어디까지 봤는지</b>는 알려 준다 (TASK-WM-339).
//   세계는 이 도장으로 「이 창이 몇 초 밀렸나」를 알고, 밀리면 <b>덜 보낸다</b>.
//   그 전에는 걸음·때리기에 얹힌 도장만 있어서, 구경만 하는 창은 세계에 안 보였다.
setInterval(() => {
	if (socket === null || socket.readyState !== 1) return;
	if (typeof lastWorldAt !== 'number' || lastWorldAt <= 0) return;
	socket.send(JSON.stringify({ type: 'beat', ack: lastWorldAt }));
}, 250);

// ★ 여기서 <b>한 번</b> 건다 — 붙는 순간이 아니라. (실측 2026-08-14: `onLinkOpen` 에 걸었더니
//   한 판도 안 물어봤다. 평소 길은 지도 모듈이 <b>이미 연 줄을 넘겨받는 것</b>이라 `onopen` 이
//   영영 안 뜬다 — 「붙었을 때 시작」이 이 창에서는 「시작 안 함」이었다.)
//   시계는 매번 줄 상태를 보고 안 열렸으면 그냥 넘어간다.
startRosterCheck();

function onLinkOpen() {
	// 저 세계에 <b>붙었다</b> — 이제 돌아갈 곳은 없다(다음 국경이 새로 정해 준다).
	cameFrom = '';
	reconnect.opened();
	statusElement.textContent = linkStatusText('open', 0);
	lastWorldSequence = 0;

	let saved = '';
	try { saved = localStorage.getItem(KEY_NAME) || ''; } catch (e) { saved = ''; }

	// KarmoLab 로그인 세션이 있으면 같이 낸다 — 그러면 어느 기기에서든 나다.
	// ⚠ 이 쿠키는 다른 주소(yawnbot)의 것이라 여기서 못 읽는 경우가 많다. 그때는 손님으로 논다.
	let klSession = '';
	try {
		const found = document.cookie.split(';').map((c) => c.trim())
			.filter((c) => c.indexOf('kl_session=') === 0)[0];
		if (found) klSession = decodeURIComponent(found.slice('kl_session='.length));
	} catch (e) { klSession = ''; }

	let klCode = '';
	try { klCode = localStorage.getItem('wm.world.klcode') || ''; } catch (e) { klCode = ''; }

	// 이 서버 판의 낱말표를 이미 들고 있으면 그렇다고 말한다 (TASK-WM-238).
	// ★ 낱말표를 <b>정말로</b> 들고 있을 때만 도장을 낸다 (TASK-WM-277).
	//   전에는 도장만 적어 두고 낱말표는 안 적어 뒀다 — 새로고침하면 창에는 낱말표가 <b>없는데</b>
	//   세계는 「안다면서?」 하고 안 보냈다. 그래서 가방에 「석탄」 대신 <b>#41</b> 이 떴다(실측).
	const knownCatalogs = stampIfKept();

	// 통행증은 <b>한 번만</b> 낸다 — 들고 있으면 다시 붙을 때마다 옛 자리로 돌아간다.
	const pass = travelPass;
	travelPass = '';
	tell({ type: 'hello', secret: saved, klSession, klCode, knownCatalogs, pass });
	tell({ type: 'bagask' });

	// 코드는 한 번 쓰면 사라진다 — 들고 있어 봐야 다음엔 안 통한다(그때는 기기 열쇠가 나를 안다).
	try { localStorage.removeItem('wm.world.klcode'); } catch (e) { /* 무시 */ }
}

function onLinkMessage(event) {
	const message = JSON.parse(event.data);

	if (message.type === 'full') {
		// ★ 가득 찬 것은 <b>고장이 아니라 상태</b>다 (TASK-WM-349) — 말없이 끊기면 사람은
		//   자기 인터넷을 의심한다. 이유를 적고, 다시 붙기도 멈춘다(문을 두드려 봐야 소용없다).
		reconnect.kicked();
		statusElement.textContent = `세계가 가득 찼다 (${message.most || '?'}명까지) — 잠시 뒤 새로고침`;
		return;
	}

	if (message.type === 'kicked') {
		// 일반 MMORPG 처럼 나중에 온 쪽이 이긴다 — 조용히 끊기면 사람은 「버그」로 읽는다.
		// ⚠ 여기서 다시 붙으면 방금 들어간 창을 도로 쫓아낸다 — 두 창이 서로를 영원히 민다.
		//   그래서 이 창은 물러난다(다시 놀려면 새로고침).
		reconnect.kicked();
		statusElement.textContent = linkStatusText('evicted', 0);
		return;
	}

	if (message.type === 'catalog') {
		for (const item of message.items) itemNames[item.itemId] = item.name;
		keepCatalog('catalog', message);
		drawBag();
		return;
	}

	if (message.type === 'buildcatalog') {
		buildKinds = message.buildings || [];
		keepCatalog('buildcatalog', message);
		drawBuildPicker();
		return;
	}

	if (message.type === 'ghosts') {
		// 세계가 「그 사람들 여기 없다」고 했다 — 그 자리에서 지운다 (TASK-WM-329).
		// 사람은 이 일을 안 겪는다(다음 프레임에 사라진다). 남는 건 숫자뿐이다.
		const gone = new Set(message.ids || []);
		if (gone.size > 0) {
			const before = dolls.length;
			dolls = dolls.filter((one) => gone.has(one.id) === false);
			window.__wmGhostsErased += before - dolls.length;
			console.warn(`[유령] 세계에 없는 사람 ${before - dolls.length}명을 지웠다 — ${[...gone].join(',')}`);
			syncDolls();
		}
		return;
	}

	if (message.type === 'bag') {
		gotAnswer('주웠다');
		bag = message.items || [];
		drawBag();
		drawBuildPicker();   // 가진 게 바뀌면 「지을 수 있나」도 바뀐다
		drawCraftPicker();   // 만들 수 있나도 같이
		return;
	}

	if (message.type === 'brewshelf') {
		brewShelf = message.items || [];
		keepCatalog('brewshelf', message);
		const picker = document.getElementById('brewpick');
		picker.textContent = '';
		for (const item of brewShelf) {
			const option = document.createElement('option');
			option.value = item.itemId;
			option.textContent = item.name;
			picker.appendChild(option);
		}

		pickedIngredient = brewShelf.length > 0 ? brewShelf[0].itemId : null;
		picker.value = pickedIngredient;
		return;
	}

	if (message.type === 'craftbook') {
		// 무엇을 만들 수 있는지도 세계가 정한다 — 창이 자기 목록을 들면 세계가 모르는 걸 고른다.
		craftBook = message.recipes || [];
		keepCatalog('craftbook', message);
		drawCraftPicker();
		return;
	}

	if (message.type === 'crafted') {
		// ★ 「재료가 없어 못 했다」와 「주사위를 졌다」는 사람에게 전혀 다른 일이다.
		//   구별해서 안 보여 주면 둘 다 「고장」으로 읽힌다.
		if (message.attempted === false) {
			document.getElementById('craftresult').textContent = '못 만들었다 — ' + (message.denied || '');
		} else if (message.succeeded) {
			const made = craftBook.find((one) => one.recipeId === message.recipeId);
			document.getElementById('craftresult').textContent =
				'만들었다 — ' + (made ? made.name : '') + ' ' + message.amount + '개';
		} else {
			document.getElementById('craftresult').textContent = '실패했다 — 재료는 들었다';
		}

		drawCraftPicker();
		return;
	}

	if (message.type === 'spellbook') {
		spellbook = message.pages || [];
		keepCatalog('spellbook', message);
		return;
	}

	if (message.type === 'denied') {
		// 거절도 대답이다 — 조용히 실패하면 사람은 「고장났나」로 읽는다.
		waitingFor = null;
		statusElement.textContent = message.why;
		return;
	}

	if (message.type === 'chest') {
		openChest = { x: message.x, y: message.y, z: message.z };
		chestItems = message.items || [];
		drawChest();
		return;
	}

	if (message.type === 'invite') {
		document.getElementById('invitecode').textContent = message.code || '(못 만들었다)';
		return;
	}

	if (message.type === 'linked') {
		// 이었어도 지금 붙어 있는 인형은 안 바뀐다 — 다시 들어와야 그 사람이다.
		statusElement.textContent = message.ok
			? `이었다 — 새로고침하면 ${message.identityId}번 사람으로 들어간다`
			: '그 열쇠는 안 통한다(이미 썼거나 없는 열쇠다)';
		return;
	}

	if (message.type === 'brewtaken') {
		// 무엇이 나왔는지는 세계가 정해서 보내 준다 — 창이 우기지 않는다.
		// ⚠ 「못 닿았다」를 itemId 0 으로 읽으면 안 된다: 게임의 나무가 0번이라,
		//   나무가 나오는 쪽에 닿은 판이 「아무것도 못 얻었다」로 표시된다. 개수로 본다.
		if (message.amount === 0) {
			statusElement.textContent = `${message.steps}번 저었지만 아무 쪽에도 못 닿았다 — 솥만 비었다`;
		} else {
			const name = itemNames[message.itemId] || `#${message.itemId}`;
			statusElement.textContent =
				`${GRADES[message.grade] || ''} ${message.recipe || name} ${message.amount}개 — 가방에 들어갔다`.trim();
		}
		return; // 가방은 서버가 곧바로 다시 보내 준다(물어볼 필요 없다)
	}

	// ★ 여기부터는 저 세계다 (TASK-WM-254) — 주소를 갈아타고 통행증을 낸다.
	//   사람에게는 <b>걸어서 넘어간 것</b>으로 보여야 한다: 화면이 안 꺼지고 그대로 이어진다.
	if (message.type === 'moveon') {
		// ⚠ 넘어가다 <b>못 닿으면 돌아온다</b> (TASK-WM-256): 보낸 세계는 이미 나를 내보냈고
		//   받는 세계가 안 열리면 나는 <b>어디에도 없는 사람</b>이 된다(가방째 사라진다).
		//   통행증에는 신원과 가방이 들어 있으니, 그걸 들고 원래 세계로 돌아가면 그대로 선다.
		cameFrom = worldAddress();
		travelPass = message.pass;
		passKeptFor = message.pass;
		worldAt = message.address;
		statusElement.textContent = `${message.zone} 으로 넘어간다`;
		crossOver(message.address);
		return;
	}

	// 그 번호는 세계가 처리했다 (TASK-WM-305) — 이제 손을 놓는다(다시 안 보낸다).
	if (message.type === 'did') {
		waitingActions.delete(message.did);
		return;
	}

	// 네 걸음을 여기까지 봤다 (TASK-WM-271) — 답 온 걸음은 버리고, 나머지만 다시 굴린다.
	if (message.type === 'stepseen') {
		stepsWaiting = stepsWaiting.filter((one) => one.seq > message.seq);
		replayMySteps();
		return;
	}

	// 누가 맞았다 (TASK-WM-251) — 몸은 <b>세계가 준 값</b>만 쓴다(스스로 셈하면 갈라진다).
	if (message.type === 'hurt') {
		health.set(message.dollId, message.health);
		if (message.dollId === myId) {
			statusElement.textContent = message.down ? '쓰러졌다 — 다시 세워졌다' : `맞았다 (${message.health})`;
		}

		return;
	}

	// 누가 한 말 — 그 사람 이름표에 잠깐 붙는다 (TASK-WM-250). 판을 새로 만들지 않는다.
	if (message.type === 'said') {
		heard.set(message.dollId, { text: message.text, until: performance.now() + SAID_SHOWS_FOR_MS });
		statusElement.textContent = `${message.name || '누군가'}: ${message.text}`;
		return;
	}

	if (message.type === 'welcome') {
		myId = message.id;

		// 끊겨 있는 동안 눌러 둔 것 · 답 못 받은 것을 다시 보낸다 (TASK-WM-305).
		resendWaitingActions();

		// 이 서버 판의 낱말표 도장 — 다음에 붙을 때 되돌려 주면 그것들을 안 받는다 (TASK-WM-238).
		try {
			if (message.catalogStamp) sessionStorage.setItem('wm.world.catalogstamp', message.catalogStamp);
		} catch (e) { /* 못 적어도 게임은 돈다 — 그냥 다시 받을 뿐이다 */ }

		// 새 열쇠를 줬으면 적어 둔다(빈 값으로 덮어쓰지 않는다 — 잃으면 새 사람이 된다).
		if (message.secret) {
			try { localStorage.setItem(KEY_NAME, message.secret); } catch (e) { /* 저장 못 해도 게임은 돈다 */ }
		}

		// ⚠ 다시 붙었으면(또는 저 세계로 넘어왔으면) 걸음 번호는 <b>처음부터</b>다 —
		//   저쪽 세계는 내 옛 번호를 모른다. 안 비우면 답이 영영 안 와 되감기가 멈춘다.
		stepNumber = 0;
		stepsWaiting = [];
		sentUpTo = null;

		document.getElementById('me').textContent = message.identityId ? `${message.identityId}번 사람` : '손님';
		return;
	}

	if (message.type === 'names') {
		// 이름은 거의 안 바뀌니 바뀔 때만 온다 — 창이 들고 있다가 인형에 붙인다.
		for (const one of message.dolls) dollNames[one.id] = one.name;
		return;
	}

	if (message.type === 'me') {
		// 사람이 몰린 자리에서는 소식 한 벌을 여럿이 같이 쓴다 — 그 한 벌에 내가 안 들어갔을 때
		// 세계가 내 자리만 따로 알려 준다. 내가 안 보이면 화면이 통째로 멎으니 꼭 끼워 넣는다.
		myPlaceFromWorld = message.doll;
		return;
	}

	if (message.type === 'world') {
		// ★ <b>첫 전체 그림은 번호가 낮아도 받는다</b> (TASK-WM-301).
		//   판이 뒤바뀌어 오면(지연 0 인 회선에서 실측: seq 10 → 9) 진짜 첫 전체 그림이
		//   「지난 판」으로 버려지고, 그러면 창은 붙은 채로 <b>텅 빈 세계</b>를 본다.
		//   세계 쪽도 순서를 지키게 고쳤지만(WM-301), 창도 스스로를 지킨다.
		// 세계의 도장을 기억해 둔다 (TASK-WM-303) — 내가 보내는 말에 그대로 얹어 회선을 재게 한다.
		if (typeof message.at === 'number') lastWorldAt = message.at;

		const wholeWorld = message.changed !== true;
		const firstWholeWorld = sawWholeWorld === false && wholeWorld;
		if (firstWholeWorld) sawWholeWorld = true;
		else if (message.sequence > 0 && message.sequence <= lastWorldSequence) return;

		if (message.sequence > 0) lastWorldSequence = message.sequence;

		// ★ 여기서 세우지 않는다 — <b>가장 최근 것만</b> 다음 프레임에 세운다.
		//   사람이 200명이면 세계는 초당 13번 10KB 를 보낸다. 도착할 때마다 인형 200개를
		//   세우면 화면 그리는 일이 밀리고, 밀리면 메시지도 늦게 열어 보게 된다
		//   (실측: 200명에서 창이 초당 5.6건밖에 못 열었다). 화면은 초당 60번 그리므로
		//   그 사이에 온 판은 어차피 지나간 것이다 — 마지막 것만 쓰면 된다.
		//
		// ⚠ 단, <b>밀린 것을 되읽는 중</b>이면 그때그때 세운다 (TASK-WM-234): 엔진보다 먼저 열어 둔
		//   줄에서 받아 둔 말을 한꺼번에 넘겨받을 때 「마지막 것만」을 적용하면 <b>첫 전체 그림</b>이
		//   통째로 버려진다 — 들판 67자리가 0 이 됐다(실측 2026-08-12, 관문이 잡았다).
		//   지나간 판을 건너뛰는 것과 안 읽고 버리는 것은 다르다.
		//
		// ⚠ <b>덮어쓰면 「나갔다」가 사라진다</b> (TASK-WM-306, 실측 2026-08-13): 한 프레임 사이에
		//   판이 둘 오면 앞의 것이 통째로 버려진다. 자리 값은 뒤 판이 어차피 다시 말해 주지만,
		//   <b>「그 사람 나갔다」(gone)는 한 번밖에 안 온다</b> — 그 판이 버려지면 그 사람은
		//   그 창에 <b>영영 유령으로</b> 남는다(세 번에 한 번 꼴로 재현: 270ms · 270ms · 20초+ 안 사라짐).
		//   그래서 덮어쓰지 말고 <b>합친다</b>.
		pendingWorld = mergePlates(pendingWorld, message);

		// ★ <b>첫 전체 그림은 그 자리에서 세운다</b> (TASK-WM-301).
		//   화면은 초당 60번 그리지만 세계는 초당 20번 말한다 — 그래서 「마지막 것만」 세우는데,
		//   첫 프레임이 돌기 <b>전에</b> 「바뀐 것만」 판이 뒤이어 오면 그 판이 첫 전체 그림을 덮는다.
		//   그러면 창은 <b>바탕이 없는 채로</b> 델타만 쌓아 텅 빈 세계를 그린다(실측: 지연 0 회선에서
		//   처음 세운 판이 seq 14 델타였다 — 앞의 전체 그림 다섯 장이 통째로 지나갔다).
		if (replaying || firstWholeWorld)
			applyPendingWorld();

		return;
	}
}

// 첫 접속 — 이 뒤로는 끊길 때마다 위 계획이 스스로 다시 붙는다.
connect();

// ── 말할 자리 (TASK-WM-268) ────────────────────────────────────────────
//
// ★ 왜: 세계는 말을 나를 줄 알고(WM-250), 남의 말을 이름표에 띄울 줄도 안다. 그런데 창에
//   <b>말할 자리</b>가 없어서 사람은 한 마디도 못 했다 — 같이 노는 세계에서 말은 곁다리가
//   아니라 최소 조건이다(혼자 걷는 화면과 같이 노는 세계를 가르는 것이 그것이다).
//
// Enter 로 열고, Enter 로 보내고, Esc 로 그만둔다 — 게임에서 몸에 밴 그 손놀림 그대로.
const sayBox = document.getElementById('saybox');

function openSayBox() {
	sayBox.focus();
	sayBox.select();
}

function sendWhatISaid() {
	const line = sayBox.value.trim();
	sayBox.value = '';
	sayBox.blur();
	if (line.length === 0) return;

	// 말도 <b>답이 올 때까지 들고 있는다</b> (TASK-WM-307) — 끊기는 순간 친 말이 사라지면
	//   사람은 그걸 「무시당했다」로 읽는다(실측: 대조군은 들리고, 끊기면 아무도 못 들었다).
	doAction({ type: 'say', text: line });
}

sayBox.addEventListener('keydown', (event) => {
	if (event.key === 'Enter') {
		// ⚠ 여기서 <b>안 막으면</b> 같은 Enter 가 창 전체로 흘러가 말할 자리를 <b>도로 연다</b> —
		//   보내자마자 다시 열려서 걷기가 죽는다(관문이 잡았다).
		event.preventDefault();
		event.stopPropagation();
		sendWhatISaid();

});

// ── 사람의 손 ──────────────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
	// 이름을 적는 중에는 걷지 않는다 — 글자를 치다 세계가 움직이면 창이 고장 난 것처럼 보인다.
	if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

	// 어디서든 Enter 면 말할 자리가 열린다 — 손이 자판을 안 떠난다.
	if (e.key === 'Enter') {
		e.preventDefault();
		openSayBox();
		return;
	}

	pressed[e.key] = true;
});
window.addEventListener('keyup', (e) => { pressed[e.key] = false; });
window.addEventListener('blur', () => { for (const key of Object.keys(pressed)) pressed[key] = false; });

function axis(negativeKeys, positiveKeys) {
	let value = 0;
	for (const key of negativeKeys) if (pressed[key]) value -= 1;
	for (const key of positiveKeys) if (pressed[key]) value += 1;
	return value;
}

// 보내는 것은 「어디로 가고 싶다」뿐. 얼마나 갈 수 있는지는 서버가 정한다.
// ★ 눈이 돌아간 만큼 방향도 돌린다 — 3D 에서 「위로 가기」는 화면 위쪽이지 세계의 +Z 가 아니다.
function cameraRelativeMove(right, forward) {
	const length = Math.hypot(right, forward);
	if (length === 0) return null;

	const forwardVec = new THREE.Vector3();
	camera.getWorldDirection(forwardVec);
	forwardVec.y = 0;
	forwardVec.normalize();

	const rightVec = new THREE.Vector3().crossVectors(forwardVec, camera.up).normalize();
	return {
		x: (right * rightVec.x + forward * forwardVec.x) / length,
		z: -((right * rightVec.z + forward * forwardVec.z) / length),
	};
}

function updateLocalMovement(dt) {
	if (myId === null) return;

	const selfView = dollViews.get(myId);
	if (!selfView) return;

	const right = axis(['ArrowLeft', 'a', 'A'], ['ArrowRight', 'd', 'D']);
	const forward = axis(['ArrowDown', 's', 'S'], ['ArrowUp', 'w', 'W']);
	if (right === 0 && forward === 0) return;

	// ★ 눈이 돌아간 만큼 방향도 돌린다 — 3D 에서 「위로 가기」는 화면 위쪽이지 세계의 +Z 가 아니다.
	//   지도(2D)는 눈이 안 돌아가므로 세계의 +Z 를 앞으로 쓴다. 셈은 같고 앞쪽만 다르다.
	const ahead = new THREE.Vector3();
	camera.getWorldDirection(ahead);

	const next = stepTowards({ x: selfView.targetX, z: selfView.targetZ }, right, forward, dt,
		{ x: ahead.x, z: -ahead.z });
	selfView.targetX = next.x;
	selfView.targetZ = next.z;
}

/*
 * <b>되감아 다시 굴리기</b> (TASK-WM-271).
 *
 * ★ 왜: 전에는 매번 「내가 그리는 자리 − <b>세계가 아는 자리</b>」를 걸음으로 보냈다. 그런데
 *   세계가 아는 자리는 회선만큼 낡았다 — 방금 보낸 걸음이 아직 반영 안 된 자리다. 그래서
 *   같은 땅을 여러 번 보내고, 세계는 그걸 잘라 내며 따라온다. 앞섬이 회선에 <b>비례해</b>
 *   자란 이유가 그것이다(WM-270 실측: 왕복 200ms 에 1.9m, 800ms 에 4.0m → 뒤로 끌려감).
 *
 * ★ 그래서 걸음마다 번호를 붙이고, 세계는 「여기까지 봤다」를 돌려준다(stepseen).
 *   창은 세계가 아는 자리에서 <b>되감아</b> 아직 답 안 온 걸음만 다시 얹는다 —
 *   그러면 앞섬은 <b>아직 답 안 온 걸음만큼</b>이고, 회선이 아무리 늦어도 안 자란다.
 */
let stepNumber = 0;
let stepsWaiting = [];      // 아직 「봤다」가 안 온 걸음들
let sentUpTo = null;        // 마지막으로 보낸 걸음까지 갔을 때의 자리
let lastWorldAt = 0;        // 세계 그림에 찍혀 온 도장 — 내 말에 그대로 얹는다 (TASK-WM-303)

/** 세계가 아는 자리 + 아직 답 안 온 걸음 = <b>세계가 곧 알게 될</b> 내 자리. */
function whereWorldWillPutMe(selfView) {
	let x = selfView.serverX;
	let z = selfView.serverZ;
	for (const one of stepsWaiting) {
		x += one.x;
		z += one.z;
	}

	return { x, z };
}

/** 세계 소식이 왔다 — 되감아 다시 굴린다(아직 안 보낸 몫은 그대로 얹어 둔다). */
function replayMySteps() {
	const selfView = myId === null ? null : dollViews.get(myId);
	if (!selfView) return;

	const base = whereWorldWillPutMe(selfView);
	const pendingX = sentUpTo === null ? 0 : selfView.targetX - sentUpTo.x;
	const pendingZ = sentUpTo === null ? 0 : selfView.targetZ - sentUpTo.z;

	selfView.targetX = base.x + pendingX;
	selfView.targetZ = base.z + pendingZ;
	sentUpTo = base;
}

setInterval(() => {
	if (socket === null || socket.readyState !== WebSocket.OPEN || myId === null) return;

	// 국경을 넘는 중이면 옛 세계에 걸음을 안 보낸다 — 곧 놓을 줄이고, 저쪽이 자리를 정한다.
	if (crossing !== null) return;

	const selfView = dollViews.get(myId);
	if (!selfView) return;

	// 보낼 걸음은 <b>이미 보낸 데서부터</b>의 차이다 — 세계가 아는 자리에서 재면 같은 땅을 또 보낸다.
	const from = sentUpTo === null ? whereWorldWillPutMe(selfView) : sentUpTo;
	const step = stepToSend({ x: selfView.targetX, z: selfView.targetZ }, from);
	if (step === null) return;

	stepNumber += 1;
	stepsWaiting.push({ seq: stepNumber, x: step.x, z: step.z });
	sentUpTo = { x: from.x + step.x, z: from.z + step.z };
	tell({ type: 'move', x: step.x, z: step.z, seq: stepNumber, ack: lastWorldAt });
}, SEND_EVERY_MS);

// 드래그로 둘러보기 — 세계를 도는 것은 눈뿐이고, 세계 자체는 서버 것이다.
let dragging = null;
canvas.addEventListener('pointerdown', (event) => {
	dragging = { x: event.clientX, y: event.clientY, moved: 0, angle: orbit.angle, height: orbit.height };
	canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', (event) => {
	if (dragging === null) return;

	const dx = event.clientX - dragging.x;
	const dy = event.clientY - dragging.y;
	dragging.moved += Math.abs(dx) + Math.abs(dy);
	orbit.angle = dragging.angle - dx * 0.006;
	orbit.height = Math.min(38, Math.max(4, dragging.height + dy * 0.05));
});
canvas.addEventListener('pointerup', (event) => {
	const drag = dragging;
	dragging = null;
	canvas.releasePointerCapture(event.pointerId);

	// 끌었으면 둘러본 것이고, 안 끌었으면 지은 것이다 — 둘을 섞으면 둘러보다 집이 선다.
	if (drag === null || drag.moved > 6) return;
	placeAt(event.clientX, event.clientY);
});
canvas.addEventListener('wheel', (event) => {
	event.preventDefault();
	orbit.distance = Math.min(60, Math.max(8, orbit.distance + Math.sign(event.deltaY) * 2));
}, { passive: false });

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

/**
 * 세계에 <b>말을 건넨다</b> — 모든 보내기는 이 문 하나로 나간다 (TASK-WM-232).
 *
 * ★ 왜 한 문인가: 보내는 자리가 열다섯 군데였는데 그중 하나(가방 줄 눌러 상자에 넣기)에
 *   「줄이 열려 있나」 검사가 <b>빠져 있었다</b>. 끊긴 동안 그 줄을 누르면 창이 터진다
 *   (InvalidStateError). 자리마다 손으로 지키면 언젠가 하나를 빠뜨린다 — 문을 하나로 모은다.
 *
 * ★ 그리고 <b>왜 안 됐는지 말해 준다</b>: 지금까지는 끊겼을 때 눌러도 아무 일도 안 일어났다.
 *   사람에게는 「눌렀는데 반응이 없다」 = 고장이다. 끊긴 것과 무시된 것은 다른 일이고,
 *   그 차이를 화면이 말해 줘야 한다.
 */
/*
 * <b>누른 것이 사라지지 않게</b> (TASK-WM-305).
 *
 * ★ 무엇이 있었나: 줍기를 보낸 <b>그 순간</b> 회선이 끊기면 그 줍기는 조용히 사라졌다 —
 *   가방도 들판도 그대로고, 창은 아무 말도 안 했다(실측: 회선을 안 끊으면 잘 주워진다).
 *   사람에게는 「눌렀는데 안 됐다」만 남는다.
 *
 * ★ 어떻게: 행동마다 번호를 붙이고, 세계가 <b>「그 번호 했다」</b>(did)고 할 때까지 들고 있는다.
 *   다시 붙으면 아직 답 못 받은 것만 다시 보낸다. 세계는 같은 번호를 두 번 안 한다(ActionOnce).
 *   걸음은 여기 안 들어간다 — 걸음은 다음 걸음이 곧 고쳐 주므로 다시 보낼 이유가 없다.
 */
let actionNumber = 0;
const waitingActions = new Map();

/** 행동 하나를 보낸다 — 번호를 붙이고, 답이 올 때까지 들고 있는다. */
function doAction(message) {
	actionNumber += 1;
	const numbered = { ...message, did: actionNumber };
	waitingActions.set(actionNumber, numbered);

	// 줄이 끊겨 있어도 <b>들고 있는다</b> — 다시 붙는 순간 나간다(그게 이 장치의 전부다).
	if (socket !== null && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(numbered));
	else statusElement.textContent = '끊겼다 — 다시 붙으면 보낸다';

	return true;
}

/** 다시 붙었다 — 답 못 받은 것을 다시 보낸다. */
function resendWaitingActions() {
	if (socket === null || socket.readyState !== WebSocket.OPEN) return;

	for (const numbered of waitingActions.values()) socket.send(JSON.stringify(numbered));
}

function tell(message) {
	if (socket === null || socket.readyState !== WebSocket.OPEN) {
		statusElement.textContent = '끊겼다 — 다시 붙는 중이다';
		return false;
	}

	socket.send(JSON.stringify(message));
	return true;
}

/*
 * <b>누르면 곧바로 대답한다</b> (TASK-WM-283).
 *
 * ★ 왜: 걸음은 앞질러 그려서 곧바로 움직인다(WM-271). 그런데 줍기·짓기는 세계의 답을 기다린다 —
 *   왕복 200ms 회선에서 <b>271ms 동안 화면이 아무 말도 안 했다</b>(실측). 사람은 그 시간을
 *   「안 눌렸다」로 읽고 또 누른다. 그게 「반응이 굼뜬 게임」의 정체다.
 *
 * ★ 세계의 답을 <b>지어내지는 않는다</b> — 「줍는 중…」이라고만 한다. 무엇을 얻었는지는 세계가 말한다.
 */
function askedFor(what) {
	waitingFor = what;
	statusElement.textContent = `${what}…`;
}

function gotAnswer(said) {
	if (waitingFor === null) return;

	waitingFor = null;
	if (said) statusElement.textContent = said;
}

/** 누른 자리를 땅의 칸으로 바꿔 「여기 짓고 싶다」를 보낸다. 겹치는지는 서버가 본다. */
function placeAt(clientX, clientY) {
	pointer.x = (clientX / window.innerWidth) * 2 - 1;
	pointer.y = -(clientY / window.innerHeight) * 2 + 1;
	raycaster.setFromCamera(pointer, camera);

	// 주울 것을 눌렀으면 줍는다 — 땅을 눌렀을 때만 짓는다(둘을 섞으면 주우려다 집이 선다).
	const onNode = raycaster.intersectObjects(nodeGroup.children);
	if (onNode.length > 0) {
		if (doAction({ type: 'gather', nodeId: onNode[0].object.userData.nodeId })) askedFor('줍는 중');
		return;
	}

	// 부수기는 세워진 것을 눌러 고른다 — 빈 땅을 눌러 봐야 부술 게 없다.
	if (breaking) {
		const onBuilding = raycaster.intersectObjects(buildingGroup.children);
		if (onBuilding.length === 0) return;

		const cell = onBuilding[0].object.userData.cell;
		if (cell) doAction({ type: 'remove', x: cell.x, y: cell.y, z: cell.z });
		return;
	}

	// 세워진 것을 누르면 상자를 열어 본다 — 상자가 아니면 세계가 빈 목록을 준다.
	const onBuilt = raycaster.intersectObjects(buildingGroup.children);
	if (onBuilt.length > 0) {
		const cell = onBuilt[0].object.userData.cell;
		if (cell) {
			// 솥이면 그 솥을 고른다 — 여럿이 각자 자기 솥에서 젓는다.
			const pot = cauldrons.find((one) => one.x === cell.x && one.z === cell.z);
			if (pot) {
				myPot = { x: pot.x, y: pot.y, z: pot.z };
				statusElement.textContent = `(${pot.x}, ${pot.z}) 솥을 쓴다`;
				drawWorldLines();
				return;
			}

			tell({ type: 'chestask', x: cell.x, y: cell.y, z: cell.z });
			return;
		}
	}

	const hits = raycaster.intersectObject(ground);
	if (hits.length === 0 || pickedBuilding === null) return;

	const point = hits[0].point;
	const cellX = Math.floor(point.x);
	const cellZ = Math.floor(-point.z); // three 의 -Z 가 세계의 +Z 다(카메라가 그쪽을 본다)

	// 크기는 안 보낸다 — 세계가 안다(창이 「이건 1×1 이다」로 우길 자리를 없앤다).
	if (doAction({ type: 'place', x: cellX, y: 0, z: cellZ, buildingId: pickedBuilding })) askedFor('짓는 중');
}

// ── 판들 ───────────────────────────────────────────────────────────────
const SEASONS = ['봄', '여름', '가을', '겨울'];
const GRADES = ['실패', '조악품', '양품', '명품'];

function drawWorldLines() {
	if (time) {
		const season = SEASONS[time.season % SEASONS.length];
		const minute = time.minute < 10 ? `0${time.minute}` : String(time.minute);
		document.getElementById('clock').textContent =
			`${time.year}년 ${season} ${time.day}일  ${time.hour}:${minute}`;
	}

	document.getElementById('peers').textContent = `◈ ${dolls.length}명`;

	// 고른 솥이 있으면 그 솥을 본다 — 없으면 옛 전역 솥.
	const mine = myPot === null ? null : cauldrons.find((one) => one.x === myPot.x && one.z === myPot.z);
	document.getElementById('potwhere').textContent = mine
		? `(${mine.x}, ${mine.z}) 솥`
		: '솥이 없다 — 솥을 짓고 눌러서 고른다';

	if (mine) brew = { x: mine.px, y: mine.py, steps: mine.steps, side: mine.side, path: [] };

	let brewText = '아직 안 저음';
	if (brew && brew.steps > 0) {
		brewText = `${brew.steps}번 저음`;
		if (brew.side > 0) brewText += ` · 부작용 ${brew.side.toFixed(2)}`;
	}
	document.getElementById('brew').textContent = brewText;

	// 지금 어느 쪽에 가까운가 — 이게 없으면 「무엇을 만드는 중인지」 모른 채 젓는다.
	//   계산은 순수 모듈이 한다(picker.mjs) — 판정 층과 답이 갈라지지 않게 골든 표가 묶는다.
	document.getElementById('aiming').textContent = aimingText(spellbook, brew || { x: 0, y: 0 });
}

/**
 * 지을 것 고르기 — <b>가진 재료로 지을 수 있는지</b>를 그 자리에서 보여 준다.
 * 없으면 「왜 안 되지」를 눌러 봐야 알게 된다(그건 손해만 보는 배움이다).
 */
function drawBuildPicker() {
	const picker = document.getElementById('buildpick');
	if (buildKinds.length === 0) return;

	const chosen = pickedBuilding;
	picker.textContent = '';

	for (const kind of buildKinds) {
		const option = document.createElement('option');
		option.value = kind.buildingId;

		option.textContent = buildLabel(kind, bag, itemNames);
		picker.appendChild(option);
	}

	pickedBuilding = chosen !== null ? chosen : buildKinds[0].buildingId;
	picker.value = pickedBuilding;
}

/**
 * 만들 것 고르기 — 재료와 성공률을 그 자리에서 보여 준다.
 * 「왜 안 되지」를 눌러 봐야 알게 되면 그건 손해만 보는 배움이다.
 */
function drawCraftPicker() {
	const picker = document.getElementById('craftpick');
	if (craftBook.length === 0) return;

	const chosen = pickedRecipe;
	picker.textContent = '';

	for (const recipe of craftBook) {
		const option = document.createElement('option');
		option.value = recipe.recipeId;

		option.textContent = craftLabel(recipe, bag, itemNames);
		picker.appendChild(option);
	}

	pickedRecipe = chosen !== null ? chosen : craftBook[0].recipeId;
	picker.value = pickedRecipe;
}

/** 가방 — 번호가 아니라 이름으로 보인다(낱말표를 못 받았으면 번호로 버틴다). */
function drawBag() {
	const host = document.getElementById('bag');
	host.textContent = '';

	if (bag.length === 0) {
		const empty = document.createElement('div');
		empty.className = 'empty';
		empty.textContent = '비었다';
		host.appendChild(empty);
		return;
	}

	for (const entry of bag) {
		const row = document.createElement('div');
		row.className = 'row';

		const name = document.createElement('span');
		// textContent 로 넣는다 — 이름은 사람이 지은 글자라, 그림표로 읽히면 안 된다.
		name.textContent = itemNames[entry.itemId] || `#${entry.itemId}`;

		const amount = document.createElement('span');
		amount.className = 'amount';
		amount.textContent = entry.amount;

		row.appendChild(name);
		row.appendChild(amount);

		// 상자를 열어 뒀으면 가방 줄을 눌러 하나씩 넣는다 — 넣고 꺼내기가 한 화면에서 된다.
		row.style.cursor = 'pointer';
		row.title = '상자를 열어 두면 눌러서 하나 넣기';
		row.addEventListener('click', () => {
			if (openChest === null) return;
			doAction({ type: 'chestput', x: openChest.x, y: openChest.y, z: openChest.z, itemId: entry.itemId, amount: HowMany(entry.amount) });
		});

		host.appendChild(row);
	}
}

// ── 세계를 세우기 ──────────────────────────────────────────────────────
const BUILDING_HEIGHT = 1.6;

// 서버가 정한 손 닿는 거리 — 창은 「닿는지」를 미리 보여 주기만 한다(판정은 서버).
const REACH = 2.5;

/** 이름표를 붙이는 거리 — 멀리까지 붙이면 글자밭이 되어 오히려 안 보인다. */
const LABEL_RANGE = 14;

function clearGroup(group) {
	while (group.children.length > 0) {
		const child = group.children.pop();
		if (child.geometry && child.geometry !== buildingGeometry && child.geometry !== dollGeometry)
			child.geometry.dispose();
	}
}

function rebuildWorld() {
	clearGroup(buildingGroup);
	for (const building of buildings) {
		// 기준 칸에서 -X, +Z 로 퍼진다 — 규칙은 서버가 알고, 창은 받은 대로 세운다.
		const box = new THREE.Mesh(buildingGeometry, buildingMaterial);
		box.scale.set(building.w, BUILDING_HEIGHT, building.l);
		box.position.set(
			building.x - (building.w - 1) / 2 + 0.5,
			BUILDING_HEIGHT / 2 + building.y,
			-(building.z + (building.l - 1) / 2) - 0.5
		);
		box.userData.cell = { x: building.x, y: building.y, z: building.z };
		buildingGroup.add(box);

		const edges = new THREE.LineSegments(new THREE.EdgesGeometry(buildingGeometry), buildingEdge);
		edges.scale.copy(box.scale);
		edges.position.copy(box.position);
		buildingGroup.add(edges);
	}

	clearGroup(nodeGroup);
	const me = myPlace();
	for (const node of gatherables) {
		const gap = (node.x - me.x) ** 2 + (node.z - me.z) ** 2;
		const near = gap <= REACH * REACH;
		const pole = new THREE.Mesh(nodeGeometry, near ? nodeNear : nodeFar);
		pole.position.set(node.x, 0.45, -node.z);
		pole.userData.nodeId = node.id;
		nodeGroup.add(pole);

		// 무엇인지 모르면 아무거나 줍게 된다 — 가까운 것에만 이름을 붙인다(멀리까지 붙이면 글자밭).
		if (gap <= LABEL_RANGE * LABEL_RANGE) {
			const tag = makeNameTag(`${itemNames[node.itemId] || '#' + node.itemId} ${node.amount}`);
			tag.position.set(node.x, 1.3, -node.z);
			tag.scale.set(1.8, 0.45, 1);
			nodeGroup.add(tag);
		}
	}

	// 솥·상자도 무엇인지 보여 준다 — 네모만 서 있으면 어느 게 솥인지 모른다.
	for (const building of buildings) {
		const gap = (building.x - me.x) ** 2 + (building.z - me.z) ** 2;
		if (gap > LABEL_RANGE * LABEL_RANGE) continue;

		const kind = buildKinds.find((one) => one.buildingId === building.buildingId);
		if (!kind) continue;

		const tag = makeNameTag(kind.name);
		tag.position.set(building.x, 2.2, -building.z);
		tag.scale.set(2.0, 0.5, 1);
		nodeGroup.add(tag);
	}

	clearGroup(dollGroup);
	for (const doll of dolls) {
		const body = new THREE.Mesh(dollGeometry,
			doll.id === myId ? myMaterial : (isBeyond(doll.id) ? beyondMaterial : otherMaterial));
		body.position.set(doll.x, 0.67, -doll.z);
		dollGroup.add(body);

		// 이름표 — 누가 누구인지 모르면 「같이 논다」가 아니다(그림이 아니라 글자다).
		if (doll.name) {
			const tag = makeNameTag(doll.name);
			tag.position.set(doll.x, 1.7, -doll.z);
			dollGroup.add(tag);
		}
	}
}

function rebuildStaticWorld() {
	clearGroup(buildingGroup);
	clearGroup(nodeGroup);
	clearGroup(staticLabelGroup);
	nodeViews.clear();

	const me = myPlace();
	for (const building of buildings) {
		const box = new THREE.Mesh(buildingGeometry, buildingMaterial);
		box.scale.set(building.w, BUILDING_HEIGHT, building.l);
		box.position.set(
			building.x - (building.w - 1) / 2 + 0.5,
			BUILDING_HEIGHT / 2 + building.y,
			-(building.z + (building.l - 1) / 2) - 0.5
		);
		box.userData.cell = { x: building.x, y: building.y, z: building.z };
		buildingGroup.add(box);

		const edges = new THREE.LineSegments(buildingEdgesGeometry, buildingEdge);
		edges.scale.copy(box.scale);
		edges.position.copy(box.position);
		buildingGroup.add(edges);

		const gap = (building.x - me.x) ** 2 + (building.z - me.z) ** 2;
		if (gap > LABEL_RANGE * LABEL_RANGE) continue;

		const kind = buildKinds.find((one) => one.buildingId === building.buildingId);
		if (!kind) continue;

		const tag = makeNameTag(kind.name);
		tag.position.set(building.x, 2.2, -building.z);
		tag.scale.set(2.0, 0.5, 1);
		staticLabelGroup.add(tag);
	}

	for (const node of gatherables) {
		const gap = (node.x - me.x) ** 2 + (node.z - me.z) ** 2;
		const near = gap <= REACH * REACH;
		const pole = new THREE.Mesh(nodeGeometry, near ? nodeNear : nodeFar);
		pole.position.set(node.x, 0.45, -node.z);
		pole.userData.nodeId = node.id;
		nodeGroup.add(pole);
		nodeViews.set(node.id, { x: node.x, z: node.z, mesh: pole });

		if (gap <= LABEL_RANGE * LABEL_RANGE) {
			const tag = makeNameTag(`${itemNames[node.itemId] || '#' + node.itemId} ${node.amount}`);
			tag.position.set(node.x, 1.3, -node.z);
			tag.scale.set(1.8, 0.45, 1);
			staticLabelGroup.add(tag);
		}
	}
}

function syncDolls() {
	const alive = new Set();

	for (const doll of dolls) {
		alive.add(doll.id);
		let view = dollViews.get(doll.id);
		if (!view) {
			const body = new THREE.Mesh(dollGeometry, doll.id === myId ? myMaterial : otherMaterial);
			dollGroup.add(body);
			body.position.set(doll.x, 0.67, -doll.z);
			view = {
				body,
				isLocal: doll.id === myId,
				tag: null,
				name: '',
				targetX: doll.x,
				targetZ: doll.z,
				serverX: doll.x,
				serverZ: doll.z,
			};
			dollViews.set(doll.id, view);
		}

		view.body.material = doll.id === myId ? myMaterial : (isBeyond(doll.id) ? beyondMaterial : otherMaterial);
		view.isLocal = doll.id === myId;
		view.beyond = isBeyond(doll.id);
		view.serverX = doll.x;
		view.serverZ = doll.z;
		if (doll.id !== myId) {
			view.targetX = doll.x;
			view.targetZ = doll.z;
		}

		if (doll.name) {
			if (!view.tag || view.name !== doll.name) {
				if (view.tag) dollGroup.remove(view.tag);
				view.tag = makeNameTag(doll.name);
				dollGroup.add(view.tag);
				view.name = doll.name;
			}
			view.tag.position.set(view.body.position.x, 1.7, view.body.position.z);
		} else if (view.tag) {
			dollGroup.remove(view.tag);
			view.tag = null;
			view.name = '';
		}
	}

	for (const [dollId, view] of dollViews) {
		if (alive.has(dollId)) continue;
		dollGroup.remove(view.body);
		if (view.tag) dollGroup.remove(view.tag);
		dollViews.delete(dollId);
	}
}

/** 내 화면의 나가 세계가 아는 나보다 <b>얼마나 앞섰나</b> (TASK-WM-270) — 재는 자리다. */
let worstLead = 0;

/** 너무 벌어져 <b>도로 끌려간</b> 횟수 — 사람이 「튄다」고 느끼는 그 순간이다. */
let snappedBack = 0;

function updateDollVisuals(dt) {
	for (const view of dollViews.values()) {
		const gapX = view.targetX - view.serverX;
		const gapZ = view.targetZ - view.serverZ;
		const distance = Math.hypot(gapX, gapZ);

		if (view.isLocal) {
			// ★ 내 화면의 나는 <b>앞서 있는 게 정상</b>이다 (앞질러 그리기) — 회선이 늦은 만큼
			//   세계가 아는 나보다 앞선다. 그걸 자꾸 당기면 걸음이 고무줄처럼 튄다.
			//   그래서 <b>많이</b> 벌어졌을 때만 옮긴다. 얼마나 자주 그러는지는 세어 둔다 —
			//   그 횟수가 늘면 사람은 「가끔 뒤로 끌려간다」로 느낀다 (TASK-WM-270).
			if (distance >= POSITION_TELEPORT_DISTANCE) {
				view.targetX = view.serverX;
				view.targetZ = view.serverZ;
				snappedBack += 1;
			}

			if (distance > worstLead)
				worstLead = distance;
		} else if (distance >= POSITION_TELEPORT_DISTANCE) {
			view.targetX = view.serverX;
			view.targetZ = view.serverZ;
		} else if (distance > POSITION_IGNORE_DISTANCE) {
			const pull = Math.min(1, POSITION_PULL_PER_SECOND * dt);
			view.targetX += gapX * pull;
			view.targetZ += gapZ * pull;
		}

		if (view.isLocal) {
			view.body.position.x = view.targetX;
			view.body.position.z = -view.targetZ;
		} else {
			const follow = 1 - Math.exp(-14 * dt);
			view.body.position.x += (view.targetX - view.body.position.x) * follow;
			view.body.position.z += (-view.targetZ - view.body.position.z) * follow;
		}
		if (view.tag) {
			view.tag.position.x = view.body.position.x;
			view.tag.position.z = view.body.position.z;
		}
	}
}

function updateNodeHighlights() {
	const nearLimit = REACH * REACH;
	const me = myPlace();
	for (const view of nodeViews.values()) {
		const gap = (view.x - me.x) ** 2 + (view.z - me.z) ** 2;
		view.mesh.material = gap <= nearLimit ? nodeNear : nodeFar;
	}
}

/** 내가 선 자리 — 눈이 여기를 따라온다. 아직 나를 모르면 세계의 원점을 본다. */
/** 이름표 하나 — 글자를 그려 항상 보는 쪽을 향하게 세운다. */
const nameTags = new Map();
function makeNameTag(name) {
	let texture = nameTags.get(name);
	if (texture === undefined) {
		const canvas = document.createElement('canvas');
		canvas.width = 256;
		canvas.height = 64;
		const paint = canvas.getContext('2d');
		paint.font = '28px system-ui, sans-serif';
		paint.textAlign = 'center';
		paint.textBaseline = 'middle';
		paint.fillStyle = '#d8d2e8';
		paint.fillText(name, 128, 32);

		texture = new THREE.CanvasTexture(canvas);
		nameTags.set(name, texture);
	}

	const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
	tag.scale.set(2.4, 0.6, 1);
	return tag;
}

function myPlace() {
	const selfView = myId === null ? null : dollViews.get(myId);
	if (selfView) {
		return { x: selfView.targetX, z: selfView.targetZ };
	}

	for (const doll of dolls) if (doll.id === myId) return doll;
	return { x: 0, z: 0 };
}

/** 하루가 도는 만큼 하늘빛이 돈다 — 「내가 없어도 밤이 온다」가 눈에 보여야 한다. */
const DAY_SKY = new THREE.Color('#3b3358');
const NIGHT_SKY = new THREE.Color('#0e0c14');
const skyColor = new THREE.Color();

function applyDaylight() {
	if (time == null) return;

	const hours = time.hoursPerDay > 0 ? time.hoursPerDay : 24;
	const turn = (time.hour + time.minute / 60) / hours;      // 0 = 자정
	const noon = Math.max(0, Math.sin((turn - 0.25) * Math.PI * 2)); // 정오에 1, 밤엔 0

	skyColor.copy(NIGHT_SKY).lerp(DAY_SKY, noon);
	scene.background = skyColor;
	scene.fog.color = skyColor;

	sun.intensity = 0.15 + noon * 1.0;
	sky.intensity = 0.25 + noon * 0.5;
	sun.position.set(Math.cos(turn * Math.PI * 2) * 20, 6 + noon * 22, Math.sin(turn * Math.PI * 2) * 20);
}

// 눈은 인형을 부드럽게 따라간다 — 딱 붙으면 20번/초의 스냅샷이 그대로 덜컹거린다.
const eyeTarget = new THREE.Vector3();
const eyeAt = new THREE.Vector3();

/** 도착만 해 둔 마지막 세계 소식을 화면에 세운다 — 한 프레임에 한 번. */
/**
 * 아직 안 세운 판 위에 새 판을 <b>합친다</b> (TASK-WM-306).
 *
 * ★ 규칙: 새 판이 <b>전부</b>면 그것이 곧 세계다(앞의 것은 버려도 된다).
 *   둘 다 「바뀐 것만」이면 사람·나감·들판을 이어 붙인다 — 뒤 판의 값이 이긴다(더 최신이다).
 */
function mergePlates(waiting, fresh) {
	if (waiting === null || fresh.changed !== true) return fresh;

	const dolls = new Map((waiting.dolls || []).map((one) => [one.id, one]));
	for (const one of fresh.dolls || []) dolls.set(one.id, one);

	const gone = [...(waiting.gone || []), ...(fresh.gone || [])];
	// 나갔다가 같은 판에 다시 온 사람은 <b>다시 온 쪽</b>이 이긴다(안 그러면 멀쩡한 사람이 지워진다).
	const goneNow = gone.filter((id) => (fresh.dolls || []).some((one) => one.id === id) === false);

	const merged = { ...waiting, ...fresh, dolls: [...dolls.values()], gone: goneNow };

	// ★ <b>통째 판이 델타 판에 먹히면 안 된다</b> (TASK-WM-343): 앞 판이 「들판 전부」인데 뒤 판이
	//   「바뀐 자리만」이면, 그냥 덮어쓸 경우 전부가 통째로 사라지고 창은 <b>낡은 들판 위에</b> 델타를 얹는다 —
	//   그러면 남이 주워 간 자리가 영영 남는다(밀린 창에서 실제로 그랬다).
	//   그러니 <b>전부를 먼저 깔고</b> 그 위에 델타를 얹는다.
	if (waiting.fieldChanged === false && waiting.gatherables !== undefined && fresh.fieldChanged === true) {
		const field = new Map((waiting.gatherables || []).map((one) => [one.id, one]));
		for (const one of fresh.gatherables || []) field.set(one.id, one);
		for (const goneId of fresh.fieldGone || []) field.delete(goneId);

		merged.gatherables = [...field.values()];
		merged.fieldChanged = false;   // 창은 이걸 <b>통째로</b> 받아들인다
		merged.fieldGone = [];
	} else if (waiting.fieldChanged === true && fresh.fieldChanged === true) {
		const field = new Map((waiting.gatherables || []).map((one) => [one.id, one]));
		for (const one of fresh.gatherables || []) field.set(one.id, one);

		merged.gatherables = [...field.values()];
		merged.fieldGone = [...(waiting.fieldGone || []), ...(fresh.fieldGone || [])];
	} else if (fresh.gatherables === undefined && waiting.gatherables !== undefined) {
		// 새 판이 들판 얘기를 안 했으면 앞 판의 들판 얘기를 잃지 않는다.
		merged.gatherables = waiting.gatherables;
		merged.fieldChanged = waiting.fieldChanged;
		merged.fieldGone = waiting.fieldGone;
	}

	// 집도 마찬가지 — 새 판이 말 안 했으면 앞 판 것을 들고 간다.
	if (fresh.buildings === undefined && waiting.buildings !== undefined) merged.buildings = waiting.buildings;

	return merged;
}

function applyPendingWorld() {
	if (pendingWorld === null) return;

	const message = pendingWorld;
	pendingWorld = null;

	// ★ 「바뀐 것만」 실려 온다 (TASK-WM-220) — 안 움직인 사람은 안 온다. 그 사람은 그 자리에 그대로 둔다.
	//   ⚠ 안 실린 것을 「사라졌다」로 읽으면 광장의 사람들이 매 판 깜빡인다.
	if (message.changed) {
		const byId = new Map(dolls.map((one) => [one.id, one]));
		for (const one of message.dolls) byId.set(one.id, one);
		for (const goneId of message.gone || []) byId.delete(goneId);
		dolls = [...byId.values()];
	} else {
		dolls = message.dolls;
	}

	// 이름은 따로 온 이름표에서 붙인다.
	// 이름표에는 이름 + <b>방금 한 말</b>이 같이 붙는다 (TASK-WM-250) — 판을 새로 만들지 않는다.
	for (const one of dolls) {
		const saidNow = heard.get(one.id);
		const bubble = saidNow && saidNow.until > performance.now() ? saidNow.text : '';
		const called = dollNames[one.id] || '';
		const body = health.has(one.id) && health.get(one.id) < 100 ? ` [${health.get(one.id)}]` : '';
		one.name = (bubble ? `${called} 「${bubble}」` : called).trim() + body;
	}

	// 몰린 자리에서 세계가 따로 알려 준 「내 자리」 — 공유 목록에 내가 없으면 끼워 넣는다.
	if (myPlaceFromWorld && dolls.some((one) => one.id === myPlaceFromWorld.id) === false)
		dolls = dolls.concat([{ ...myPlaceFromWorld, name: dollNames[myPlaceFromWorld.id] || '' }]);
	// 안 실려 온 목록은 「비었다」가 아니라 「안 바뀌었다」다 — 지난 것을 그대로 쓴다.
	if (message.buildings) buildings = message.buildings;
	// ★ 들판도 「바뀐 자리만」 올 수 있다 (TASK-WM-230) — 그때 통째로 갈아 끼우면
	//   안 바뀐 자리 수십 개가 화면에서 한 번에 사라진다(오류 없이, 조용히).
	if (message.gatherables) {
		if (message.fieldChanged) {
			const byId = new Map(gatherables.map((one) => [one.id, one]));
			for (const one of message.gatherables) byId.set(one.id, one);
			for (const goneId of message.fieldGone || []) byId.delete(goneId);
			gatherables = [...byId.values()];
		} else {
			gatherables = message.gatherables;
		}

		// ★ <b>멀어진 자리는 내가 지운다</b> (TASK-WM-344): 세계는 <b>가까운 것만</b> 말해 준다(관심 반경 32m).
		//   내가 걸어서 멀어지면 그 자리 소식은 더 안 오고, 예전에 받아 둔 것이 <b>영영 남는다</b> —
		//   남이 주워 갔는데도 화면에 있는 것으로 보인다(실측 2026-08-14: 다섯 번째 판부터 늘 그랬다).
		//   세계의 약속은 「가까운 것」이므로, 그 밖은 창이 스스로 접는다.
		const me = dolls.find((one) => one.id === myId);
		if (me) {
			const forgetBeyond = 40;   // [문턱-사유] (c) 제품 상수 — 세계의 관심 반경 32m + 넉넉한 여유
			gatherables = gatherables.filter((one) =>
				((one.x - me.x) ** 2) + ((one.z - me.z) ** 2) <= forgetBeyond * forgetBeyond);
		}
	}
	if (message.cauldrons) cauldrons = message.cauldrons;
	if (message.buildings || message.gatherables || message.cauldrons) staticWorldDirty = true;
	time = message.time || time;
	brew = message.brew || brew;
	drawWorldLines();
	syncDolls();
}

function frame() {
	const dt = Math.min(0.05, frameClock.getDelta());
	applyPendingWorld();
	updateLocalMovement(dt);
	const me = myPlace();
	const anchorX = Math.round(me.x);
	const anchorZ = Math.round(me.z);
	if (staticWorldDirty || anchorX !== lastStaticAnchorX || anchorZ !== lastStaticAnchorZ) {
		rebuildStaticWorld();
		staticWorldDirty = false;
		lastStaticAnchorX = anchorX;
		lastStaticAnchorZ = anchorZ;
		lastHighlightAnchorX = NaN;
		lastHighlightAnchorZ = NaN;
	}
	if (anchorX !== lastHighlightAnchorX || anchorZ !== lastHighlightAnchorZ) {
		updateNodeHighlights();
		lastHighlightAnchorX = anchorX;
		lastHighlightAnchorZ = anchorZ;
	}
	updateDollVisuals(dt);

	const selfView = dollViews.get(myId);
	const focusX = selfView ? selfView.targetX : me.x;
	const focusZ = selfView ? -selfView.targetZ : -me.z;
	eyeTarget.set(focusX, 0.8, focusZ);
	eyeAt.lerp(eyeTarget, 0.15);

	camera.position.set(
		eyeAt.x + Math.sin(orbit.angle) * orbit.distance,
		eyeAt.y + orbit.height,
		eyeAt.z + Math.cos(orbit.angle) * orbit.distance
	);
	camera.lookAt(eyeAt);

	applyDaylight();
	renderer.render(scene, camera);
	requestAnimationFrame(frame);
}
// 엔진이 다 섰다 — 담아 둔 말이 있으면 이제 읽는다(하나도 안 버린다).
engineReady = true;
drainReplay();

frame();

/*
 * 시험용 창구 (TASK-WM-223) — 화면에 <b>실제로 그려진</b> 자리를 밖에서 읽는 유일한 길.
 *
 * ★ 왜 필요한가: 「끊겨 보인다」는 서버가 보낸 숫자로는 못 잰다. 서버는 20Hz 로 정확히 보내는데도
 *   화면은 끊길 수 있다(그 사이를 안 메우면). 재야 할 것은 <b>프레임마다 그려진 자리</b>다.
 *   사람 눈 대신 기계가 그걸 보게 하려면 창구가 하나 필요하다.
 *
 * 읽기 전용이다 — 세계를 바꾸는 손잡이는 여기에 없다.
 */
window.__wmView = {
	dolls: () => [...dollViews.entries()].map(([id, view]) => ({
		id,
		drawnX: view.body.position.x,
		drawnZ: -view.body.position.z,
		serverX: view.serverX,
		serverZ: view.serverZ,
		isLocal: view.isLocal,
		// 저 세계에서 비쳐 온 사람인가 — 그리고 <b>정말로</b> 비쳐 보이게 그렸나 (TASK-WM-267).
		beyond: view.beyond === true,
		seeThrough: view.body.material.transparent === true,
	})),
	me: () => myId,
	// 세계의 자리를 <b>화면 좌표</b>로 — 시험이 사람처럼 <b>진짜로 누르게</b> 하는 자리 (TASK-WM-283).
	screenOf: (x, z, y = 0.4) => {
		const spot = new THREE.Vector3(x, y, -z).project(camera);
		return {
			x: (spot.x + 1) / 2 * window.innerWidth,
			y: (1 - spot.y) / 2 * window.innerHeight,
		};
	},
	// 창이 지금 아는 들판 — 「겨루기에 지면 그 자리가 사라지나」를 보는 자리 (TASK-WM-274).
	field: () => gatherables.map((one) => ({ id: one.id, x: one.x, z: one.z })),
	// 앞질러 그리기가 얼마나 앞섰나 · 몇 번이나 도로 끌려갔나 (TASK-WM-270).
	lead: () => ({ worst: worstLead, snapped: snappedBack }),
	forgetLead: () => { worstLead = 0; snappedBack = 0; },
	// 지금 열려 있는 줄 — 「소식이 도착한 그 자리」에서 재려면 이게 있어야 한다(다시 붙으면 바뀐다).
	socket: () => socket,
	// 창이 지금 알고 있는 세계의 크기 — 끊겼다 돌아온 뒤 <b>통째로</b> 돌아왔는지 보는 자리.
	world: () => ({ dolls: dolls.length, buildings: buildings.length, gatherables: gatherables.length }),
};

// ── 서랍 안의 손잡이들 ─────────────────────────────────────────────────
document.getElementById('signin').addEventListener('click', () => {
	const code = document.getElementById('klcode').value.trim();
	if (!code) return;
	try { localStorage.setItem('wm.world.klcode', code); } catch (e) { /* 저장 못 해도 이번 접속엔 쓴다 */ }
	statusElement.textContent = '그 계정으로 다시 들어간다…';
	location.reload();
});

document.getElementById('buildpick').addEventListener('change', (event) => {
	pickedBuilding = Number(event.target.value);
});

document.getElementById('mode').addEventListener('click', (event) => {
	breaking = breaking === false;
	event.target.textContent = breaking ? '지금: 부수기' : '지금: 짓기';
	canvas.style.cursor = breaking ? 'not-allowed' : 'crosshair';
});

document.getElementById('invite').addEventListener('click', () => {
	tell({ type: 'inviteask' });
});

document.getElementById('link').addEventListener('click', () => {
	const code = document.getElementById('linkcode').value.trim();
	if (!code) return;
	tell({ type: 'link', code });
});

document.getElementById('brewpick').addEventListener('change', (event) => {
	pickedIngredient = Number(event.target.value);
});

// 솥에 재료를 넣는다 — 가방에서 실제로 빠진다(없으면 아무 일도 안 일어난다).
// 어느 쪽으로 얼마나 미는지는 세계가 재료에서 읽는다(창이 방향을 우기던 길은 없앴다).
document.getElementById('rename').addEventListener('click', () => {
	// 되나 안 되나는 세계가 본다 — 짧거나 길거나 남과 겹치면 거절 이유가 온다.
	const wanted = document.getElementById('myname').value;
	doAction({ type: 'rename', name: wanted });
});

document.getElementById('craftpick').addEventListener('change', (event) => {
	pickedRecipe = Number(event.target.value);
});

document.getElementById('make').addEventListener('click', () => {
	// 되나 안 되나는 세계가 정한다 — 창은 「이 줄대로 만들겠다」만 말한다.
	if (pickedRecipe === null) return;
	doAction({ type: 'craft', recipeId: pickedRecipe });
});

document.getElementById('stir').addEventListener('click', () => {
	if (pickedIngredient === null) return;
	doAction(myPot === null
		? { type: 'brew', itemId: pickedIngredient }
		: { type: 'brew', itemId: pickedIngredient, ...myPot });
});

// 완성은 선착순 한 사람에게만 간다 — 못 받으면 아무 일도 안 일어난다(그게 정상이다).
document.getElementById('complete').addEventListener('click', () => {
	doAction(myPot === null ? { type: 'brewcomplete' } : { type: 'brewcomplete', ...myPot });
});

document.getElementById('clear').addEventListener('click', () => {
	doAction(myPot === null ? { type: 'brewreset' } : { type: 'brewreset', ...myPot });
});
</script>
