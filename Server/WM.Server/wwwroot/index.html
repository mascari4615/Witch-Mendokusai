<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마녀여 영원히 — 세계</title>
<style>
	:root {
		color-scheme: dark;
		--ground: #14121a;
		--panel: #1d1a26cc;
		--line: #322c42;
		--ink: #d8d2e8;
		--dim: #8d86a6;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--ground);
		color: var(--ink);
		font: 14px/1.5 system-ui, sans-serif;
		overflow: hidden;
	}

	/* 세계가 화면 전체다. 판들은 그 위에 뜬다 — 창틀이 세계를 좁히지 않는다. */
	#board { position: fixed; inset: 0; display: block; }

	header, aside, footer {
		position: fixed; z-index: 2;
		background: var(--panel);
		backdrop-filter: blur(8px);
		border: 1px solid var(--line);
		border-radius: 10px;
	}

	header {
		top: 12px; left: 12px; right: 12px;
		display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
		padding: 8px 14px;
	}
	header .title { font-weight: 600; letter-spacing: .02em; }
	header .when, header .who { font-variant-numeric: tabular-nums; color: var(--dim); }
	header .spacer { flex: 1; }
	header input { flex: 1 1 180px; min-width: 120px; }

	aside {
		top: 64px; right: 12px; width: min(240px, calc(100vw - 24px)); max-height: calc(100vh - 130px);
		padding: 12px; display: flex; flex-direction: column; gap: 16px;
		overflow-y: auto;
	}
	select {
		background: #14121a; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%;
	}
	aside h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .16em; color: var(--dim); font-weight: 600; }

	.bag { display: flex; flex-direction: column; gap: 2px; }
	.bag .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; }
	.bag .row:nth-child(odd) { background: #241f3088; }
	.bag .row span:first-child { flex: 1 1 auto; }
	.bag .row .amount { font-variant-numeric: tabular-nums; color: var(--dim); }
	.bag .row .amount { white-space: nowrap; flex: 0 0 auto; }
	.bag .empty { color: var(--dim); padding: 3px 6px; }

	.pot .line { color: var(--dim); font-variant-numeric: tabular-nums; }
	.buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

	button {
		background: #2a2436; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
		white-space: normal;
	}
	button:hover { background: #352d47; }
	input {
		background: #14121a; color: var(--ink); border: 1px solid #453c5c;
		border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%;
	}
	code { background: #241f30; padding: 3px 7px; border-radius: 5px; letter-spacing: .08em; white-space: pre-wrap; }

	footer {
		left: 12px; right: 12px; bottom: 12px;
		display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
		padding: 7px 14px; color: var(--dim);
		max-width: min(720px, calc(100vw - 24px));
	}
	footer .status { color: var(--ink); }

	details summary { cursor: pointer; color: var(--dim); font-size: 12px; letter-spacing: .16em; }
	details[open] summary { margin-bottom: 8px; }
	details .stack { display: flex; flex-direction: column; gap: 6px; }
	header > *, aside section, .line, button, input, select, code, footer span { min-width: 0; overflow-wrap: anywhere; }

	@media (max-width: 900px) {
		header { right: 264px; }
	}

	@media (max-width: 720px) {
		header { right: 12px; }
		aside {
			left: 12px; right: 12px; top: auto; bottom: 72px; width: auto;
			max-height: min(42vh, 360px);
		}
		footer { max-width: none; }
	}
</style>
</head>
<body>
	<canvas id="board"></canvas>

	<header>
		<span class="title">마녀여 영원히</span>
		<span class="when" id="clock">—</span>
		<span class="who" id="peers">·</span>
		<span class="spacer"></span>
		<span class="who" id="me">—</span>
		<input id="myname" maxlength="16" placeholder="내 이름" />
		<button id="rename">이렇게 불러</button>
	</header>

	<aside>
		<section>
			<h2>가방</h2>
			<div class="bag" id="bag"><div class="empty">비었다</div></div>
		</section>

		<section>
			<h2>짓기</h2>
			<select id="buildpick"></select>
			<div class="buttons">
				<button id="mode">지금: 짓기</button>
			</div>
		</section>

		<section class="pot">
			<h2>솥</h2>
			<div class="line" id="potwhere">솥이 없다 — 지어서 쓰거나 가까이 가라</div>
			<div class="line" id="brew">아직 안 저음</div>
			<div class="line" id="aiming">—</div>
			<select id="brewpick"></select>
			<div class="buttons">
				<button id="stir">넣고 젓기</button>
				<button id="complete">가져가기</button>
				<button id="clear">비우기</button>
			</div>
		</section>

		<section class="craft">
			<h2>제작</h2>
			<div class="line" id="craftresult">—</div>
			<select id="craftpick"></select>
			<div class="buttons">
				<button id="make">만들기</button>
			</div>
		</section>

		<section id="chestbox" style="display:none">
			<h2>상자</h2>
			<div class="line" id="chestwhere">—</div>
			<div class="bag" id="chest"></div>
			<div class="buttons">
				<button id="chestamount">한 번에: 1개</button>
				<button id="chestclose">닫기</button>
			</div>
		</section>

		<details>
			<summary>나</summary>
			<div class="stack">
				<input id="klcode" placeholder="KarmoLab 코드" />
				<button id="signin">그 계정으로 들어가기</button>
				<button id="invite">이 사람으로 들어올 열쇠 만들기</button>
				<code id="invitecode">—</code>
				<input id="linkcode" placeholder="받은 열쇠" />
				<button id="link">잇기</button>
			</div>
		</details>
	</aside>

	<footer>
		<span class="status" id="status">붙는 중…</span>
		<span>방향키·WASD 로 걷고 · 노란 것을 눌러 줍고 · 땅을 눌러 짓는다 · 드래그로 둘러본다</span>
	</footer>

<script type="module">
// TASK-WM-216 → 217 — 「서버가 굴리는 세계」를 보는 창.
//
// ★ 왜 3D 인가: WM 은 3D 게임이다. 위에서 본 점판은 「같은 세계」가 아니라 그 세계의 지도였다.
//   판정은 여전히 전부 서버 것이고, 여기는 받은 것을 **세워서** 그린다 — 표현만 다른 같은 세계.
//   three.js 는 서버 옆에 같이 두고 쓴다(남의 CDN 에 세계를 의탁하지 않는다).
import * as THREE from './vendor/three.module.js';
// 고르개가 보여 줄 글은 순수 계산이라 따로 두고 시험한다 (wm-web-picker-test).
import { buildLabel, craftLabel, aimingText } from './picker.mjs';
import { createReconnectPlan, linkStatusText } from './link.mjs';

const statusElement = document.getElementById('status');
const canvas = document.getElementById('board');

let myId = null;
let dolls = [];
let lastWorldSequence = 0;
let buildings = [];
let gatherables = [];
let bag = [];
let buildKinds = [];      // 지을 수 있는 것 — 들어올 때 한 번 받는다.
// ⚠ 「아직 안 골랐다」를 0 으로 쓰면 안 된다 — 건물 0번(가문의 나무)이 실재해서 그것만 못 짓는다.
let pickedBuilding = null;
let brewShelf = [];       // 솥에 넣을 수 있는 재료 — 들어올 때 한 번 받는다.
// ⚠ 「아직 안 골랐다」를 0 으로 쓰면 나무(0번)를 솥에 못 넣는다 — 가장 흔한 재료가 막힌다.
let pickedIngredient = null;
let spellbook = [];       // 마도서 — 무엇을 만들 수 있나(들어올 때 한 번)
let craftBook = [];       // 제작표 — 재료를 모아 만드는 것(솥과 갈라지는 자리)
// ⚠ 제작 줄의 번호 = 결과 아이템 번호다 — 0 을 「안 골랐다」로 쓰면 나무를 만드는 줄이 막힌다.
let pickedRecipe = null;
let cauldrons = [];       // 지은 자리마다의 솥
let myPot = null;         // 지금 쓰는 솥의 자리 (없으면 옛 전역 솥)
let openChest = null;     // 지금 열어 둔 상자의 자리 (없으면 null)
let chestItems = [];
const MOVE_STEPS = [1, 5, 0];   // 0 = 전부
let moveStep = 0;               // 지금 고른 단위(위 배열의 자리)
let breaking = false;     // 지금은 짓나, 부수나
const itemNames = {};   // 번호 → 이름. 들어올 때 한 번 받는다.
const pressed = {};
let time = null;        // 세계의 시각 — 서버가 굴린다(사람이 없어도 흐른다).
// 도착했지만 아직 화면에 안 세운 마지막 세계 소식 — 프레임마다 하나씩만 세운다.
let pendingWorld = null;
// 몰린 자리에서 세계가 따로 알려 준 내 인형(공유 소식에 내가 안 들어갔을 때).
let myPlaceFromWorld = null;
// 번호 → 이름. 세계가 바뀔 때만 보내 준다(자리와 달리 초당 20번 나르지 않는다).
const dollNames = {};
let brew = null;        // 모두가 같이 젓는 솥.

// ── 세계를 세우는 자리 ──────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#14121a');
scene.fog = new THREE.Fog('#14121a', 26, 74);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);

// 눈은 인형 뒤 위쪽. 각도는 사람이 돌릴 수 있다(세계를 둘러보는 건 사람의 것).
let orbit = { angle: Math.PI * 0.25, height: 15, distance: 22 };

const sky = new THREE.HemisphereLight('#8f7fd8', '#241f30', 0.7);
scene.add(sky);

const sun = new THREE.DirectionalLight('#ffe9c0', 1.1);
sun.position.set(12, 20, 8);
scene.add(sun);

// 땅 — 끝이 안 보이게 넓고, 안개가 가장자리를 삼킨다.
const ground = new THREE.Mesh(
	new THREE.PlaneGeometry(400, 400),
	new THREE.MeshLambertMaterial({ color: '#252036' })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01; // 격자와 겹쳐 깜빡이지 않게 살짝 아래
scene.add(ground);

const grid = new THREE.GridHelper(400, 400, '#3a3350', '#2c2740');
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

// 세계의 원점 — 여기가 어디쯤인지 알려 주는 유일한 표식.
const origin = new THREE.Mesh(
	new THREE.RingGeometry(0.45, 0.6, 24),
	new THREE.MeshBasicMaterial({ color: '#5f8a72', transparent: true, opacity: 0.7, side: THREE.DoubleSide })
);
origin.rotation.x = -Math.PI / 2;
origin.position.y = 0.02;
scene.add(origin);

// 지은 것 / 사람 — 스냅샷이 올 때마다 갈아 끼운다.
const buildingGroup = new THREE.Group();
const dollGroup = new THREE.Group();
const staticLabelGroup = new THREE.Group();
scene.add(buildingGroup);
scene.add(dollGroup);
scene.add(staticLabelGroup);

const buildingGeometry = new THREE.BoxGeometry(1, 1, 1);
const buildingMaterial = new THREE.MeshLambertMaterial({ color: '#3c5a4a' });
const buildingEdge = new THREE.LineBasicMaterial({ color: '#6f9c82' });

// 주울 것 — 땅에 박힌 작은 기둥. 손이 닿는 것만 밝게 선다.
const nodeGeometry = new THREE.BoxGeometry(0.5, 0.9, 0.5);
const nodeNear = new THREE.MeshLambertMaterial({ color: '#c9b06a', emissive: '#3a3008' });
const nodeFar = new THREE.MeshLambertMaterial({ color: '#5d6b52' });
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

const dollGeometry = new THREE.CapsuleGeometry(0.32, 0.7, 4, 12);
const myMaterial = new THREE.MeshLambertMaterial({ color: '#e8c46a', emissive: '#3a2c08' });
const otherMaterial = new THREE.MeshLambertMaterial({ color: '#8f89a8' });
const buildingEdgesGeometry = new THREE.EdgesGeometry(buildingGeometry);
const dollViews = new Map();
const nodeViews = new Map();
const frameClock = new THREE.Clock();
const MAX_STEP = 1.5;
const LOCAL_MOVE_STEP = 1.5;
const MOVE_SEND_INTERVAL = 50;
const LOCAL_MOVE_SPEED = 3;
const POSITION_IGNORE_DISTANCE = 0.35;
const POSITION_TELEPORT_DISTANCE = 4;
const POSITION_PULL_PER_SECOND = 3;
let staticWorldDirty = true;
let lastStaticAnchorX = NaN;
let lastStaticAnchorZ = NaN;
let lastHighlightAnchorX = NaN;
let lastHighlightAnchorZ = NaN;

function resize() {
	const width = window.innerWidth;
	const height = window.innerHeight;
	renderer.setSize(width, height, false);
	camera.aspect = width / height;
	camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── 서버와의 줄 ────────────────────────────────────────────────────────
//
// ★ 줄은 끊긴다 — 배포 한 번에도 세계는 잠깐 내려간다. 그때 화면이 「끊겼다」로 굳으면
//   사람은 고장으로 읽고 새로고침한다. 게임 창은 이미 스스로 다시 붙는다(ReconnectBackoff).
//   여기도 같은 규칙을 쓴다 — 언제 · 붙을까는 link.mjs 가 정하고(시험 있음), 여기는 실행만.
let socket = null;
const reconnect = createReconnectPlan();
let retryTimer = null;

// 브라우저에 적어 둔 열쇠 — 이게 있어야 다음에 와도 「나」다. 없으면 세계가 새로 준다.
const KEY_NAME = 'wm.world.secret';

function worldAddress() {
	return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
}

function connect() {
	if (retryTimer !== null) { clearTimeout(retryTimer); retryTimer = null; }

	statusElement.textContent = linkStatusText(reconnect.attempts > 0 ? 'retrying' : 'connecting', reconnect.attempts);

	socket = new WebSocket(worldAddress());
	socket.onopen = onLinkOpen;
	socket.onclose = onLinkClose;
	socket.onerror = onLinkError;
	socket.onmessage = onLinkMessage;
}

function onLinkClose() {
	// 다시 붙으면 세계는 나를 처음부터 그려 준다 — 지난 판의 번호·차례를 들고 있으면
	// 새 스냅샷을 「오래된 것」으로 읽고 버린다(화면이 영원히 안 갱신된다).
	myId = null;
	lastWorldSequence = 0;

	const next = reconnect.closed();
	if (next.retry === false) {
		statusElement.textContent = linkStatusText('evicted', 0);
		return;
	}

	statusElement.textContent = linkStatusText('retrying', next.attempts);
	retryTimer = setTimeout(connect, next.delayMs);
}

function onLinkError() {
	// 여기서는 알리기만 한다 — 다시 붙는 것은 언제나 onclose 가 맡는다(두 번 붙지 않게).
	if (reconnect.evicted === false && reconnect.attempts === 0) {
		statusElement.textContent = linkStatusText('error', 0);
	}
}

function onLinkOpen() {
	reconnect.opened();
	statusElement.textContent = linkStatusText('open', 0);
	lastWorldSequence = 0;

	let saved = '';
	try { saved = localStorage.getItem(KEY_NAME) || ''; } catch (e) { saved = ''; }

	// KarmoLab 로그인 세션이 있으면 같이 낸다 — 그러면 어느 기기에서든 나다.
	// ⚠ 이 쿠키는 다른 주소(yawnbot)의 것이라 여기서 못 읽는 경우가 많다. 그때는 손님으로 논다.
	let klSession = '';
	try {
		const found = document.cookie.split(';').map((c) => c.trim())
			.filter((c) => c.indexOf('kl_session=') === 0)[0];
		if (found) klSession = decodeURIComponent(found.slice('kl_session='.length));
	} catch (e) { klSession = ''; }

	let klCode = '';
	try { klCode = localStorage.getItem('wm.world.klcode') || ''; } catch (e) { klCode = ''; }

	socket.send(JSON.stringify({ type: 'hello', secret: saved, klSession, klCode }));
	socket.send(JSON.stringify({ type: 'bagask' }));

	// 코드는 한 번 쓰면 사라진다 — 들고 있어 봐야 다음엔 안 통한다(그때는 기기 열쇠가 나를 안다).
	try { localStorage.removeItem('wm.world.klcode'); } catch (e) { /* 무시 */ }
}

function onLinkMessage(event) {
	const message = JSON.parse(event.data);

	if (message.type === 'kicked') {
		// 일반 MMORPG 처럼 나중에 온 쪽이 이긴다 — 조용히 끊기면 사람은 「버그」로 읽는다.
		// ⚠ 여기서 다시 붙으면 방금 들어간 창을 도로 쫓아낸다 — 두 창이 서로를 영원히 민다.
		//   그래서 이 창은 물러난다(다시 놀려면 새로고침).
		reconnect.kicked();
		statusElement.textContent = linkStatusText('evicted', 0);
		return;
	}

	if (message.type === 'catalog') {
		for (const item of message.items) itemNames[item.itemId] = item.name;
		drawBag();
		return;
	}

	if (message.type === 'buildcatalog') {
		buildKinds = message.buildings || [];
		drawBuildPicker();
		return;
	}

	if (message.type === 'bag') {
		bag = message.items || [];
		drawBag();
		drawBuildPicker();   // 가진 게 바뀌면 「지을 수 있나」도 바뀐다
		drawCraftPicker();   // 만들 수 있나도 같이
		return;
	}

	if (message.type === 'brewshelf') {
		brewShelf = message.items || [];
		const picker = document.getElementById('brewpick');
		picker.textContent = '';
		for (const item of brewShelf) {
			const option = document.createElement('option');
			option.value = item.itemId;
			option.textContent = item.name;
			picker.appendChild(option);
		}

		pickedIngredient = brewShelf.length > 0 ? brewShelf[0].itemId : null;
		picker.value = pickedIngredient;
		return;
	}

	if (message.type === 'craftbook') {
		// 무엇을 만들 수 있는지도 세계가 정한다 — 창이 자기 목록을 들면 세계가 모르는 걸 고른다.
		craftBook = message.recipes || [];
		drawCraftPicker();
		return;
	}

	if (message.type === 'crafted') {
		// ★ 「재료가 없어 못 했다」와 「주사위를 졌다」는 사람에게 전혀 다른 일이다.
		//   구별해서 안 보여 주면 둘 다 「고장」으로 읽힌다.
		if (message.attempted === false) {
			document.getElementById('craftresult').textContent = '못 만들었다 — ' + (message.denied || '');
		} else if (message.succeeded) {
			const made = craftBook.find((one) => one.recipeId === message.recipeId);
			document.getElementById('craftresult').textContent =
				'만들었다 — ' + (made ? made.name : '') + ' ' + message.amount + '개';
		} else {
			document.getElementById('craftresult').textContent = '실패했다 — 재료는 들었다';
		}

		drawCraftPicker();
		return;
	}

	if (message.type === 'spellbook') {
		spellbook = message.pages || [];
		return;
	}

	if (message.type === 'denied') {
		// 거절도 대답이다 — 조용히 실패하면 사람은 「고장났나」로 읽는다.
		statusElement.textContent = message.why;
		return;
	}

	if (message.type === 'chest') {
		openChest = { x: message.x, y: message.y, z: message.z };
		chestItems = message.items || [];
		drawChest();
		return;
	}

	if (message.type === 'invite') {
		document.getElementById('invitecode').textContent = message.code || '(못 만들었다)';
		return;
	}

	if (message.type === 'linked') {
		// 이었어도 지금 붙어 있는 인형은 안 바뀐다 — 다시 들어와야 그 사람이다.
		statusElement.textContent = message.ok
			? `이었다 — 새로고침하면 ${message.identityId}번 사람으로 들어간다`
			: '그 열쇠는 안 통한다(이미 썼거나 없는 열쇠다)';
		return;
	}

	if (message.type === 'brewtaken') {
		// 무엇이 나왔는지는 세계가 정해서 보내 준다 — 창이 우기지 않는다.
		// ⚠ 「못 닿았다」를 itemId 0 으로 읽으면 안 된다: 게임의 나무가 0번이라,
		//   나무가 나오는 쪽에 닿은 판이 「아무것도 못 얻었다」로 표시된다. 개수로 본다.
		if (message.amount === 0) {
			statusElement.textContent = `${message.steps}번 저었지만 아무 쪽에도 못 닿았다 — 솥만 비었다`;
		} else {
			const name = itemNames[message.itemId] || `#${message.itemId}`;
			statusElement.textContent =
				`${GRADES[message.grade] || ''} ${message.recipe || name} ${message.amount}개 — 가방에 들어갔다`.trim();
		}
		return; // 가방은 서버가 곧바로 다시 보내 준다(물어볼 필요 없다)
	}

	if (message.type === 'welcome') {
		myId = message.id;

		// 새 열쇠를 줬으면 적어 둔다(빈 값으로 덮어쓰지 않는다 — 잃으면 새 사람이 된다).
		if (message.secret) {
			try { localStorage.setItem(KEY_NAME, message.secret); } catch (e) { /* 저장 못 해도 게임은 돈다 */ }
		}

		document.getElementById('me').textContent = message.identityId ? `${message.identityId}번 사람` : '손님';
		return;
	}

	if (message.type === 'names') {
		// 이름은 거의 안 바뀌니 바뀔 때만 온다 — 창이 들고 있다가 인형에 붙인다.
		for (const one of message.dolls) dollNames[one.id] = one.name;
		return;
	}

	if (message.type === 'me') {
		// 사람이 몰린 자리에서는 소식 한 벌을 여럿이 같이 쓴다 — 그 한 벌에 내가 안 들어갔을 때
		// 세계가 내 자리만 따로 알려 준다. 내가 안 보이면 화면이 통째로 멎으니 꼭 끼워 넣는다.
		myPlaceFromWorld = message.doll;
		return;
	}

	if (message.type === 'world') {
		if (message.sequence > 0 && message.sequence <= lastWorldSequence) return;
		if (message.sequence > 0) lastWorldSequence = message.sequence;

		// ★ 여기서 세우지 않는다 — <b>가장 최근 것만</b> 다음 프레임에 세운다.
		//   사람이 200명이면 세계는 초당 13번 10KB 를 보낸다. 도착할 때마다 인형 200개를
		//   세우면 화면 그리는 일이 밀리고, 밀리면 메시지도 늦게 열어 보게 된다
		//   (실측: 200명에서 창이 초당 5.6건밖에 못 열었다). 화면은 초당 60번 그리므로
		//   그 사이에 온 판은 어차피 지나간 것이다 — 마지막 것만 쓰면 된다.
		pendingWorld = message;
		return;
	}
}

// 첫 접속 — 이 뒤로는 끊길 때마다 위 계획이 스스로 다시 붙는다.
connect();

// ── 사람의 손 ──────────────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
	// 이름을 적는 중에는 걷지 않는다 — 글자를 치다 세계가 움직이면 창이 고장 난 것처럼 보인다.
	if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
	pressed[e.key] = true;
});
window.addEventListener('keyup', (e) => { pressed[e.key] = false; });
window.addEventListener('blur', () => { for (const key of Object.keys(pressed)) pressed[key] = false; });

function axis(negativeKeys, positiveKeys) {
	let value = 0;
	for (const key of negativeKeys) if (pressed[key]) value -= 1;
	for (const key of positiveKeys) if (pressed[key]) value += 1;
	return value;
}

// 보내는 것은 「어디로 가고 싶다」뿐. 얼마나 갈 수 있는지는 서버가 정한다.
// ★ 눈이 돌아간 만큼 방향도 돌린다 — 3D 에서 「위로 가기」는 화면 위쪽이지 세계의 +Z 가 아니다.
function cameraRelativeMove(right, forward) {
	const length = Math.hypot(right, forward);
	if (length === 0) return null;

	const forwardVec = new THREE.Vector3();
	camera.getWorldDirection(forwardVec);
	forwardVec.y = 0;
	forwardVec.normalize();

	const rightVec = new THREE.Vector3().crossVectors(forwardVec, camera.up).normalize();
	return {
		x: (right * rightVec.x + forward * forwardVec.x) / length,
		z: -((right * rightVec.z + forward * forwardVec.z) / length),
	};
}

function updateLocalMovement(dt) {
	if (myId === null) return;

	const selfView = dollViews.get(myId);
	if (!selfView) return;

	const right = axis(['ArrowLeft', 'a', 'A'], ['ArrowRight', 'd', 'D']);
	const forward = axis(['ArrowDown', 's', 'S'], ['ArrowUp', 'w', 'W']);
	if (right === 0 && forward === 0) return;

	const move = cameraRelativeMove(right, forward);
	if (!move) return;

	selfView.targetX += move.x * LOCAL_MOVE_SPEED * dt;
	selfView.targetZ += move.z * LOCAL_MOVE_SPEED * dt;
}

setInterval(() => {
	if (socket.readyState !== WebSocket.OPEN || myId === null) return;

	const selfView = dollViews.get(myId);
	if (!selfView) return;

	let stepX = selfView.targetX - selfView.serverX;
	let stepZ = selfView.targetZ - selfView.serverZ;
	const stepLength = Math.hypot(stepX, stepZ);
	if (stepLength <= 0.01) return;

	if (stepLength > MAX_STEP) {
		const scale = MAX_STEP / stepLength;
		stepX *= scale;
		stepZ *= scale;
	}

	socket.send(JSON.stringify({ type: 'move', x: stepX, z: stepZ }));
}, MOVE_SEND_INTERVAL);

// 드래그로 둘러보기 — 세계를 도는 것은 눈뿐이고, 세계 자체는 서버 것이다.
let dragging = null;
canvas.addEventListener('pointerdown', (event) => {
	dragging = { x: event.clientX, y: event.clientY, moved: 0, angle: orbit.angle, height: orbit.height };
	canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', (event) => {
	if (dragging === null) return;

	const dx = event.clientX - dragging.x;
	const dy = event.clientY - dragging.y;
	dragging.moved += Math.abs(dx) + Math.abs(dy);
	orbit.angle = dragging.angle - dx * 0.006;
	orbit.height = Math.min(38, Math.max(4, dragging.height + dy * 0.05));
});
canvas.addEventListener('pointerup', (event) => {
	const drag = dragging;
	dragging = null;
	canvas.releasePointerCapture(event.pointerId);

	// 끌었으면 둘러본 것이고, 안 끌었으면 지은 것이다 — 둘을 섞으면 둘러보다 집이 선다.
	if (drag === null || drag.moved > 6) return;
	placeAt(event.clientX, event.clientY);
});
canvas.addEventListener('wheel', (event) => {
	event.preventDefault();
	orbit.distance = Math.min(60, Math.max(8, orbit.distance + Math.sign(event.deltaY) * 2));
}, { passive: false });

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

/** 누른 자리를 땅의 칸으로 바꿔 「여기 짓고 싶다」를 보낸다. 겹치는지는 서버가 본다. */
function placeAt(clientX, clientY) {
	if (socket.readyState !== WebSocket.OPEN) return;

	pointer.x = (clientX / window.innerWidth) * 2 - 1;
	pointer.y = -(clientY / window.innerHeight) * 2 + 1;
	raycaster.setFromCamera(pointer, camera);

	// 주울 것을 눌렀으면 줍는다 — 땅을 눌렀을 때만 짓는다(둘을 섞으면 주우려다 집이 선다).
	const onNode = raycaster.intersectObjects(nodeGroup.children);
	if (onNode.length > 0) {
		socket.send(JSON.stringify({ type: 'gather', nodeId: onNode[0].object.userData.nodeId }));
		return;
	}

	// 부수기는 세워진 것을 눌러 고른다 — 빈 땅을 눌러 봐야 부술 게 없다.
	if (breaking) {
		const onBuilding = raycaster.intersectObjects(buildingGroup.children);
		if (onBuilding.length === 0) return;

		const cell = onBuilding[0].object.userData.cell;
		if (cell) socket.send(JSON.stringify({ type: 'remove', x: cell.x, y: cell.y, z: cell.z }));
		return;
	}

	// 세워진 것을 누르면 상자를 열어 본다 — 상자가 아니면 세계가 빈 목록을 준다.
	const onBuilt = raycaster.intersectObjects(buildingGroup.children);
	if (onBuilt.length > 0) {
		const cell = onBuilt[0].object.userData.cell;
		if (cell) {
			// 솥이면 그 솥을 고른다 — 여럿이 각자 자기 솥에서 젓는다.
			const pot = cauldrons.find((one) => one.x === cell.x && one.z === cell.z);
			if (pot) {
				myPot = { x: pot.x, y: pot.y, z: pot.z };
				statusElement.textContent = `(${pot.x}, ${pot.z}) 솥을 쓴다`;
				drawWorldLines();
				return;
			}

			socket.send(JSON.stringify({ type: 'chestask', x: cell.x, y: cell.y, z: cell.z }));
			return;
		}
	}

	const hits = raycaster.intersectObject(ground);
	if (hits.length === 0 || pickedBuilding === null) return;

	const point = hits[0].point;
	const cellX = Math.floor(point.x);
	const cellZ = Math.floor(-point.z); // three 의 -Z 가 세계의 +Z 다(카메라가 그쪽을 본다)

	// 크기는 안 보낸다 — 세계가 안다(창이 「이건 1×1 이다」로 우길 자리를 없앤다).
	socket.send(JSON.stringify({ type: 'place', x: cellX, y: 0, z: cellZ, buildingId: pickedBuilding }));
}

// ── 판들 ───────────────────────────────────────────────────────────────
const SEASONS = ['봄', '여름', '가을', '겨울'];
const GRADES = ['실패', '조악품', '양품', '명품'];

function drawWorldLines() {
	if (time) {
		const season = SEASONS[time.season % SEASONS.length];
		const minute = time.minute < 10 ? `0${time.minute}` : String(time.minute);
		document.getElementById('clock').textContent =
			`${time.year}년 ${season} ${time.day}일  ${time.hour}:${minute}`;
	}

	document.getElementById('peers').textContent = `◈ ${dolls.length}명`;

	// 고른 솥이 있으면 그 솥을 본다 — 없으면 옛 전역 솥.
	const mine = myPot === null ? null : cauldrons.find((one) => one.x === myPot.x && one.z === myPot.z);
	document.getElementById('potwhere').textContent = mine
		? `(${mine.x}, ${mine.z}) 솥`
		: '솥이 없다 — 솥을 짓고 눌러서 고른다';

	if (mine) brew = { x: mine.px, y: mine.py, steps: mine.steps, side: mine.side, path: [] };

	let brewText = '아직 안 저음';
	if (brew && brew.steps > 0) {
		brewText = `${brew.steps}번 저음`;
		if (brew.side > 0) brewText += ` · 부작용 ${brew.side.toFixed(2)}`;
	}
	document.getElementById('brew').textContent = brewText;

	// 지금 어느 쪽에 가까운가 — 이게 없으면 「무엇을 만드는 중인지」 모른 채 젓는다.
	//   계산은 순수 모듈이 한다(picker.mjs) — 판정 층과 답이 갈라지지 않게 골든 표가 묶는다.
	document.getElementById('aiming').textContent = aimingText(spellbook, brew || { x: 0, y: 0 });
}

/**
 * 지을 것 고르기 — <b>가진 재료로 지을 수 있는지</b>를 그 자리에서 보여 준다.
 * 없으면 「왜 안 되지」를 눌러 봐야 알게 된다(그건 손해만 보는 배움이다).
 */
function drawBuildPicker() {
	const picker = document.getElementById('buildpick');
	if (buildKinds.length === 0) return;

	const chosen = pickedBuilding;
	picker.textContent = '';

	for (const kind of buildKinds) {
		const option = document.createElement('option');
		option.value = kind.buildingId;

		option.textContent = buildLabel(kind, bag, itemNames);
		picker.appendChild(option);
	}

	pickedBuilding = chosen !== null ? chosen : buildKinds[0].buildingId;
	picker.value = pickedBuilding;
}

/**
 * 만들 것 고르기 — 재료와 성공률을 그 자리에서 보여 준다.
 * 「왜 안 되지」를 눌러 봐야 알게 되면 그건 손해만 보는 배움이다.
 */
function drawCraftPicker() {
	const picker = document.getElementById('craftpick');
	if (craftBook.length === 0) return;

	const chosen = pickedRecipe;
	picker.textContent = '';

	for (const recipe of craftBook) {
		const option = document.createElement('option');
		option.value = recipe.recipeId;

		option.textContent = craftLabel(recipe, bag, itemNames);
		picker.appendChild(option);
	}

	pickedRecipe = chosen !== null ? chosen : craftBook[0].recipeId;
	picker.value = pickedRecipe;
}

/** 가방 — 번호가 아니라 이름으로 보인다(낱말표를 못 받았으면 번호로 버틴다). */
function drawBag() {
	const host = document.getElementById('bag');
	host.textContent = '';

	if (bag.length === 0) {
		const empty = document.createElement('div');
		empty.className = 'empty';
		empty.textContent = '비었다';
		host.appendChild(empty);
		return;
	}

	for (const entry of bag) {
		const row = document.createElement('div');
		row.className = 'row';

		const name = document.createElement('span');
		// textContent 로 넣는다 — 이름은 사람이 지은 글자라, 그림표로 읽히면 안 된다.
		name.textContent = itemNames[entry.itemId] || `#${entry.itemId}`;

		const amount = document.createElement('span');
		amount.className = 'amount';
		amount.textContent = entry.amount;

		row.appendChild(name);
		row.appendChild(amount);

		// 상자를 열어 뒀으면 가방 줄을 눌러 하나씩 넣는다 — 넣고 꺼내기가 한 화면에서 된다.
		row.style.cursor = 'pointer';
		row.title = '상자를 열어 두면 눌러서 하나 넣기';
		row.addEventListener('click', () => {
			if (openChest === null) return;
			socket.send(JSON.stringify({ type: 'chestput', x: openChest.x, y: openChest.y, z: openChest.z, itemId: entry.itemId, amount: HowMany(entry.amount) }));
		});

		host.appendChild(row);
	}
}

// ── 세계를 세우기 ──────────────────────────────────────────────────────
const BUILDING_HEIGHT = 1.6;

// 서버가 정한 손 닿는 거리 — 창은 「닿는지」를 미리 보여 주기만 한다(판정은 서버).
const REACH = 2.5;

/** 이름표를 붙이는 거리 — 멀리까지 붙이면 글자밭이 되어 오히려 안 보인다. */
const LABEL_RANGE = 14;

function clearGroup(group) {
	while (group.children.length > 0) {
		const child = group.children.pop();
		if (child.geometry && child.geometry !== buildingGeometry && child.geometry !== dollGeometry)
			child.geometry.dispose();
	}
}

function rebuildWorld() {
	clearGroup(buildingGroup);
	for (const building of buildings) {
		// 기준 칸에서 -X, +Z 로 퍼진다 — 규칙은 서버가 알고, 창은 받은 대로 세운다.
		const box = new THREE.Mesh(buildingGeometry, buildingMaterial);
		box.scale.set(building.w, BUILDING_HEIGHT, building.l);
		box.position.set(
			building.x - (building.w - 1) / 2 + 0.5,
			BUILDING_HEIGHT / 2 + building.y,
			-(building.z + (building.l - 1) / 2) - 0.5
		);
		box.userData.cell = { x: building.x, y: building.y, z: building.z };
		buildingGroup.add(box);

		const edges = new THREE.LineSegments(new THREE.EdgesGeometry(buildingGeometry), buildingEdge);
		edges.scale.copy(box.scale);
		edges.position.copy(box.position);
		buildingGroup.add(edges);
	}

	clearGroup(nodeGroup);
	const me = myPlace();
	for (const node of gatherables) {
		const gap = (node.x - me.x) ** 2 + (node.z - me.z) ** 2;
		const near = gap <= REACH * REACH;
		const pole = new THREE.Mesh(nodeGeometry, near ? nodeNear : nodeFar);
		pole.position.set(node.x, 0.45, -node.z);
		pole.userData.nodeId = node.id;
		nodeGroup.add(pole);

		// 무엇인지 모르면 아무거나 줍게 된다 — 가까운 것에만 이름을 붙인다(멀리까지 붙이면 글자밭).
		if (gap <= LABEL_RANGE * LABEL_RANGE) {
			const tag = makeNameTag(`${itemNames[node.itemId] || '#' + node.itemId} ${node.amount}`);
			tag.position.set(node.x, 1.3, -node.z);
			tag.scale.set(1.8, 0.45, 1);
			nodeGroup.add(tag);
		}
	}

	// 솥·상자도 무엇인지 보여 준다 — 네모만 서 있으면 어느 게 솥인지 모른다.
	for (const building of buildings) {
		const gap = (building.x - me.x) ** 2 + (building.z - me.z) ** 2;
		if (gap > LABEL_RANGE * LABEL_RANGE) continue;

		const kind = buildKinds.find((one) => one.buildingId === building.buildingId);
		if (!kind) continue;

		const tag = makeNameTag(kind.name);
		tag.position.set(building.x, 2.2, -building.z);
		tag.scale.set(2.0, 0.5, 1);
		nodeGroup.add(tag);
	}

	clearGroup(dollGroup);
	for (const doll of dolls) {
		const body = new THREE.Mesh(dollGeometry, doll.id === myId ? myMaterial : otherMaterial);
		body.position.set(doll.x, 0.67, -doll.z);
		dollGroup.add(body);

		// 이름표 — 누가 누구인지 모르면 「같이 논다」가 아니다(그림이 아니라 글자다).
		if (doll.name) {
			const tag = makeNameTag(doll.name);
			tag.position.set(doll.x, 1.7, -doll.z);
			dollGroup.add(tag);
		}
	}
}

function rebuildStaticWorld() {
	clearGroup(buildingGroup);
	clearGroup(nodeGroup);
	clearGroup(staticLabelGroup);
	nodeViews.clear();

	const me = myPlace();
	for (const building of buildings) {
		const box = new THREE.Mesh(buildingGeometry, buildingMaterial);
		box.scale.set(building.w, BUILDING_HEIGHT, building.l);
		box.position.set(
			building.x - (building.w - 1) / 2 + 0.5,
			BUILDING_HEIGHT / 2 + building.y,
			-(building.z + (building.l - 1) / 2) - 0.5
		);
		box.userData.cell = { x: building.x, y: building.y, z: building.z };
		buildingGroup.add(box);

		const edges = new THREE.LineSegments(buildingEdgesGeometry, buildingEdge);
		edges.scale.copy(box.scale);
		edges.position.copy(box.position);
		buildingGroup.add(edges);

		const gap = (building.x - me.x) ** 2 + (building.z - me.z) ** 2;
		if (gap > LABEL_RANGE * LABEL_RANGE) continue;

		const kind = buildKinds.find((one) => one.buildingId === building.buildingId);
		if (!kind) continue;

		const tag = makeNameTag(kind.name);
		tag.position.set(building.x, 2.2, -building.z);
		tag.scale.set(2.0, 0.5, 1);
		staticLabelGroup.add(tag);
	}

	for (const node of gatherables) {
		const gap = (node.x - me.x) ** 2 + (node.z - me.z) ** 2;
		const near = gap <= REACH * REACH;
		const pole = new THREE.Mesh(nodeGeometry, near ? nodeNear : nodeFar);
		pole.position.set(node.x, 0.45, -node.z);
		pole.userData.nodeId = node.id;
		nodeGroup.add(pole);
		nodeViews.set(node.id, { x: node.x, z: node.z, mesh: pole });

		if (gap <= LABEL_RANGE * LABEL_RANGE) {
			const tag = makeNameTag(`${itemNames[node.itemId] || '#' + node.itemId} ${node.amount}`);
			tag.position.set(node.x, 1.3, -node.z);
			tag.scale.set(1.8, 0.45, 1);
			staticLabelGroup.add(tag);
		}
	}
}

function syncDolls() {
	const alive = new Set();

	for (const doll of dolls) {
		alive.add(doll.id);
		let view = dollViews.get(doll.id);
		if (!view) {
			const body = new THREE.Mesh(dollGeometry, doll.id === myId ? myMaterial : otherMaterial);
			dollGroup.add(body);
			body.position.set(doll.x, 0.67, -doll.z);
			view = {
				body,
				isLocal: doll.id === myId,
				tag: null,
				name: '',
				targetX: doll.x,
				targetZ: doll.z,
				serverX: doll.x,
				serverZ: doll.z,
			};
			dollViews.set(doll.id, view);
		}

		view.body.material = doll.id === myId ? myMaterial : otherMaterial;
		view.isLocal = doll.id === myId;
		view.serverX = doll.x;
		view.serverZ = doll.z;
		if (doll.id !== myId) {
			view.targetX = doll.x;
			view.targetZ = doll.z;
		}

		if (doll.name) {
			if (!view.tag || view.name !== doll.name) {
				if (view.tag) dollGroup.remove(view.tag);
				view.tag = makeNameTag(doll.name);
				dollGroup.add(view.tag);
				view.name = doll.name;
			}
			view.tag.position.set(view.body.position.x, 1.7, view.body.position.z);
		} else if (view.tag) {
			dollGroup.remove(view.tag);
			view.tag = null;
			view.name = '';
		}
	}

	for (const [dollId, view] of dollViews) {
		if (alive.has(dollId)) continue;
		dollGroup.remove(view.body);
		if (view.tag) dollGroup.remove(view.tag);
		dollViews.delete(dollId);
	}
}

function updateDollVisuals(dt) {
	for (const view of dollViews.values()) {
		const gapX = view.targetX - view.serverX;
		const gapZ = view.targetZ - view.serverZ;
		const distance = Math.hypot(gapX, gapZ);

		if (view.isLocal) {
			if (distance >= POSITION_TELEPORT_DISTANCE) {
				view.targetX = view.serverX;
				view.targetZ = view.serverZ;
			}
		} else if (distance >= POSITION_TELEPORT_DISTANCE) {
			view.targetX = view.serverX;
			view.targetZ = view.serverZ;
		} else if (distance > POSITION_IGNORE_DISTANCE) {
			const pull = Math.min(1, POSITION_PULL_PER_SECOND * dt);
			view.targetX += gapX * pull;
			view.targetZ += gapZ * pull;
		}

		if (view.isLocal) {
			view.body.position.x = view.targetX;
			view.body.position.z = -view.targetZ;
		} else {
			const follow = 1 - Math.exp(-14 * dt);
			view.body.position.x += (view.targetX - view.body.position.x) * follow;
			view.body.position.z += (-view.targetZ - view.body.position.z) * follow;
		}
		if (view.tag) {
			view.tag.position.x = view.body.position.x;
			view.tag.position.z = view.body.position.z;
		}
	}
}

function updateNodeHighlights() {
	const nearLimit = REACH * REACH;
	const me = myPlace();
	for (const view of nodeViews.values()) {
		const gap = (view.x - me.x) ** 2 + (view.z - me.z) ** 2;
		view.mesh.material = gap <= nearLimit ? nodeNear : nodeFar;
	}
}

/** 내가 선 자리 — 눈이 여기를 따라온다. 아직 나를 모르면 세계의 원점을 본다. */
/** 이름표 하나 — 글자를 그려 항상 보는 쪽을 향하게 세운다. */
const nameTags = new Map();
function makeNameTag(name) {
	let texture = nameTags.get(name);
	if (texture === undefined) {
		const canvas = document.createElement('canvas');
		canvas.width = 256;
		canvas.height = 64;
		const paint = canvas.getContext('2d');
		paint.font = '28px system-ui, sans-serif';
		paint.textAlign = 'center';
		paint.textBaseline = 'middle';
		paint.fillStyle = '#d8d2e8';
		paint.fillText(name, 128, 32);

		texture = new THREE.CanvasTexture(canvas);
		nameTags.set(name, texture);
	}

	const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
	tag.scale.set(2.4, 0.6, 1);
	return tag;
}

function myPlace() {
	const selfView = myId === null ? null : dollViews.get(myId);
	if (selfView) {
		return { x: selfView.targetX, z: selfView.targetZ };
	}

	for (const doll of dolls) if (doll.id === myId) return doll;
	return { x: 0, z: 0 };
}

/** 하루가 도는 만큼 하늘빛이 돈다 — 「내가 없어도 밤이 온다」가 눈에 보여야 한다. */
const DAY_SKY = new THREE.Color('#3b3358');
const NIGHT_SKY = new THREE.Color('#0e0c14');
const skyColor = new THREE.Color();

function applyDaylight() {
	if (time == null) return;

	const hours = time.hoursPerDay > 0 ? time.hoursPerDay : 24;
	const turn = (time.hour + time.minute / 60) / hours;      // 0 = 자정
	const noon = Math.max(0, Math.sin((turn - 0.25) * Math.PI * 2)); // 정오에 1, 밤엔 0

	skyColor.copy(NIGHT_SKY).lerp(DAY_SKY, noon);
	scene.background = skyColor;
	scene.fog.color = skyColor;

	sun.intensity = 0.15 + noon * 1.0;
	sky.intensity = 0.25 + noon * 0.5;
	sun.position.set(Math.cos(turn * Math.PI * 2) * 20, 6 + noon * 22, Math.sin(turn * Math.PI * 2) * 20);
}

// 눈은 인형을 부드럽게 따라간다 — 딱 붙으면 20번/초의 스냅샷이 그대로 덜컹거린다.
const eyeTarget = new THREE.Vector3();
const eyeAt = new THREE.Vector3();

/** 도착만 해 둔 마지막 세계 소식을 화면에 세운다 — 한 프레임에 한 번. */
function applyPendingWorld() {
	if (pendingWorld === null) return;

	const message = pendingWorld;
	pendingWorld = null;

	// ★ 「바뀐 것만」 실려 온다 (TASK-WM-220) — 안 움직인 사람은 안 온다. 그 사람은 그 자리에 그대로 둔다.
	//   ⚠ 안 실린 것을 「사라졌다」로 읽으면 광장의 사람들이 매 판 깜빡인다.
	if (message.changed) {
		const byId = new Map(dolls.map((one) => [one.id, one]));
		for (const one of message.dolls) byId.set(one.id, one);
		for (const goneId of message.gone || []) byId.delete(goneId);
		dolls = [...byId.values()];
	} else {
		dolls = message.dolls;
	}

	// 이름은 따로 온 이름표에서 붙인다.
	for (const one of dolls) one.name = dollNames[one.id] || '';

	// 몰린 자리에서 세계가 따로 알려 준 「내 자리」 — 공유 목록에 내가 없으면 끼워 넣는다.
	if (myPlaceFromWorld && dolls.some((one) => one.id === myPlaceFromWorld.id) === false)
		dolls = dolls.concat([{ ...myPlaceFromWorld, name: dollNames[myPlaceFromWorld.id] || '' }]);
	// 안 실려 온 목록은 「비었다」가 아니라 「안 바뀌었다」다 — 지난 것을 그대로 쓴다.
	if (message.buildings) buildings = message.buildings;
	if (message.gatherables) gatherables = message.gatherables;
	if (message.cauldrons) cauldrons = message.cauldrons;
	if (message.buildings || message.gatherables || message.cauldrons) staticWorldDirty = true;
	time = message.time || time;
	brew = message.brew || brew;
	drawWorldLines();
	syncDolls();
}

function frame() {
	const dt = Math.min(0.05, frameClock.getDelta());
	applyPendingWorld();
	updateLocalMovement(dt);
	const me = myPlace();
	const anchorX = Math.round(me.x);
	const anchorZ = Math.round(me.z);
	if (staticWorldDirty || anchorX !== lastStaticAnchorX || anchorZ !== lastStaticAnchorZ) {
		rebuildStaticWorld();
		staticWorldDirty = false;
		lastStaticAnchorX = anchorX;
		lastStaticAnchorZ = anchorZ;
		lastHighlightAnchorX = NaN;
		lastHighlightAnchorZ = NaN;
	}
	if (anchorX !== lastHighlightAnchorX || anchorZ !== lastHighlightAnchorZ) {
		updateNodeHighlights();
		lastHighlightAnchorX = anchorX;
		lastHighlightAnchorZ = anchorZ;
	}
	updateDollVisuals(dt);

	const selfView = dollViews.get(myId);
	const focusX = selfView ? selfView.targetX : me.x;
	const focusZ = selfView ? -selfView.targetZ : -me.z;
	eyeTarget.set(focusX, 0.8, focusZ);
	eyeAt.lerp(eyeTarget, 0.15);

	camera.position.set(
		eyeAt.x + Math.sin(orbit.angle) * orbit.distance,
		eyeAt.y + orbit.height,
		eyeAt.z + Math.cos(orbit.angle) * orbit.distance
	);
	camera.lookAt(eyeAt);

	applyDaylight();
	renderer.render(scene, camera);
	requestAnimationFrame(frame);
}
frame();

// ── 서랍 안의 손잡이들 ─────────────────────────────────────────────────
document.getElementById('signin').addEventListener('click', () => {
	const code = document.getElementById('klcode').value.trim();
	if (!code) return;
	try { localStorage.setItem('wm.world.klcode', code); } catch (e) { /* 저장 못 해도 이번 접속엔 쓴다 */ }
	statusElement.textContent = '그 계정으로 다시 들어간다…';
	location.reload();
});

document.getElementById('buildpick').addEventListener('change', (event) => {
	pickedBuilding = Number(event.target.value);
});

document.getElementById('mode').addEventListener('click', (event) => {
	breaking = breaking === false;
	event.target.textContent = breaking ? '지금: 부수기' : '지금: 짓기';
	canvas.style.cursor = breaking ? 'not-allowed' : 'crosshair';
});

document.getElementById('invite').addEventListener('click', () => {
	if (socket.readyState !== WebSocket.OPEN) return;
	socket.send(JSON.stringify({ type: 'inviteask' }));
});

document.getElementById('link').addEventListener('click', () => {
	if (socket.readyState !== WebSocket.OPEN) return;
	const code = document.getElementById('linkcode').value.trim();
	if (!code) return;
	socket.send(JSON.stringify({ type: 'link', code }));
});

document.getElementById('brewpick').addEventListener('change', (event) => {
	pickedIngredient = Number(event.target.value);
});

// 솥에 재료를 넣는다 — 가방에서 실제로 빠진다(없으면 아무 일도 안 일어난다).
// 어느 쪽으로 얼마나 미는지는 세계가 재료에서 읽는다(창이 방향을 우기던 길은 없앴다).
document.getElementById('rename').addEventListener('click', () => {
	// 되나 안 되나는 세계가 본다 — 짧거나 길거나 남과 겹치면 거절 이유가 온다.
	const wanted = document.getElementById('myname').value;
	if (socket.readyState !== WebSocket.OPEN) return;
	socket.send(JSON.stringify({ type: 'rename', name: wanted }));
});

document.getElementById('craftpick').addEventListener('change', (event) => {
	pickedRecipe = Number(event.target.value);
});

document.getElementById('make').addEventListener('click', () => {
	// 되나 안 되나는 세계가 정한다 — 창은 「이 줄대로 만들겠다」만 말한다.
	if (socket.readyState !== WebSocket.OPEN || pickedRecipe === null) return;
	socket.send(JSON.stringify({ type: 'craft', recipeId: pickedRecipe }));
});

document.getElementById('stir').addEventListener('click', () => {
	if (socket.readyState !== WebSocket.OPEN || pickedIngredient === null) return;
	socket.send(JSON.stringify(myPot === null
		? { type: 'brew', itemId: pickedIngredient }
		: { type: 'brew', itemId: pickedIngredient, ...myPot }));
});

// 완성은 선착순 한 사람에게만 간다 — 못 받으면 아무 일도 안 일어난다(그게 정상이다).
document.getElementById('complete').addEventListener('click', () => {
	if (socket.readyState !== WebSocket.OPEN) return;
	socket.send(JSON.stringify(myPot === null ? { type: 'brewcomplete' } : { type: 'brewcomplete', ...myPot }));
});

document.getElementById('clear').addEventListener('click', () => {
	if (socket.readyState !== WebSocket.OPEN) return;
	socket.send(JSON.stringify(myPot === null ? { type: 'brewreset' } : { type: 'brewreset', ...myPot }));
});
</script>
