<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WM — 서버가 굴리는 세계 (골격)</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0;
		background: #14121a;
		color: #d8d2e8;
		font: 14px/1.5 system-ui, sans-serif;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 12px;
		padding: 16px;
	}
	canvas { background: #1d1a26; border: 1px solid #322c42; touch-action: none; }
	.status { font-variant-numeric: tabular-nums; opacity: .8; }
	.hint { opacity: .55; max-width: 44ch; text-align: center; }
	.worldline { font-variant-numeric: tabular-nums; opacity: .75; display: flex; gap: 8px; }
	.worldline .dot { opacity: .4; }
	button {
		background: #2a2436; color: #d8d2e8; border: 1px solid #453c5c;
		border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
	}
	button:hover { background: #352d47; }
</style>
</head>
<body>
	<div class="status" id="status">붙는 중…</div>
	<div class="worldline"><span id="clock">—</span><span class="dot">·</span><span id="peers">0명</span></div>
	<canvas id="board" width="480" height="360"></canvas>
	<div class="worldline">솥: <span id="brew">아직 안 저음</span></div>
	<div class="worldline">
		<button id="stir">젓기 (무작위 방향)</button>
		<button id="complete">완성 가져가기</button>
		<button id="clear">솥 비우기</button>
	</div>
	<div class="hint">
		방향키(또는 WASD)로 움직이고, 판을 눌러 짓는다. 판정은 서버가 한다 —
		한 번에 갈 수 있는 거리는 서버가 잘라낸다. 창을 두 개 열면 서로가 보인다.
	</div>

<script>
// TASK-WM-216 증분 2 — 「서버가 굴리는 세계」를 보는 가장 얇은 창.
// 여기엔 규칙이 없다. 눌린 키를 보내고, 서버가 준 자리를 그린다. 그게 전부다.
(function () {
	var statusElement = document.getElementById('status');
	var canvas = document.getElementById('board');
	var context = canvas.getContext('2d');

	var myId = null;
	var dolls = [];
	var buildings = [];
	var pressed = {};
	var time = null;   // 세계의 시각 — 서버가 굴린다(사람이 없어도 흐른다).
	var brew = null;   // 모두가 같이 젓는 솥.
	var SCALE = 12; // 한 칸을 몇 픽셀로 그릴 것인가 (보기용일 뿐, 규칙 아님)

	var socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');

	socket.onopen = function () { statusElement.textContent = '붙었다. 방향키로 움직여라.'; };
	socket.onclose = function () { statusElement.textContent = '끊겼다.'; };
	socket.onerror = function () { statusElement.textContent = '연결에 문제가 있다.'; };

	socket.onmessage = function (event) {
		var message = JSON.parse(event.data);
		if (message.type === 'brewtaken') {
			statusElement.textContent = '완성을 가져갔다 — ' + message.steps + '번 저은 솥 ('
				+ message.x.toFixed(2) + ', ' + message.y.toFixed(2) + ')';
			return;
		}

		if (message.type === 'welcome') {
			myId = message.id;
			statusElement.textContent = '내 인형 번호 ' + myId;
			return;
		}

		if (message.type === 'world') {
			dolls = message.dolls;
			buildings = message.buildings || [];
			time = message.time || time;
			brew = message.brew || brew;
			drawWorldLines();
			draw();
		}
	};

	window.addEventListener('keydown', function (e) { pressed[e.key] = true; });
	window.addEventListener('keyup', function (e) { pressed[e.key] = false; });

	function axis(negativeKeys, positiveKeys) {
		var value = 0;
		for (var i = 0; i < negativeKeys.length; i++) if (pressed[negativeKeys[i]]) value -= 1;
		for (var j = 0; j < positiveKeys.length; j++) if (pressed[positiveKeys[j]]) value += 1;
		return value;
	}

	// 보내는 것은 「어디로 가고 싶다」뿐. 얼마나 갈 수 있는지는 서버가 정한다.
	setInterval(function () {
		if (socket.readyState !== WebSocket.OPEN) return;

		var x = axis(['ArrowLeft', 'a', 'A'], ['ArrowRight', 'd', 'D']);
		var z = axis(['ArrowDown', 's', 'S'], ['ArrowUp', 'w', 'W']);
		if (x === 0 && z === 0) return;

		socket.send(JSON.stringify({ type: 'move', x: x, z: z }));
	}, 100);

	// 클릭한 자리를 칸으로 바꿔 「여기 짓고 싶다」를 보낸다. 겹치는지는 서버가 본다.
	canvas.addEventListener('click', function (event) {
		if (socket.readyState !== WebSocket.OPEN) return;

		var rect = canvas.getBoundingClientRect();
		var cellX = Math.floor((event.clientX - rect.left - canvas.width / 2) / SCALE);
		var cellZ = Math.floor((canvas.height / 2 - (event.clientY - rect.top)) / SCALE);

		socket.send(JSON.stringify({ type: 'place', x: cellX, y: 0, z: cellZ, w: 2, l: 2, buildingId: 4000 }));
	});

	var SEASONS = ['봄', '여름', '가을', '겨울'];

	// 서버가 보내는 것을 **눈으로** 확인할 자리. 안 그리면 시각·솥이 조용히 죽어도 아무도 모른다.
	function drawWorldLines() {
		if (time) {
			var season = SEASONS[time.season % SEASONS.length];
			var minute = time.minute < 10 ? '0' + time.minute : String(time.minute);
			document.getElementById('clock').textContent =
				time.year + '년 ' + season + ' ' + time.day + '일  ' + time.hour + ':' + minute;
		}

		document.getElementById('peers').textContent = dolls.length + '명';

		var brewText = '아직 안 저음';
		if (brew && brew.steps > 0) {
			brewText = brew.steps + '번 저음  (' + brew.x.toFixed(2) + ', ' + brew.y.toFixed(2) + ')';
			if (brew.side > 0) brewText += '  부작용 ' + brew.side.toFixed(2);
		}
		document.getElementById('brew').textContent = brewText;
	}

	// 솥은 여기서도 젓는다 — 웹 창과 게임이 **같은 솥**을 젓는지 눈으로 보려면 여기서도 손이 닿아야 한다.
	document.getElementById('stir').addEventListener('click', function () {
		if (socket.readyState !== WebSocket.OPEN) return;
		var angle = Math.random() * Math.PI * 2;
		socket.send(JSON.stringify({ type: 'brew', dx: Math.cos(angle), dy: Math.sin(angle), grind: 1 }));
	});

	// 완성은 선착순 한 사람에게만 간다 — 못 받으면 아무 일도 안 일어난다(그게 정상이다).
	document.getElementById('complete').addEventListener('click', function () {
		if (socket.readyState !== WebSocket.OPEN) return;
		socket.send(JSON.stringify({ type: 'brewcomplete' }));
	});

	document.getElementById('clear').addEventListener('click', function () {
		if (socket.readyState !== WebSocket.OPEN) return;
		socket.send(JSON.stringify({ type: 'brewreset' }));
	});

	function draw() {
		context.clearRect(0, 0, canvas.width, canvas.height);

		var centerX = canvas.width / 2;
		var centerY = canvas.height / 2;

		context.strokeStyle = '#2a2436';
		context.beginPath();
		context.moveTo(centerX, 0); context.lineTo(centerX, canvas.height);
		context.moveTo(0, centerY); context.lineTo(canvas.width, centerY);
		context.stroke();

		// 건물 먼저 (인형이 위에 오도록)
		for (var b = 0; b < buildings.length; b++) {
			var building = buildings[b];
			// 기준 칸에서 -X, +Z 로 퍼진다 — 규칙은 서버가 알고, 창은 받은 대로 그린다.
			var left = centerX + (building.x - (building.w - 1)) * SCALE;
			var top = centerY - (building.z + building.l - 1) * SCALE - SCALE;
			context.fillStyle = '#3c5a4a';
			context.fillRect(left, top, building.w * SCALE, building.l * SCALE);
			context.strokeStyle = '#5f8a72';
			context.strokeRect(left, top, building.w * SCALE, building.l * SCALE);
		}

		for (var i = 0; i < dolls.length; i++) {
			var doll = dolls[i];
			var px = centerX + doll.x * SCALE;
			var py = centerY - doll.z * SCALE;

			context.fillStyle = (doll.id === myId) ? '#e8c46a' : '#7f7a96';
			context.beginPath();
			context.arc(px, py, 7, 0, Math.PI * 2);
			context.fill();

			context.fillStyle = '#d8d2e8';
			context.fillText(String(doll.id), px + 10, py + 4);
		}
	}
})();
</script>
</body>
</html>
