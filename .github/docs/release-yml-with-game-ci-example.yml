# Example: release.yml with game-ci/unity-builder (Option 1)
#
# NOTE: This is a *reference* file, NOT the actual .github/workflows/release.yml
# To adopt Option 1:
# 1. Copy this content
# 2. Merge into .github/workflows/release.yml
# 3. Add GitHub secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# 4. Adjust game-ci/unity-builder version as needed (check https://github.com/game-ci/unity-builder/releases)

name: Release with Build (game-ci)

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag + version
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

  # Step 1: Release metadata (existing WM-066 logic)
  release-metadata:
    runs-on: ubuntu-latest
    needs: release-info
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Generate CHANGELOG fragment
        id: changelog
        run: |
          set -euo pipefail
          PREV='$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vFx "${{ needs.release-info.outputs.tag }}" | head -1 || true)'
          TAG='${{ needs.release-info.outputs.tag }}'
          if [ -z "$PREV" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV}..${TAG}"
          fi
          DATE=$(date -u +%Y-%m-%d)
          FRAGMENT=/tmp/changelog-fragment.md
          {
            echo "## [$TAG] - $DATE"
            echo ""
          } > "$FRAGMENT"

          emit_section() {
            local TYPE="$1" HEADER="$2"
            local LINES
            LINES=$(git log --no-merges --pretty=format:'%h|%s' "$RANGE" \
              | awk -F'|' -v t="$TYPE" 'BEGIN{IGNORECASE=0} $2 ~ "^"t"(\\([^)]+\\))?:" {print}' \
              || true)
            if [ -n "$LINES" ]; then
              {
                echo "$HEADER"
                echo ""
                echo "$LINES" | while IFS='|' read -r SHA SUBJECT; do
                  CLEAN=$(echo "$SUBJECT" | sed -E "s/^${TYPE}(\\([^)]+\\))?:[[:space:]]*//")
                  echo "- ${CLEAN} (\`${SHA}\`)"
                done
                echo ""
              } >> "$FRAGMENT"
            fi
          }

          emit_section feat "### Features"
          emit_section fix "### Fixes"
          emit_section perf "### Performance"
          emit_section refactor "### Refactor"
          emit_section docs "### Docs"
          emit_section chore "### Chore"

          cat "$FRAGMENT"

      - name: Bump bundleVersion
        run: |
          set -euo pipefail
          VERSION='${{ needs.release-info.outputs.version }}'
          FILE=ProjectSettings/ProjectSettings.asset
          sed -i "s/^  bundleVersion: .*/  bundleVersion: ${VERSION}/" "$FILE"

      - name: Prepend to CHANGELOG.md
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            {
              echo "# Changelog"
              echo ""
              echo "Auto-generated by GitHub Actions."
            } > CHANGELOG.md
          fi
          HEADER=$(head -n 4 CHANGELOG.md)
          BODY=$(tail -n +5 CHANGELOG.md)
          {
            echo "$HEADER"
            cat /tmp/changelog-fragment.md
            echo "$BODY"
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

      - name: Commit + push metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md ProjectSettings/ProjectSettings.asset
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ needs.release-info.outputs.tag }} — bump bundleVersion + CHANGELOG"
            git push origin main
          fi

  # Step 2: Build (game-ci)
  build:
    runs-on: ubuntu-latest
    needs: [release-info, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
          - StandaloneWindows64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main  # Build from post-release commit

      - name: Build with game-ci/unity-builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2023.2  # Adjust to your project version
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: BuildScript.BuildPlayer  # Custom build method (optional)
          buildsPath: Builds
          buildName: WitchMendokusai-${{ needs.release-info.outputs.version }}-${{ matrix.targetPlatform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: Builds/

  # Step 3: Attach builds to release
  attach-builds:
    runs-on: ubuntu-latest
    needs: [release-info, build]
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/builds

      - name: Create release zips
        run: |
          cd /tmp/builds
          for platform_dir in */; do
            platform="${platform_dir%/}"
            platform_clean="${platform##*-}"
            zip -r "WitchMendokusai-${{ needs.release-info.outputs.version }}-${platform_clean}.zip" "$platform_dir"
          done
          ls -lh *.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-info.outputs.tag }} \
            /tmp/builds/*.zip \
            --clobber

  # Step 4: Finalize release
  finalize-release:
    runs-on: ubuntu-latest
    needs: [release-info, attach-builds]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vFx "${{ needs.release-info.outputs.tag }}" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            gh release view ${{ needs.release-info.outputs.tag }} --json body -q '.body' > /tmp/release_notes.md
            gh release edit ${{ needs.release-info.outputs.tag }} \
              --notes-file /tmp/release_notes.md
          fi
