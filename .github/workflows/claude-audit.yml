name: Claude Post-Push Audit

# TASK-WM-063 sub-K + TASK-WM-093 — post-push audit + 자동 fix push.
#
# 동작:
#   1. main push → audit (Tier 1 grep + Tier 2 Claude semantic)
#   2. PASS → exit 0
#   3. FAIL → 같은 run 안에서 Claude CLI 직접 fix → commit (`chore(audit-fix):` prefix) → push to main
#      알림 = main push event → yawnbot Discord 자동 (별도 webhook 호출 0)
#   4. fix 실패 (Claude 응답 무효 / push race / SHA != HEAD) → Issue fallback (label: audit, fix-failed)
#
# 무한 루프 가드:
#   - GITHUB_TOKEN 으로 push 시 workflow 재트리거 X (GitHub 정책) — primary 보호
#   - 추가 방어: commit subject `chore(audit-fix):` + author `github-actions[bot]` 시 audit skip
#
# 직전 흐름 (Issue 만 만들고 해결 X — dead interface, OPEN 10개 쌓임) 폐기 (TASK-WM-093, 2026-05-10).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Audit 대상 commit SHA (default = HEAD). workflow_dispatch 전용.'
        required: false
        default: ''

permissions:
  contents: write    # auto-fix push
  issues: write      # fix 실패 fallback

concurrency:
  # SHA 별 직렬화 — 같은 commit 의 audit 중복 방지 (workflow_dispatch + push 동시 트리거 등).
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # workflow_dispatch 임의 SHA + auto-fix push 위해 full history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target SHA + loop guard
        id: target
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target SHA: $SHA"
          git show --stat "$SHA"

          # 무한 루프 가드 — audit-fix commit 자기 자신 재감사 방지
          # (GITHUB_TOKEN push 자체가 재트리거 X 라 primary 가드는 GitHub 정책. 본 가드는
          #  workflow_dispatch 수동 재실행 + 미래 PAT 도입 시 방어망)
          SUBJECT=$(git log -1 --format=%s "$SHA")
          AUTHOR=$(git log -1 --format=%an "$SHA")
          if [[ "$SUBJECT" == chore\(audit-fix\):* ]] && [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::audit-fix commit ($SUBJECT) — skip (loop guard)"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

          # SHA == HEAD of origin/main 인지 — auto-fix push 가능 여부
          # (workflow_dispatch 로 옛 SHA 감사 시 push 차단, Issue fallback 만)
          HEAD_SHA=$(git rev-parse origin/main)
          if [ "$SHA" = "$HEAD_SHA" ]; then
            echo "is_head=yes" >> "$GITHUB_OUTPUT"
          else
            echo "is_head=no" >> "$GITHUB_OUTPUT"
            echo "::notice::SHA != origin/main HEAD — auto-fix 비활성, Issue fallback only"
          fi

      - name: Setup Node.js
        if: steps.target.outputs.skip != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        if: steps.target.outputs.skip != 'yes'
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude CLI auth
        if: steps.target.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "=== claude --version ==="
          claude --version
          echo ""
          echo "=== claude --print 'hello' (auth smoke test) ==="
          claude --print "Reply with just the word OK if you can see this." || {
            echo "❌ Claude CLI auth failed"
            exit 1
          }

      - name: Run audit + auto-fix
        if: steps.target.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          IS_HEAD: ${{ steps.target.outputs.is_head }}
        run: |
          # diff 추출 (file 로 파이프해서 prompt 안전하게 처리)
          git show "$SHA" > /tmp/commit.txt
          DIFF_SIZE=$(wc -c < /tmp/commit.txt)
          echo "Diff size: $DIFF_SIZE bytes"

          # 큰 diff 잘라내기 (50KB 제한 — Claude 토큰 비용)
          if [ "$DIFF_SIZE" -gt 51200 ]; then
            head -c 51200 /tmp/commit.txt > /tmp/commit-truncated.txt
            echo "... (truncated, original $DIFF_SIZE bytes)" >> /tmp/commit-truncated.txt
            mv /tmp/commit-truncated.txt /tmp/commit.txt
          fi

          # ===== TIER 1: Mechanical 룰 grep (결정적, 시각 스캔 의존 X) =====
          ADDED_CS=$(git show "$SHA" -- '*.cs' | grep -E '^\+[^+]' || true)

          echo "=== Tier 1: Mechanical grep results ==="
          MECHANICAL_VIOLATIONS=""

          # var 금지
          VAR_HITS=$(echo "$ADDED_CS" | grep -nE '\bvar\s+\w+\s*=' || true)
          if [ -n "$VAR_HITS" ]; then
            echo "❌ var 금지 위반:"
            echo "$VAR_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- \`var\` 금지 위반:\n$(echo "$VAR_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          # ! 연산자 금지
          NOT_HITS=$(echo "$ADDED_CS" | grep -nE '(if|while)\s*\(\s*!' || true)
          if [ -n "$NOT_HITS" ]; then
            echo "❌ ! 연산자 금지 위반 (== false 사용):"
            echo "$NOT_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- \`!\` 연산자 금지 위반 (\`== false\` 사용):\n$(echo "$NOT_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          # 한 글자 변수명 금지 (i, j 외)
          ONELETTER_HITS=$(echo "$ADDED_CS" | grep -nE '\b(int|string|float|double|bool|long|char|byte|short)\s+[a-hk-z]\s*=' || true)
          if [ -n "$ONELETTER_HITS" ]; then
            echo "❌ 한 글자 변수명 위반 (i, j 외):"
            echo "$ONELETTER_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- 한 글자 변수명 위반 (i, j 외):\n$(echo "$ONELETTER_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          # 상수 UPPER_SNAKE_CASE
          CONST_HITS=$(echo "$ADDED_CS" | grep -nE 'const\s+\w+\s+[a-z][a-zA-Z]*\s*=' || true)
          if [ -n "$CONST_HITS" ]; then
            echo "❌ 상수 UPPER_SNAKE_CASE 위반:"
            echo "$CONST_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- 상수 UPPER_SNAKE_CASE 위반:\n$(echo "$CONST_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          # Keyboard.current / Mouse.current (InputManager 외)
          KEYBOARD_HITS=$(git show "$SHA" --name-only | grep -E '\.cs$' | grep -v 'InputManager\.cs' | xargs -I {} sh -c "git show '$SHA':{} 2>/dev/null | grep -nE '(Keyboard|Mouse)\.current\b'" 2>/dev/null || true)
          if [ -n "$KEYBOARD_HITS" ]; then
            echo "❌ Keyboard.current / Mouse.current 직접 접근 위반:"
            echo "$KEYBOARD_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- \`Keyboard.current\`/\`Mouse.current\` 직접 접근 (InputManager 외):\n$(echo "$KEYBOARD_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          # MenuItem path top-level
          MENUITEM_HITS=$(echo "$ADDED_CS" | grep -nE 'MenuItem.*"WitchMendokusai/' || true)
          if [ -n "$MENUITEM_HITS" ]; then
            echo "❌ MenuItem path top-level 위반 (WM/ 사용해야):"
            echo "$MENUITEM_HITS" | head -5
            MECHANICAL_VIOLATIONS+="- MenuItem path top-level 위반 (\`WM/...\` 사용):\n$(echo "$MENUITEM_HITS" | head -5 | sed 's/^/  /')\n"
          fi

          if [ -z "$MECHANICAL_VIOLATIONS" ]; then
            echo "✅ Mechanical 룰 위반 0"
            MECHANICAL_RESULT="모든 mechanical 룰 통과 (var/!/한글자/UPPER_SNAKE/Keyboard.current/MenuItem)"
          else
            MECHANICAL_RESULT="$MECHANICAL_VIOLATIONS"
          fi

          # ===== TIER 2: Semantic 분석 (Claude) =====
          PROMPT="# 임무: WitchMendokusai commit audit (semantic)

          Tier 1 (mechanical grep) 이 이미 결정적 룰 (var/!/한글자 변수명/UPPER_SNAKE/Keyboard.current/MenuItem) 을 검사함. 결과는 아래 「Mechanical 결과」 섹션 에 그대로 입력. 본인은 *사실로 받아들이고* 그 외 semantic 룰만 검사.

          ## 본인이 검사할 영역 (semantic 만)

          1. 버그 / 논리 오류 / edge case (실제 diff 의 코드 흐름)
          2. 보안 (injection, 권한, 데이터 노출)
          3. 성능 (알고리즘, 메모리)
          4. WitchMendokusai CLAUDE.md semantic 룰:
             - Allman 중괄호 (항상 새 줄, 시각 검토)
             - FastFail (TryGet/null 체크/기본값으로 증상 덮기 X)
             - 수치 하드코딩 (SO/[SerializeField]/Variable<T> 미노출)
             - 이벤트/델리게이트 \`delegate { }\` 초기화 안 한 케이스
             - InputManager.RegisterInputEvent 경유 안 한 입력 이벤트 (Tier 1 의 Keyboard.current grep 보다 더 넓은 영역)

          ## 원칙

          - Actionable 한 지적만 — nitpick/주관/스타일 X
          - 큰 아키텍처 지적은 「영향」 섹션에만 (revert 제안 X)
          - chore/docs/yaml/.md 만 변경 = semantic 검사 면제 → PASS
          - 의심 약함 = PASS (false positive 비용 ↑)
          - Tier 1 결과는 *사실* — 의심하거나 재해석 X

          ## 출력 형식 (절대 룰)

          모든 응답은 **반드시 마지막 줄** 이 다음 두 중 하나:

          \`\`\`
          AUDIT_RESULT: PASS
          \`\`\`
          또는
          \`\`\`
          AUDIT_RESULT: FAIL
          \`\`\`

          - PASS = Mechanical 결과 = 위반 0 + 본인 semantic 검사 = 위반 0
          - FAIL = Mechanical 결과 위반 1+ OR 본인 semantic 위반 1+
          - FAIL 본문 = Tier 1 결과 그대로 인용 + 본인 semantic 지적 (각각 \`-\` bullet)

          마커 외 다른 형식 / 메타 / 부연설명 금지.

          === Mechanical 결과 (Tier 1 grep) ===

          $MECHANICAL_RESULT

          === Audit 대상 commit (git show 출력) ===

          $(cat /tmp/commit.txt)

          === Audit 대상 끝 ==="

          echo "=== Running audit (Tier 2) ==="
          OUTPUT=$(claude --print "$PROMPT") || {
            echo "❌ Claude audit invocation failed"
            exit 1
          }

          echo "=== Audit output ==="
          echo "$OUTPUT"
          echo ""

          # 결과 파싱
          CLAUDE_FAIL=$(echo "$OUTPUT" | tail -5 | grep -q "AUDIT_RESULT: FAIL" && echo "yes" || echo "no")
          MECHANICAL_FAIL=$([ -n "$MECHANICAL_VIOLATIONS" ] && echo "yes" || echo "no")

          if [ "$MECHANICAL_FAIL" = "no" ] && [ "$CLAUDE_FAIL" = "no" ]; then
            echo "✅ PASS — Tier 1 + Tier 2 모두 위반 0"
            exit 0
          fi

          # ===== FAIL → AUTO-FIX 시도 =====
          echo "⚠ FAIL — Tier 1: $MECHANICAL_FAIL / Tier 2: $CLAUDE_FAIL"

          COMMIT_SUBJECT=$(git log -1 --format=%s "$SHA")
          COMMIT_AUTHOR=$(git log -1 --format=%an "$SHA")

          # SHA != HEAD 면 auto-fix 차단 (workflow_dispatch 옛 SHA 감사) — Issue fallback only
          if [ "$IS_HEAD" != "yes" ]; then
            echo "::notice::SHA != HEAD — auto-fix skip, Issue fallback"
            FIX_FAILED=yes
            FIX_REASON="SHA ($SHA) != origin/main HEAD — auto-fix 차단 (workflow_dispatch 옛 SHA 감사)"
            FIX_DIFF=""
          else
            echo "=== Auto-fix attempt (Claude CLI direct edit) ==="

            FIX_PROMPT="# 임무: WitchMendokusai audit 위반 자동 fix

            commit \`$SHA\` 가 audit FAIL. Tier 1 (mechanical grep) + Tier 2 (semantic Claude 분석) 결과 아래. 위반된 .cs 파일들을 직접 Edit 으로 fix.

            ## 적용 룰

            **Tier 1 (mechanical, 결정적)** — 항상 fix:
            - \`var x = ...\` → 명시 타입 (\`Type x = ...\`). 우변 추론으로 정확한 타입 박기.
            - \`if (!x)\` / \`while (!x)\` → \`if (x == false)\` / \`while (x == false)\`.
            - 단일 글자 변수명 (i,j 외) → 의미 있는 풀네임 (예: \`int t = ...\` → \`int targetCount = ...\`, 우변/사용처 보고 결정).
            - \`const Type lowercaseName\` → \`const Type UPPER_SNAKE_CASE\` (호출처도 모두 갱신).
            - \`Keyboard.current\` / \`Mouse.current\` (InputManager 외 파일) → \`InputManager.RegisterInputEvent\` 패턴 으로 변환. 단순 변환 어려우면 SKIP 표시.
            - \`MenuItem(\"WitchMendokusai/...\")\` → \`MenuItem(\"WM/...\")\`.

            **Tier 2 (semantic, 판단 필요)** — 안전한 local fix 만:
            - Allman 중괄호 위반 → 줄바꿈 정정.
            - 수치 하드코딩 → SO/SerializeField 도입은 *큰 변경* — SKIP 표시 (human 신호).
            - FastFail 위반 (TryGet/null 체크) → 등록 누락 추적 필요 → SKIP 표시.
            - 델리게이트 null 초기화 누락 → \`= delegate { }\` 추가.

            ## 원칙

            - 위반된 코드 외 *건드리지 마라*. 무관 리팩터 X.
            - 코드 주석 추가 X. fix 한 줄에 \`// audit-fix\` 같은 메타 X.
            - 한 위반이라도 fix 했으면 마지막 줄 \`AUDIT_FIX_RESULT: APPLIED\`.
            - 모든 위반이 SKIP (human 필요) 이면 마지막 줄 \`AUDIT_FIX_RESULT: SKIPPED\`.
            - SKIP 사유는 출력 본문에 짧게 (1-2 줄).

            === Tier 1 결과 ===

            $MECHANICAL_RESULT

            === Tier 2 결과 ===

            $OUTPUT

            === Audit 대상 commit (참고) ===

            $(cat /tmp/commit.txt)

            === 끝 — 위 위반 fix 시작 ==="

            FIX_OUTPUT=$(claude --print --permission-mode bypassPermissions "$FIX_PROMPT" 2>&1) || {
              echo "❌ Claude fix invocation failed"
              FIX_FAILED=yes
              FIX_REASON="Claude CLI 호출 실패"
              FIX_DIFF=""
            }

            if [ -z "${FIX_FAILED:-}" ]; then
              echo "=== Fix output ==="
              echo "$FIX_OUTPUT"
              echo ""

              # Claude 가 SKIPPED 라고 명시 → human 신호
              if echo "$FIX_OUTPUT" | tail -5 | grep -q "AUDIT_FIX_RESULT: SKIPPED"; then
                echo "::notice::Claude marked SKIPPED — human 신호"
                FIX_FAILED=yes
                FIX_REASON="Claude SKIPPED — semantic 위반은 human 결정 필요 (FastFail / 수치 하드코딩 / Keyboard.current 패턴 변환 등)"
                FIX_DIFF=""
              elif git diff --quiet; then
                # Claude APPLIED 라 했지만 실제 변경 0 — 비정합
                echo "::warning::Claude APPLIED 응답이지만 git diff 비어있음"
                FIX_FAILED=yes
                FIX_REASON="Claude APPLIED 응답이지만 실제 파일 변경 0 (비정합)"
                FIX_DIFF=""
              else
                # 실제 변경 있음 → commit + push 시도
                FIX_DIFF=$(git diff --stat)
                echo "=== Fix diff stat ==="
                echo "$FIX_DIFF"

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                # 변경된 .cs 와 .meta 만 staging (audit 영역)
                git add -A -- '*.cs' '*.cs.meta'

                # 비정합: Claude 가 audit 무관 파일 만짐 → fail
                UNTRACKED=$(git status --porcelain | grep -vE '^[AM]  .*\.(cs|cs\.meta)$' || true)
                if [ -n "$UNTRACKED" ]; then
                  echo "::warning::Claude 가 .cs/.cs.meta 외 파일 만짐:"
                  echo "$UNTRACKED"
                  git reset --hard HEAD
                  FIX_FAILED=yes
                  FIX_REASON="Claude 가 audit 영역 (*.cs / *.cs.meta) 밖 파일 변경 시도 — 거부"
                  FIX_DIFF=""
                else
                  COMMIT_MSG="chore(audit-fix): $COMMIT_SUBJECT

          Auto-fix by Claude post-push audit (TASK-WM-093). 원본 commit: $SHA.

          Tier 1 mechanical + Tier 2 safe-local violations fixed automatically.
          See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

                  if git commit -m "$COMMIT_MSG"; then
                    # push race 회피 — fetch + rebase + push retry (max 2회)
                    PUSH_OK=no
                    for attempt in 1 2; do
                      git fetch origin main
                      if git rebase origin/main; then
                        if git push origin main; then
                          PUSH_OK=yes
                          break
                        fi
                      else
                        git rebase --abort
                      fi
                      echo "::warning::push attempt $attempt 실패 — retry"
                      sleep 2
                    done

                    if [ "$PUSH_OK" = "yes" ]; then
                      echo "✅ Auto-fix push 성공 — yawnbot Discord 알림은 push event 자동 도착"
                      exit 0
                    else
                      FIX_FAILED=yes
                      FIX_REASON="Fix commit 생성 OK, push 2회 실패 (race / rebase conflict)"
                    fi
                  else
                    FIX_FAILED=yes
                    FIX_REASON="git commit 실패 (pre-commit hook 등)"
                  fi
                fi
              fi
            fi
          fi

          # ===== FIX 실패 → Issue fallback =====
          echo "⚠ Auto-fix 실패 → Issue fallback"

          ISSUE_BODY=$(cat <<EOF
          **Commit**: \`$SHA\`
          **Author**: $COMMIT_AUTHOR
          **Subject**: $COMMIT_SUBJECT

          ## Tier 1 — Mechanical grep 결과

          $MECHANICAL_RESULT

          ## Tier 2 — Semantic 분석 (Claude)

          $OUTPUT

          ## Auto-fix 시도 결과 — 실패

          **사유**: $FIX_REASON

          $(if [ -n "${FIX_OUTPUT:-}" ]; then echo "**Claude fix output (요약)**:"; echo ""; echo '\`\`\`'; echo "$FIX_OUTPUT" | tail -30; echo '\`\`\`'; fi)

          $(if [ -n "$FIX_DIFF" ]; then echo "**시도된 diff stat**:"; echo ""; echo '\`\`\`'; echo "$FIX_DIFF"; echo '\`\`\`'; fi)

          ## 사용자 액션

          ### 옵션 A — Manual fix
          위 Tier 1/2 지적 사항 수동 fix → main 직접 push.

          ### 옵션 B — Revert (위험도 ↑ 시)
          \`\`\`bash
          git revert $SHA
          \`\`\`

          ---
          🤖 Generated by Claude post-push audit + auto-fix (TASK-WM-093). Auto-fix 가 실패 (위 사유) → human 신호로 Issue 생성.
          EOF
          )
          gh issue create \
            --title "[audit fix-failed] $COMMIT_SUBJECT" \
            --label "audit,trunk-based,fix-failed" \
            --body "$ISSUE_BODY" \
            --repo "${{ github.repository }}"
          echo "✅ Fix-failed Issue 생성"
