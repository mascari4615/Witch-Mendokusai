name: Claude Post-Push Audit

# TASK-WM-063 sub-K — post-push audit 재구현 (raw Claude CLI 직접 호출).
#
# 직전 시도 (claude-audit job in claude.yml, anthropics/claude-code-action@v1
# mode=agent + push trigger) 가 action 의 push event 미지원으로 실패.
# 본 워크플로는 raw `claude --print` CLI 직접 호출 패턴 — action wrapper X.
#
# POC 단계 (현재): workflow_dispatch 만. 수동 트리거 → 작동 확인 → push 트리거 추가.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Audit 대상 commit SHA (default = HEAD)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # HEAD~1 diff 비교용

      - name: Resolve target SHA
        id: target
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target SHA: $SHA"
          git show --stat "$SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude CLI auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "=== claude --version ==="
          claude --version
          echo ""
          echo "=== claude --print 'hello' (auth smoke test) ==="
          claude --print "Reply with just the word OK if you can see this." || {
            echo "❌ Claude CLI auth failed"
            exit 1
          }

      - name: Run audit on target SHA
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # diff 추출 (file 로 파이프해서 prompt 안전하게 처리)
          git show "$SHA" > /tmp/commit.txt
          DIFF_SIZE=$(wc -c < /tmp/commit.txt)
          echo "Diff size: $DIFF_SIZE bytes"

          # 큰 diff 잘라내기 (50KB 제한 — Claude 토큰 비용)
          if [ "$DIFF_SIZE" -gt 51200 ]; then
            head -c 51200 /tmp/commit.txt > /tmp/commit-truncated.txt
            echo "... (truncated, original $DIFF_SIZE bytes)" >> /tmp/commit-truncated.txt
            mv /tmp/commit-truncated.txt /tmp/commit.txt
          fi

          # Audit prompt — v2: 형식 강제 + 메타 금지 + stdin 명시
          PROMPT='# 임무: WitchMendokusai commit audit

          stdin 으로 들어오는 git commit 내용을 audit 한다. **diff 의 코드/문서 자체만** 검토 — 본 워크플로 / audit 시스템 / prompt 자체에 대한 메타 코멘트는 절대 하지 X.

          ## 검토 영역

          1. 버그 / 논리 오류 / edge case (실제 diff 의 코드)
          2. 보안 (injection, 권한, 데이터 노출)
          3. 성능 (알고리즘, 메모리)
          4. WitchMendokusai CLAUDE.md 룰 (`.cs` 파일 변경 시만):
             - Allman 중괄호 (항상 새 줄)
             - `== false` (`!` 연산자 금지)
             - `var` 금지 (명시적 타입)
             - 변수명 풀네임 (for 의 i, j 외)
             - 상수 UPPER_SNAKE_CASE
             - FastFail (TryGet/null 체크/기본값으로 증상 덮기 X)
             - 수치 SO/[SerializeField]/Variable<T>
             - InputManager.RegisterInputEvent 경유 (`Keyboard.current` 직접 X)
             - MenuItem path top-level `WM/`

          ## 원칙

          - Actionable 한 지적만 — nitpick/주관/스타일 X
          - 큰 아키텍처 지적은 「영향」 섹션에만 (revert 제안 X)
          - chore/docs/yaml/.md 만 변경 = 룰 grep 면제 → PASS
          - 의심 약함 = PASS (false positive 비용 ↑)

          ## 출력 형식 (절대 룰)

          모든 응답은 **반드시 마지막 줄** 이 다음 두 중 하나:

          ```
          AUDIT_RESULT: PASS
          ```
          또는
          ```
          AUDIT_RESULT: FAIL
          ```

          - PASS = 본문 비워둠 또는 짧게 "no issue"
          - FAIL = 본문에 actionable 지적 (한 항목씩 `-` bullet) + 마지막 줄 마커

          마커 외 다른 형식 / 메타 / 부연설명 금지.'

          # CLI 실행
          echo "=== Running audit ==="
          OUTPUT=$(claude --print "$PROMPT" < /tmp/commit.txt) || {
            echo "❌ Claude audit invocation failed"
            exit 1
          }

          echo "=== Audit output ==="
          echo "$OUTPUT"
          echo ""

          # 결과 파싱
          if echo "$OUTPUT" | tail -5 | grep -q "AUDIT_RESULT: PASS"; then
            echo "✅ PASS — no issue"
            exit 0
          elif echo "$OUTPUT" | tail -5 | grep -q "AUDIT_RESULT: FAIL"; then
            echo "⚠ FAIL — creating Issue"
            COMMIT_SUBJECT=$(git log -1 --format=%s "$SHA")
            COMMIT_AUTHOR=$(git log -1 --format=%an "$SHA")
            ISSUE_BODY=$(cat <<EOF
          **Commit**: \`$SHA\`
          **Author**: $COMMIT_AUTHOR
          **Subject**: $COMMIT_SUBJECT

          ## 발견된 문제

          $OUTPUT

          ## 제안

          ### 옵션 A — Revert (위험도 ↑ 시)
          \`\`\`bash
          git revert $SHA
          \`\`\`

          ### 옵션 B — 후속 fix commit
          위 지적 사항 fix 후 main 직접 push.

          ---
          🤖 Generated by Claude post-push audit (TASK-WM-063 sub-K)
          EOF
          )
            gh issue create \
              --title "[main audit] $COMMIT_SUBJECT" \
              --label "audit,trunk-based" \
              --body "$ISSUE_BODY" \
              --repo "${{ github.repository }}"
            echo "✅ Issue created"
          else
            echo "❌ Unparseable output (no AUDIT_RESULT marker)"
            echo "Will be treated as run failure."
            exit 1
          fi
