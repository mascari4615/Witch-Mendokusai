name: Claude Code

# TASK-WM-063 (Trunk-based AI Native, 2026-05-09):
# - PR/auto-merge/auto-rebase 폐기 → main 직접 push.
# - claude-review (PR-bound) 폐기.
# - claude (@claude on-demand) 유지 — Issue / 사용자 수동 호출 hook.
#
# claude-audit (post-push) 시도 → 동일 day 폐기 사유:
#   anthropics/claude-code-action@v1 가 push event 미지원
#   ("Unsupported event type: push" error). PR-bound 만 작동.
#   raw claude CLI 직접 호출 패턴은 sub-K 후속 TASK 로 분리.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  # claude (on-demand) = issue.number 기반 직렬화 (같은 Issue 중복 호출 큐).
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # @claude 멘션 on-demand — Issue 본문/코멘트로 Claude 직접 호출.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
