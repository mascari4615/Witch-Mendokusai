name: WM dead code ratchet

# TASK-WM-209 — 「만들었지만 아무도 안 부르는 것」이 새로 생기는 걸 막는다.
#
# 왜 CI 냐: 2026-08-07 에 커밋 하나가 파일 105개를 지웠는데 **컴파일이 안 깨졌다.**
# 지워진 층을 부르는 코드가 0곳이었기 때문이다. 아무도 모른 채 하루가 지났다.
# 검사기는 그날 만들었지만 손으로 돌려야 했다 — 「검사기가 있다고 검사가 도는 건 아니다」.
#
# 게이트가 아니라 **래칫**이다. 지금 있는 빚은 기준선 파일에 적혀 있고 그건 통과한다.
# 기준선에 없는 것이 새로 「안 불림」이 되면 빨강. 반대로 배선이 끝나면 기준선을 줄이라고 요구한다.
#
# 유니티가 필요 없다 — git 목록 + grep 뿐이라 몇십 초면 끝난다.

on:
  push:
    branches: [main]
    paths:
      - 'Assets/_WitchMendokusai/**'
      - '.github/scripts/wm-unwired-layer-audit.sh'
      - '.github/scripts/wm-unwired-layer-baseline.tsv'
      - '.github/scripts/wm-unplaced-component-audit.sh'
      - '.github/scripts/wm-unplaced-component-baseline.tsv'
      - '.github/workflows/wm-dead-code-ratchet.yml'
  pull_request:
    paths:
      - 'Assets/_WitchMendokusai/**'
      - '.github/scripts/wm-unwired-layer-audit.sh'
      - '.github/scripts/wm-unwired-layer-baseline.tsv'
      - '.github/scripts/wm-unplaced-component-audit.sh'
      - '.github/scripts/wm-unplaced-component-baseline.tsv'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wm-dead-code-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # 두 검사 다 실행 권한에 기대지 않는다 — 옛 훅 두 개가 리눅스에서 조용히 안 돌던 전례가 있다.
      - name: unwired layer ratchet
        run: bash .github/scripts/wm-unwired-layer-audit.sh

      - name: unplaced component ratchet
        run: bash .github/scripts/wm-unplaced-component-audit.sh --list
