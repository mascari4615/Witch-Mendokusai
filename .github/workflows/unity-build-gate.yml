name: Unity Build Gate

# C# 컴파일 게이트 — main assembly 가 컴파일 통과해야 PR 머지 가능.
# 직전 사고 (TASK-WM-047): 다른 세션이 working tree 에서 UIStatus.Status 제거 후 사용처 fix
# 안 한 채 commit/머지 → main broken. typos check 만으로는 못 잡음.
# 본 게이트가 진짜 근본 차단 — game-ci/unity-test-runner 로 EditMode test 1개 (compile smoke) 실행.

on:
  push:
    branches: [main]
  pull_request:
    # base 제한 없음 — chained PR 도 게이트.
    # ready_for_review 추가: autopilot 룰이 Draft → 즉시 Ready 전환 흐름 — 그때도 게이트 trigger.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  editmode-tests:
    name: EditMode tests (compile gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Personal license fresh activation — credentials 만으로 runner 안에서 활성화.
      # game-ci/unity-request-activation-file (.alf 발급) 흐름은 deprecated (2023-12) + Unity 6.x Personal manual 활성화 자체 폐지 (Unity 2022.1+).
      # buildalon/activate-unity-license@v2 가 Unity 6.x Personal/Pro/Floating 모두 지원 + Verified action.
      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: '6.x'

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.5f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
