name: Release

# TASK-WM-066 — Trunk-based Release flow
# Trigger: tag `v*` push (사용자 수동 `git tag v0.0.5 && git push origin v0.0.5`)
# Side effect: main 에 「chore(release): vX.Y.Z — auto bump bundleVersion + CHANGELOG」 직접 commit (post-tag)
# 한계 (의도): tag 자체는 사용자가 push 한 commit 가리킴. bundleVersion bump 는 post-tag commit (main HEAD).
#   tag 와 bundleVersion 1-commit drift 발생. force push tag 미사용 (룰 「force push 절대 X」 우선).
#   빌드 시점 = main HEAD post-release (tag 가 아닌 다음 commit) — 본 정책 빌드 자동화 (TASK-WM-067) 에서 적용.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag/log)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Resolve tag + previous tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 이전 tag (current 제외, semver 정렬)
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG, Version=$VERSION, PrevTag=$PREV_TAG"

      - name: Generate CHANGELOG fragment (Conventional Commits)
        id: changelog
        run: |
          set -euo pipefail
          PREV='${{ steps.ver.outputs.prev_tag }}'
          TAG='${{ steps.ver.outputs.tag }}'
          if [ -z "$PREV" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV}..${TAG}"
          fi
          DATE=$(date -u +%Y-%m-%d)
          FRAGMENT=/tmp/changelog-fragment.md
          {
            echo "## [$TAG] - $DATE"
            echo ""
            if [ -n "$PREV" ]; then
              echo "_Compared with [\`$PREV\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG})_"
              echo ""
            fi
          } > "$FRAGMENT"

          emit_section() {
            local TYPE="$1" HEADER="$2"
            local LINES
            LINES=$(git log --no-merges --pretty=format:'%h|%s' "$RANGE" \
              | awk -F'|' -v t="$TYPE" 'BEGIN{IGNORECASE=0} $2 ~ "^"t"(\\([^)]+\\))?:" {print}' \
              || true)
            if [ -n "$LINES" ]; then
              {
                echo "$HEADER"
                echo ""
                echo "$LINES" | while IFS='|' read -r SHA SUBJECT; do
                  CLEAN=$(echo "$SUBJECT" | sed -E "s/^${TYPE}(\\([^)]+\\))?:[[:space:]]*//")
                  echo "- ${CLEAN} (\`${SHA}\`)"
                done
                echo ""
              } >> "$FRAGMENT"
            fi
          }

          emit_section feat     "### Features"
          emit_section fix      "### Fixes"
          emit_section perf     "### Performance"
          emit_section refactor "### Refactor"
          emit_section docs     "### Docs"
          emit_section test     "### Tests"
          emit_section build    "### Build"
          emit_section ci       "### CI"
          emit_section chore    "### Chore"
          emit_section style    "### Style"
          emit_section revert   "### Revert"

          UNCAT=$(git log --no-merges --pretty=format:'%h|%s' "$RANGE" \
            | awk -F'|' '$2 !~ /^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([^)]+\))?:/' \
            || true)
          if [ -n "$UNCAT" ]; then
            {
              echo "### Other"
              echo ""
              echo "$UNCAT" | while IFS='|' read -r SHA SUBJECT; do
                echo "- ${SUBJECT} (\`${SHA}\`)"
              done
              echo ""
            } >> "$FRAGMENT"
          fi

          echo "--- CHANGELOG fragment ---"
          cat "$FRAGMENT"
          echo "--- end ---"

      - name: Prepend fragment to CHANGELOG.md
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project are documented here."
              echo "Format: [Conventional Commits](https://www.conventionalcommits.org) categories. Auto-generated by \`.github/workflows/release.yml\` on tag push."
              echo ""
            } > CHANGELOG.md
          fi
          # 기존 헤더(상단 4줄) 보존, 그 아래에 fragment 삽입
          HEADER=$(head -n 4 CHANGELOG.md)
          BODY=$(tail -n +5 CHANGELOG.md)
          {
            echo "$HEADER"
            cat /tmp/changelog-fragment.md
            echo "$BODY"
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md
          head -40 CHANGELOG.md

      - name: Bump bundleVersion in ProjectSettings.asset
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          FILE=ProjectSettings/ProjectSettings.asset
          if [ ! -f "$FILE" ]; then
            echo "::error::ProjectSettings.asset not found"
            exit 1
          fi
          OLD=$(grep -E '^  bundleVersion: ' "$FILE" | head -1 | awk '{print $2}')
          sed -i "s/^  bundleVersion: .*/  bundleVersion: ${VERSION}/" "$FILE"
          NEW=$(grep -E '^  bundleVersion: ' "$FILE" | head -1 | awk '{print $2}')
          echo "bundleVersion: ${OLD} → ${NEW}"
          if [ "$NEW" != "$VERSION" ]; then
            echo "::error::bundleVersion sed 실패 (NEW=${NEW}, VERSION=${VERSION})"
            exit 1
          fi

      - name: Commit + push release artifacts to main
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md ProjectSettings/ProjectSettings.asset
          if git diff --cached --quiet; then
            echo "::warning::CHANGELOG / bundleVersion 변경 없음 — release commit 스킵"
          else
            git commit -m "chore(release): ${TAG} — auto bump bundleVersion + CHANGELOG"
            git push origin main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/changelog-fragment.md \
            --verify-tag
