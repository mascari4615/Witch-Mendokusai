    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rules:
    name: code rules (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ★ 안 도는 시험은 <크게 적는다> (TASK-WM-286). EditMode 잡은 지금 손으로 부를 때만 돈다 --
      #   그런데 깃허브는 건너뛴 잡이 있어도 실행을 success 라 부른다. 그 초록을 "유니티도 봤다"로
      #   읽으면 그게 곧 거짓 초록이다(2026-08-07 에 한 번 당했다). 그래서 매 판 여기서 말한다.
      - name: Say what did NOT run
        run: |
          echo "::warning title=EditMode 안 돎::유니티 EditMode 시험은 지금 <손으로 부를 때만> 돈다 (TASK-WM-221 라이선스 / WM-286). 이 실행의 초록에 유니티는 안 들어 있다."

      - name: Run WM rule gate
        shell: pwsh
        run: |
          ./.github/scripts/wm-rule-gate.ps1

      # TASK-WM-231 -- 받아 놓고 안 쓰는 인자는 「말이 안 나간 것」과 같다. 컴파일러도 시험도
      # 화면도 멀쩡한 채로 계약이 반쪽이 된다(WM-230 이 그렇게 나갔다).
      # 자르는 숫자마다 「왜 그 숫자인가」가 옆에 적혀 있나 (TASK-WM-323) — 코드만 읽어 몇 초다.
      - name: Run threshold audit
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-threshold-audit.mjs

      - name: Run dead-parameter audit
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-dead-parameter-audit.mjs

      # 검사기가 아직 눈을 뜨고 있나 — 표본으로 먼저 본다 (TASK-WM-211).
      #
      # ★ 왜 검사기를 검사하나: 이 게이트는 찾는 이름이 한 글자 어긋난 채로 오래 초록이었다.
      #   금지 대상 1순위인 호출을 한 번도 못 본 것인데, 화면에는 「위반 0 · PASS」로 나왔다.
      #   초록이 「위반 없음」인지 「안 봤음」인지 사람 눈으로는 구분이 안 된다 — 그래서 기계가 먼저 묻는다.
      #   이 단계가 빨개지면 아래 감사 결과는 믿을 게 못 된다.
      - name: Self-test init-order audit
        shell: pwsh
        run: |
          ./.github/scripts/wm-init-order-audit.ps1 -SelfTest

      # init-order 안티패턴 (Awake 안 Find 등) — 이것도 유니티 없이 도는 결정적 검사인데
      # 그동안 사람이 손으로 부를 때만 돌았다. BLOCK 0 이 현재 baseline.
      - name: Run init-order audit
        shell: pwsh
        run: |
          ./.github/scripts/wm-init-order-audit.ps1

      # 대화 하네스 — 유니티 없이 도는 순수 로직 시험(TASK-WM-052). 몇 초면 끝난다.
      #
      # ★ 왜 여기(ubuntu)에도 두나: 아래 EditMode 잡은 노트북 러너 한 대에 걸려 있어 자주 밀리거나
      #   취소된다(이 파일 위쪽 주석의 실측 그대로). 그때 대화 쪽은 **아무 신호도 안 남는다.**
      #   이 단계는 러너 상태와 무관하게 항상 돌아, 적어도 순수 로직이 깨졌는지는 바로 알려준다.
      #   유니티 시험의 대체가 아니다 — 직렬화·에셋·PlayMode 는 여전히 아래 잡만 본다.
      # ★ 8.0.x 다 — 저장소 root 의 `global.json` 이 SDK 를 8.0.407(latestPatch)로 못박기 때문.
      #   10 을 깔아 봐야 muxer 는 global.json 을 따라 8 을 고르고, 그러면 net10 을 못 짓는다
      #   (NETSDK1045 로 이 잡이 계속 빨갰다). 진짜 프로젝트는 전부 net8.0 이다.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run dialogue harness
        run: dotnet run --project Tools/dialogue-harness

      # TASK-WM-217 -- 웹 창이 계약을 따라가고 있나(문법·서버 말·손잡이). 창엔 시험이 없다.
      - name: Run web client gate
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-client-gate.mjs

      # TASK-WM-217 -- 「번호 0을 없음으로」 쓰는 자리를 막는다. WM 의 나무가 0번이라
      # 그 자리는 그 종류를 조용히 지운다(하루에 세 번 밟았다 — 사람 기억으로 막을 부류가 아니다).
      # ★ 이 둘은 한때 memo 체크아웃에 살았다 — 그래서 리눅스 러너에서 파일을 못 찾았다.
      #   검사기는 검사할 저장소 안에 있어야 어디서든 돈다.
      # TASK-WM-217 -- 게임 창이 세계를 실제로 쓰고 있나(읽는 자리 14 · 말하는 길 16).
      # 웹 창에는 감시가 있었는데 게임 창에는 없었다 — 그 사이 마도서를 한 번도 안 읽었고,
      # 솥 비우기·완성이 폐기된 옛 길로 나가 조용히 안 됐다(둘 다 컴파일은 초록이었다).
      - name: Run game client gate
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-game-client-gate.mjs

      # TASK-WM-217 -- 웹 창이 <b>보여 주는 글</b>이 맞나(「나무 2/2」 같은 것).
      # 창의 순수 계산(picker.mjs)만 떼어 진짜 데이터로 돌린다 — DOM 없이 도는 자리다.
      - name: Run web picker test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-picker-test.mjs

      # TASK-WM-217 -- 끊긴 줄을 언제 다시 이을까 (웹 창 몫). 게임 창엔 있고 웹엔 없던 규칙이다.
      - name: Run web link test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-link-test.mjs

      # TASK-WM-235 -- 걷는 자리가 둘이 됐다(지도 2D · 세계 3D). 같은 규칙을 두 벌 적으면
      # 갈라지고, 갈라진 걸음은 「나만 다른 데 서 있는」 세계가 된다. 한 벌을 여기서 못박는다.
      - name: Run web walk test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-walk-test.mjs

      - name: Run zero-id guard
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-zero-id-guard.mjs

  web-live:
    name: web window lives (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ★ 8.0.x 다 — 저장소 root 의 `global.json` 이 SDK 를 못박는다(위 잡 주석과 같은 이유).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # WM 저장소에는 node 의존성이 없다 — 브라우저는 임시 폴더에 깔고 자리만 알려 준다.
      - name: Install playwright chromium
        run: |
          mkdir -p /tmp/wm-playwright
          cd /tmp/wm-playwright
          npm init -y >/dev/null
          npm i playwright@1.62.1 >/dev/null
          npx playwright install --with-deps chromium

      # TASK-WM-217 -- 웹 창은 문법·계약만 봤다. 여기서는 진짜 세계를 띄우고 진짜 창을 열어
      # <b>세계를 죽였다 살린다</b> — 사람 손 없이 다시 붙어 소식이 다시 흐르는지까지 본다.
      - name: Run web reconnect smoke
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-reconnect-smoke.mjs

      # TASK-WM-217 -- 둘이 되는 것과 마흔이 되는 것은 다른 일이다. 봇을 몰아넣고
      # 그 한복판에서 창이 계속 그려지는지·알림이 사람 수만큼 부푸는지 <b>수치로</b> 본다.
      - name: Run web crowd smoke
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
          WM_CROWD: '40'
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-crowd-smoke.mjs

      # TASK-WM-345 -- 「무리 + 창 하나」와 「창 셋 + 무리 없음」이 다 초록이어도 <b>창 셋이 같은 무리에</b>
      # 있을 때는 다르다. 세계는 창마다 따로 좁히므로 <b>한 창만 굶는</b> 편식이 생긴다(실제로 그랬다).
      # TASK-WM-347 -- 「보내는 쪽」이 밀릴 때는 여러 번 고쳤는데 <b>받는 쪽</b>은 한 번도 안 쟀다.
      # 한 사람이 초당 수천 마디를 쏟아도 남들의 세계가 그대로인지 · 말 예산이 실제로 깎는지 본다.
      # TASK-WM-348 -- 예산은 <b>성한 사람</b>도 자른다. 넘긴 말은 조용히 버려지므로(끊지 않는다)
      # 아무 데도 안 적힌다. 진짜 창이 나쁜 회선에서 걸을 때 몇 마디를 쓰는지·여유가 남는지 본다.
      - name: Run honest budget test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-honest-budget-test.mjs

      # TASK-WM-349 -- 세계에 정원이 없으면 사람이 늘수록 <b>모두가</b> 나빠진다. 가득 차면
      # 이유를 말하고 닫고, 안에 있는 사람은 지키는지 본다(정원을 낮춰 띄워 규칙만 본다).
      # TASK-WM-351 -- 상자 경합은 쟀는데 <b>짓기 경합</b>은 안 쟀다. 둘이 같은 칸을 같은 순간에
      # 노리면 집이 둘 서거나 진 사람 재료가 사라질 수 있다.
      # TASK-WM-352 -- 줍기 경합. 여기가 무너지면 한 자리에서 둘이 다 받아 <b>물건이 는다</b>
      # (MMO 에서 제일 조용한 사고다).
      - name: Run gather race test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-gather-race-test.mjs

      - name: Run build race test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-build-race-test.mjs

      # TASK-WM-355 -- 얼어붙은 줄(덮개 닫은 노트북)은 스스로 안 끊긴다. 놓아주지 않으면
      # 인형이 서 있고 정원 한 자리를 몇 시간씩 먹는다 — 고치기 전 실측 6분 뒤에도 그대로였다.
      # TASK-WM-356 -- 지하철에 들어갔다 나오는 30초. 줄은 안 끊기고 말만 고였다가 한꺼번에 온다.
      # 그때 창이 현재로 돌아오는지 · 그 사이 세계가 그 사람을 안 놓는지 본다.
      - name: Run web thaw test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-thaw-test.mjs

      # TASK-WM-357 -- 사람 줄만 어는 게 아니다. 세계와 세계 사이의 줄이 얼면 국경 소식 보내기가
      # 영원히 안 끝나고 다시 잇는 길까지 막힌다(같은 루프가 하기 때문이다).
      - name: Run frozen neighbour test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-frozen-neighbour-test.mjs

      - name: Run frozen line test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-frozen-line-test.mjs

      - name: Run world full test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-world-full-test.mjs

      - name: Run flood budget test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-flood-budget-test.mjs

      - name: Run web crowd windows test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
          WM_CROWD: '40'
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-crowd-windows-test.mjs

      # TASK-WM-223 -- 「얼마나 보냈나」로는 못 보는 자리. 서버가 20Hz 로 정확히 보내도
      # 그 사이를 안 메우면 화면은 툭툭 끊긴다. 프레임마다 <b>그려진 자리</b>를 직접 본다.
      - name: Run web smoothness test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-smoothness-test.mjs

      # TASK-WM-224 -- 지금까지의 모든 수치는 loopback(지연 0)에서 나왔다. 세계 앞에 진짜
      # TCP 회선(왕복 200ms·흔들림 30ms)을 세우고 창도 봇도 그리로만 붙인다.
      - name: Run web bad-line test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-badline-test.mjs

      # TASK-WM-225 -- 좁은 회선에서 창이 「과거」를 보고 있지 않나. 화면은 부드러운 채로
      # 몇 초 전 세계를 보여 줄 수 있다(버퍼가 쌓이면). 정보의 나이를 직접 잰다.
      - name: Run web narrow-line test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
          WM_CROWD: '40'
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-narrow-line-test.mjs

      # TASK-WM-247 -- prod 는 push 할 때마다 세계를 껐다 켠다. 그 순간 붙어 있던 모두가
      # 동시에 끊기고 동시에 다시 붙는다 — 들어올 때가 제일 비싼데 그게 한꺼번에 온다.
      - name: Run web herd test
        env:
          WM_HERD: '40'
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-herd-test.mjs

      # TASK-WM-249 -- 회선이 아주 나쁘면 3D 엔진은 몇십 초 뒤에 오거나 끝내 안 온다.
      # 그 사이 아무것도 못 하면 그건 게임이 아니라 기다리는 화면이다. 엔진을 막고 재 본다.
      - name: Run web map-only test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-map-only-test.mjs

      # TASK-WM-255 -- 국경은 가장 위험한 순간이다: 보낸 세계는 나를 내보냈고 받는 세계는 아직
      # 나를 모른다. 그 사이 회선이 늦거나 끊기면 사람은 두 세계 어디에도 없게 된다.
      - name: Run web border test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-border-test.mjs

      # TASK-WM-262 -- 싸움 판정은 세계의 <지금> 자리로 본다. 그런데 창이 보는 자리는 회선만큼
      # 낡았다(왕복 200ms 면 상대는 이미 0.6m 옆). 「붙어서 쳤는데 안 맞는다」가 거기서 난다.
      # 지금까지의 싸움 측정은 전부 지연 0 의 loopback 이었다 -- 여기서 처음 나쁜 회선으로 잰다.
      - name: Run strike lag test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-strike-lag-test.mjs

      # TASK-WM-267 -- 국경 너머 보기·말 건너기(WM-263·264)는 서버 시험으로만 쟀다. 사람이 보는 것은
      # 창이다: 세계가 보내 줘도 창이 안 그리면 그 사람에게는 여전히 벽이다. 그리고 그림자는
      # 못 때리는 사람이라, 이 세계 사람과 똑같이 그리면 "왜 저 사람만 반응이 없지"가 된다.
      - name: Run web beyond-the-border test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-beyond-test.mjs

      # TASK-WM-268 -- 세계는 말을 나를 줄 알았는데(WM-250) 창에 말할 자리가 없어 사람은 한 마디도
      # 못 했다. 혼자 걷는 화면과 같이 노는 세계를 가르는 것이 그것이다.
      - name: Run web say test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-say-test.mjs

      # TASK-WM-269 -- 몰린 곳 측정(WM-217)은 전부 loopback 이었다. 몰린 곳에서 제일 먼저 무너지는
      # 것이 회선인데, 지연이 붙었을 때 세계가 창을 "뒤처졌다"고 보고 사람을 줄이는 자리(WM-228)가
      # 진짜 회선에서도 제대로 도는지는 한 번도 안 봤다.
      - name: Run crowd on a bad line test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-crowd-badline-test.mjs

      # TASK-WM-270 -- 내 화면의 나는 세계의 답을 안 기다리고 먼저 간다(앞질러 그리기). 그 앞섬이
      # "도로 끌어오는 거리"(4m)를 넘으면 사람은 뒤로 끌려간다 = "가끔 튄다". 그 한계를 잰다.
      - name: Run prediction lead test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-lead-test.mjs

      # TASK-WM-274 -- 같은 것을 둘이 노리면 하나만 가진다(세계 판정은 시험 있음). 그런데 진 사람
      # 화면은 아무도 안 봤다: 늦은 회선에서는 이미 없어진 것을 계속 보고 있게 된다.
      - name: Run contest loser view test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-contest-test.mjs

      # TASK-WM-277 -- 사람이 실제로 겪는 것은 "창을 새로 여는 일"이다(새로고침·탭 닫았다 열기).
      # 그때 열쇠를 못 들고 가면 남이 된다: 가방도 자리도 남의 것이 된다.
      - name: Run still-me after reload test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-still-me-test.mjs

      # TASK-WM-283 -- 걸음은 앞질러 그려 곧바로 움직이는데, 줍기·짓기는 세계의 답을 기다린다.
      # 왕복 200ms 에서 271ms 동안 화면이 아무 말도 안 했다 -- 사람은 "안 눌렸다"로 읽고 또 누른다.
      - name: Run instant answer test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-answer-test.mjs

      # TASK-WM-287 -- 짓기는 줍기보다 한 겹 더 있다(재료를 쓰고·땅을 고르고·남에게도 보인다).
      # 세계 쪽 판정은 시험이 있지만 <창에서 눌러 짓는 길>은 진짜 창으로 안 재봤다.
      - name: Run web build test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-build-test.mjs

      # TASK-WM-296 -- 지금까지 잰 것은 전부 몇 초짜리다. 세계는 며칠 돈다(prod = 노트북 24시간).
      # 며칠 도는 서버에서 무너지는 것은 프레임이 아니라 천천히 자라는 것이다.
      - name: Run server soak test
        env:
          WM_SOAK_MS: 90000
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-server-soak-test.mjs

      # TASK-WM-300/301 -- 지금까지의 "다시 붙기"는 전부 짧은 끊김이었다(몇 초). 배포는 40초 남짓,
      # 노트북은 잠들었다 깬다. 이 관문이 세우자마자 "같은 기계에서 열면 세계가 텅 빈다"를 잡았다.
      - name: Run long outage test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
          WM_OUTAGE_MS: 30000
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-long-outage-test.mjs

      # 가장 빠른 회선 + 혼자 — WM-301 이 났던 바로 그 자리 (TASK-WM-302).
      - name: Run alone test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-alone-test.mjs

      # 나쁜 회선이라고 계속 헛치지는 않는다 (TASK-WM-303).
      #
      # ⚠ 이 관문은 <b>못 쟀다(exit 2)</b>를 빨강으로 안 친다 — 느린 기계에서 표본이 안 차면
      #   그건 제품이 아니라 재는 자리의 사정이다(domain-wm.md § 관문 규율 ②).
      #   빨강(exit 1)은 그대로 세운다.
      - name: Run strike fairness test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-badline-strike-fairness-test.mjs

      # 남의 걸음이 나쁜 회선에서도 매끄러운가 (TASK-WM-304).
      - name: Run smoothness test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-smooth-test.mjs

      # 끊기는 순간 누른 것이 사라지지도 두 번 되지도 않는다 (TASK-WM-305).
      - name: Run lost action test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-lost-action-test.mjs

      # 관문마다 「빨개지는 것을 봤다」가 적혀 있나 (TASK-WM-336) — 초록은 증거가 아니다.
      - name: Run red walk audit
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-red-walk-audit.mjs

      # 통행증을 복사해 두 번 내밀어도 짐은 한 벌이다 (TASK-WM-335) — 막는 장치를 끄면 40개가 된다.
      - name: Run pass replay test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-pass-replay-test.mjs

      # 같은 신원으로 탭을 둘 열어도 몸도 가방도 하나다 (TASK-WM-334).
      - name: Run two tabs test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-two-tabs-test.mjs

      # 둘이 같은 상자를 동시에 비벼도 개수는 보존된다 (TASK-WM-332) — 복제는 경제를 죽인다.
      - name: Run chest race test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-chest-race-test.mjs

      # 못 읽는 기억을 만나면 안 뜬다 — 빈 세계로 떠서 원본을 덮지 않는다 (TASK-WM-333).
      - name: Run broken memory test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-broken-memory-test.mjs

      # 좁혀진 창에도 소식이 가나 (TASK-WM-342) — 백프레셔가 만든 사각지대를 정면으로 잰다.
      - name: Run narrowed news test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-narrowed-news-test.mjs

      # 유령을 잡는 <b>덫</b>이 살아 있나 (TASK-WM-329) — 창이 「내가 누굴 그리나」를 묻고
      # 세계가 「그건 없다」고 답하는 길. 유령 자체는 재현이 안 되므로 덫을 시험한다.
      - name: Run ghost trap test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-ghost-trap-test.mjs

      # 나간 사람이 화면에 유령으로 안 남는다 (TASK-WM-306).
      - name: Run ghost test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-ghost-test.mjs

      # 세계를 바꾸는 말은 모두 「한 번만」 문을 지난다 (TASK-WM-308) — 코드를 읽는 감사라 빠르다.
      - name: Run action-once audit
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-action-once-audit.mjs

      # 국경을 넘다 끊겨도 나로, 짐 그대로 도착한다 (TASK-WM-309).
      - name: Run border cut test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-border-cut-test.mjs

      # 「했다」고 답한 일은 세계가 갑자기 죽어도 남는다 (TASK-WM-310).
      - name: Run crash durability test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-crash-durability-test.mjs

      # 기억을 못 적으면 그 사실이 밖에서 보인다 (TASK-WM-311).
      - name: Run save failure test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-save-failure-test.mjs

      # 진짜 창 여럿이 동시에 들어와도 서로 보인다 (TASK-WM-312).
      - name: Run many windows test
        env:
          WM_PLAYWRIGHT_ROOT: /tmp/wm-playwright
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-web-many-windows-test.mjs

      # 여럿이 같은 순간에 국경을 넘어도 아무도 안 사라진다 (TASK-WM-318).
      - name: Run border stampede test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-border-stampede-test.mjs

      # 앞서 있는 저장 하늘을 세계가 되돌린다 (TASK-WM-320).
      - name: Run stale sky test
        run: node ./.github/scripts/run-gate.mjs ./.github/scripts/wm-stale-sky-test.mjs

  unity:
    name: EditMode tests (laptop runner)
    runs-on: [self-hosted, unity, windows-build]
    # ★ 지금은 <손으로 부를 때만> 돈다 (TASK-WM-286).
    #
    #   실측 2026-08-13: 노트북 러너는 <한 대>다. 그런데 이 잡은 라이선스가 LocalSystem 에서
    #   안 풀려(TASK-WM-221) 끝내 못 끝난다 — 그 한 대를 90분까지 물고 있는다.
    #   그동안 <서버 배포>가 그 뒤에 줄을 서다 취소된다: 최근 배포 30판 성공 0회.
    #   즉 이 잡 하나 때문에 <만든 것이 세계에 안 나가고> 있었다.
    #
    #   라이선스가 풀리면(WM-221) 이 줄을 지운다. 그 전까지는 손으로 부를 때만 돈다 —
    #   「안 도는 시험」이 「배포를 막는 시험」보다 낫다(안 도는 것은 아래 칸이 크게 적는다).
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    # 노트북 한 대 = 프로젝트 폴더 하나라 이 잡은 언제나 한 번에 하나만 돈다.
    #
    # ★ 한때 push·PR 을 통째로 막아 뒀었다. 이유는 실측이었다(2026-08-05): 빌드로 찬 러너에
    #   push 가 몇 분 간격으로 들어오자 EditMode 잡이 **5연속 취소**돼 실제 실행이 0회가 됐다.
    #   그런데 막아 버린 쪽의 대가가 더 컸다 — push 로 만든 실행은 시험 잡을 건너뛴 채 초록이
    #   되고, 깃허브는 건너뛴 잡이 있어도 실행을 success 라 부른다. **한 번도 안 돈 시험이
    #   「통과」로 보고됐다** (2026-08-07 발각).
    # ★ 진짜 원인은 push 레인이 아니라 「앞선 것을 죽인다」였다. 취소를 끄면 깃허브는 한 그룹에
    #   *도는 것 1 + 기다리는 것 1* 만 남기고 그 사이 것들만 지운다 — 즉 폭주해도 줄은 안 밀리고,
    #   마지막 push 는 반드시 돈다. 3시간 주기는 그대로 바닥으로 남긴다.
    # ★ 레인은 event 별로 가른다. 한 그룹으로 묶으면 push 가 몰릴 때 *기다리던 예약·수동 실행이
    #   대신 지워진다* — 취소를 꺼도 그렇다(깃허브는 한 그룹에 기다리는 것 하나만 남긴다).
    #   push 끼리는 최신만 의미 있으니 서로 밀어내도 되지만, 다른 레인까지 같이 죽으면 안 된다.
    concurrency:
      group: wm-quality-unity-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ clean 을 켜면 (기본값) 체크아웃이 추적 안 되는 파일을 지운다 = **Library 삭제**.
          #   이 러너는 빌드와 작업 폴더를 공유하므로, 여기서 캐시를 날리면 빌드가 매번
          #   전체 임포트로 돌아가고(10~40분) 실제로 임포트 도중 크래시까지 났다(실측:
          #   같은 크래시 2회 연속, Library 사실상 0GB). 유니티 캐시는 지우면 안 되는 자산이다.
          clean: false

      - name: Resolve Unity editor
        id: unity
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-unity-resolve.ps1"
          $unity = Resolve-UnityEditor -InstallLogDir $env:RUNNER_TEMP
          "exe=$($unity.Exe)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "unity: $($unity.Version) -> $($unity.Exe)"

      - name: Run EditMode tests
        shell: powershell
        run: |
          $runner = $env:WM_MEMO_SCRIPTS
          if ([string]::IsNullOrWhiteSpace($runner))
          {
              $runner = 'C:\Users\masca\repos\karmoddrine\memo\dotfiles\scripts'
          }
          $smoke = Join-Path $runner 'wm-editmode-smoke.ps1'
          if (-not (Test-Path $smoke))
          {
              Write-Host "ERROR: EditMode runner not found: $smoke"
              Write-Host "  the memo checkout is the canonical home of the runtime gates."
              Write-Host "  set WM_MEMO_SCRIPTS on the runner if it lives elsewhere."
              exit 1
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $smoke `
              -Project $env:GITHUB_WORKSPACE `
              -EditorExe '${{ steps.unity.outputs.exe }}' `
              -TimeoutSec 3600
          $code = $LASTEXITCODE

          # exit 2 = cannot-run (project locked / editor missing / 0 tests). Silence is
          # the failure mode we are removing, so a gate that could not run is a red gate.
          if ($code -eq 2)
          {
              Write-Host "ERROR: EditMode gate could not run (exit 2) -- treating as failure."
              exit 1
          }
          exit $code
