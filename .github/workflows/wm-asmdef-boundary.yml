name: WM asmdef boundary gate

# 정본: memo/dotfiles/workflows/wm-asmdef-boundary.yml (sync-workflows.ps1 로 배포).
# 본 파일 직접 편집 X — 정본에서 편집 후 `powershell -File memo/dotfiles/sync-workflows.ps1 -Apply`.
#
# TASK-WM-104 Phase C → TASK-WM-184 — 6 동기 「분리」 전면 단방향 경계 게이트.
# DomainSDK(Foundation)·Mods(샌드박스)·Core·Domain·ViewModel 가 상위/동위 game
# layer 또는 FishNet 을 (asmdef references / .cs using / reflection 어느 쪽으로도)
# 침범하면 fail. asmdef 단방향 = 6 동기 분리 first-use baseline 의 machine-checkable
# contract. Claude LLM 스캔(claude-quality-loop.yml)과 별 seam — 이건 *결정적*
# (jq + grep, Unity 무관, ~수초) push/PR 게이트. (회귀 0 baseline = asmdef 실값 대조 2026-06-07.)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/_WitchMendokusai/Core/**'
      - 'Assets/_WitchMendokusai/Domain/**'
      - 'Assets/_WitchMendokusai/DomainSDK/**'
      - 'Assets/_WitchMendokusai/Mods/**'
      - 'Assets/_WitchMendokusai/Network/**'
      - 'Portable/**'
      - '.github/workflows/wm-asmdef-boundary.yml'
  pull_request:
    paths:
      - 'Assets/_WitchMendokusai/Core/**'
      - 'Assets/_WitchMendokusai/Domain/**'
      - 'Assets/_WitchMendokusai/DomainSDK/**'
      - 'Assets/_WitchMendokusai/Mods/**'
      - 'Assets/_WitchMendokusai/Network/**'
      - 'Portable/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wm-asmdef-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ROOT: 'Assets/_WitchMendokusai'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate — asmdef 단방향 경계 (전면)
        run: |
          set -euo pipefail
          FAIL=0

          # ── 단방향 forbidden-edge 표 — asmdef "name" → 금지 참조 어셈블리(공백 구분) ──
          #   현 clean 그래프(회귀 0 baseline)를 잠근다. 새 layer asmdef = 본 표에 추가해야 커버됨.
          #   DomainSDK(Foundation)·Mods(샌드박스) = game layer + FishNet 전부 금지
          #     ([UniTask,MessagePipe] · [DomainSDK] 만 허용)
          #   Core·ViewModel = 상위 Domain·Network·FishNet 금지
          #   Domain = Network·FishNet 금지 (NetCode 결합은 WM.Network 에만)
          forbidden_for() {
            case "$1" in
              WitchMendokusai.DomainSDK*) echo "WM.Core WM.Domain WM.Network WM.ViewModel WM.Editor FishNet.Runtime" ;;
              WitchMendokusai.Mods*)      echo "WM.Core WM.Domain WM.Network WM.ViewModel WM.Editor FishNet.Runtime" ;;
              WM.Core)                    echo "WM.Domain WM.Network FishNet.Runtime" ;;
              WM.ViewModel)               echo "WM.Domain WM.Network FishNet.Runtime" ;;
              WM.Domain)                  echo "WM.Network FishNet.Runtime" ;;
              *)                          echo "" ;;
            esac
          }

          # ── 1) asmdef references 단방향 = 컴파일 경계 1차 contract (jq) ────────────
          #    (현 전부 name 기반 참조. GUID 참조 전환 시 prong 2 가 FishNet 백스톱.)
          while IFS= read -r -d '' asmdef; do
            name=$(jq -r '.name // empty' "$asmdef")
            [ -z "$name" ] && continue
            forbidden=$(forbidden_for "$name")
            [ -z "$forbidden" ] && continue
            refs=$(jq -r '.references[]? // empty' "$asmdef")
            for bad in $forbidden; do
              if printf '%s\n' "$refs" | grep -qxF "$bad"; then
                echo "::error file=$asmdef::[$name] asmdef references 에 금지 어셈블리 '$bad' — 단방향 경계 위반 (6 동기 분리)."
                FAIL=1
              fi
            done
          done < <(find "$ROOT" -name '*.asmdef' -print0)

          # ── 0-후) 「대상이 0개면 통과」 금지 ─────────────────────────────────────
          #    ★ 왜 (2026-08-06 실측): 아래 검사들은 전부 `grep ... 2>/dev/null || true` 다.
          #    비었을 때 통과하는 건 맞다 — **위반이 없어서** 비는 경우엔.
          #    그런데 `$ROOT` 가 틀리면 grep 은 대상이 없어 에러를 내고, `2>/dev/null` 이 그걸 삼키고,
          #    `|| true` 가 exit 를 지우고, 결과는 똑같이 빈 문자열이다 → **「전면 clean」 이라고 찍는다.**
          #    즉 경로가 깨지는 순간 이 게이트는 초록불로 눈이 먼다. 오늘 그 실패 모양을 실제로 봤다
          #    (memo 도구 6개가 폴더명 오타로 내내 조용히 실패 — automation-debt-ledger 참조).
          #    `Assets/_WitchMendokusai` 는 TASK-WM-056-D(폴더 재구조, 진행중)가 건드릴 수 있는 경로다.
          #    그래서 **찾은 게 0개면 통과가 아니라 실패**로 둔다. 셈은 위 루프와 같은 find 를 쓴다.
          ASMDEF_COUNT=$(find "$ROOT" -name '*.asmdef' 2>/dev/null | wc -l)
          if [ ! -d "$ROOT" ] || [ "$ASMDEF_COUNT" -eq 0 ]; then
            echo "::error::검사 대상이 0개다 (ROOT='$ROOT', asmdef=$ASMDEF_COUNT)."
            echo "::error::  위반이 없는 게 아니라 **아무것도 안 본 것**이다 — 경로가 옮겨졌는지 확인할 것."
            echo "::error::  정본 경로 수정 = memo/dotfiles/workflows/wm-asmdef-boundary.yml 의 env.ROOT"
            exit 1
          fi
          echo "검사 대상 asmdef ${ASMDEF_COUNT}개 (ROOT=$ROOT)"

          # ── 2) FishNet 소스 토큰 — Network 외 layer 의 NetCode 직접 결합 금지 ──────
          #    asmdef GUID 참조·using·reflection 어느 우회든 잡는 방어선.
          #    FishNet 네임스페이스는 고유 = false-positive 0.
          NETFREE="$ROOT/Core $ROOT/Domain $ROOT/DomainSDK $ROOT/Mods"
          FN=$(grep -rnE '(^|[^A-Za-z_.])(using[[:space:]]+FishNet|FishNet\.)' \
            $NETFREE --include='*.cs' 2>/dev/null || true)
          if [ -n "$FN" ]; then
            echo "::error::Network 외 layer .cs 가 FishNet 직접 참조 (NetCode 결합은 WM.Network 에만):"
            echo "$FN"
            FAIL=1
          fi

          # ── 3) DomainSDK·Mods reflection 크로스레이어 escape — Foundation/샌드박스 순수성 ──
          #    정당한 reflection 은 줄 끝 `// modding-reflection-ok` 로 면제.
          RF=$(grep -rnE '(Assembly\.Load|Assembly\.GetType|Type\.GetType|AppDomain\.)' \
            "$ROOT/DomainSDK" "$ROOT/Mods" --include='*.cs' 2>/dev/null \
            | grep -v 'modding-reflection-ok' || true)
          if [ -n "$RF" ]; then
            echo "::error::DomainSDK/Mods reflection 크로스레이어 escape 의심 (정당 시 // modding-reflection-ok):"
            echo "$RF"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::asmdef 단방향 경계 게이트 FAIL — 6 동기 「분리」 first-use 회귀 (TASK-WM-104/184)."
            exit 1
          fi
          echo "asmdef 단방향 경계 OK — DomainSDK/Mods/Core/Domain/ViewModel 전면 clean."

  # ── DomainSDK 가 엔진 없이 서는가 (TASK-WM-214) ────────────────────────────────
  #   경계의 마지막 칸. asmdef 참조·using·reflection 을 다 통과해도, 판정 코드가
  #   UnityEngine 타입을 쓰고 있으면 그건 여전히 "Unity 안에서만 도는 게임" 이다.
  #   웹 클라가 같은 서버로 같은 게임을 하려면 시뮬이 Unity 프로세스 밖에서 돌아야 한다.
  #   grep 이 아니라 **실제로 굽는다** — 통과 = 그 순간의 SDK 는 헤드리스로 옮길 수 있다.
  portable:
    name: DomainSDK 엔진 밖 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 검사 대상이 실재하나 (0개면 통과 아니라 실패)
        run: |
          set -euo pipefail
          PROJ='Portable/DomainSDK.Portable.csproj'
          if [ ! -f "$PROJ" ]; then
            echo "::error::$PROJ 가 없다. 게이트가 통과한 게 아니라 **아무것도 안 본 것**이다."
            echo "::error::  (한 번 실제로 났던 사고: 루트 .gitignore 의 *.csproj 에 걸려 저장소에 안 들어가 있었다.)"
            exit 1
          fi
          COUNT=$(find Assets/_WitchMendokusai/DomainSDK -name '*.cs' | wc -l)
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::DomainSDK .cs 가 ${COUNT}개뿐이다 — 경로가 옮겨졌는지 확인할 것."
            exit 1
          fi
          echo "DomainSDK .cs ${COUNT}개를 엔진 밖에서 굽는다."

      - name: Build — Unity 없이 컴파일
        run: |
          set -euo pipefail
          dotnet build Portable/DomainSDK.Portable.csproj -c Release --nologo -warnaserror
          echo "엔진 밖 빌드 OK — 이 커밋의 DomainSDK 는 Unity 프로세스 밖에서 돈다."
