name: Build (Windows / laptop)

# TASK-WM-195 — 노트북 빌드머신.
# 데스크톱에서 빌드를 돌리면 작업이 막히고 성능을 다 먹으므로, 플레이어 빌드는
# 노트북 self-hosted runner 에서 돈다.
#
# runner = `karmo-laptop-wm` (labels: self-hosted, unity, windows-build).
#   노트북의 masca *사용자 세션* 에서 Scheduled Task `wm-build-runner` 로 상시 구동.
#   ★ LocalSystem 서비스로 돌리면 안 된다 — Unity 라이선스는 붙지만 Package Manager
#     IPC 가 session-0 에서 죽어서(`Failed to start the Unity Package Manager local
#     server process`) 배치 빌드가 종료코드 1 로 실패한다. 실측 확인함.
#
# 산출물은 기본적으로 *노트북에 남는다* (C:\wm-builds\<run>\). 수 GB 짜리 zip 을 매번
# 가정용 회선으로 GitHub 에 올리는 건 낭비라, 업로드는 publish 입력으로 명시할 때만.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '대상 플랫폼 (android = 폰 설치용 APK, 유니티 디버그 키로 서명)'
        type: choice
        options: [windows, android]
        default: windows
      build_type:
        description: '빌드 종류'
        type: choice
        options: [release, development]
        default: release
      publish:
        description: '산출물 처리 (none=노트북에만 / artifact=GitHub Actions 아티팩트 업로드)'
        type: choice
        options: [none, artifact]
        default: none
      version:
        description: 'bundleVersion 덮어쓰기 (비우면 ProjectSettings 값 유지)'
        type: string
        default: ''
      cancel_running:
        description: '진행 중인 빌드를 취소하고 시작 (끄면 줄 서서 기다린다)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  # 그룹은 하나여야 한다 — 노트북 한 대에서 같은 프로젝트 폴더를 쓰므로 두 빌드가
  # 동시에 돌면 Library 를 서로 뺏는다.
  group: wm-build
  # 기본은 줄서기. 「내가 방금 건 게 더 급하다」일 때만 사람이 체크해서 앞의 것을
  # 끊는다 — 자동으로 끊게 두면 오래 돌던 릴리스 빌드가 말없이 날아갈 수 있다.
  cancel-in-progress: ${{ inputs.cancel_running == true }}

jobs:
  build:
    runs-on: [self-hosted, unity, windows-build]
    timeout-minutes: 240

    env:
      BUILD_ROOT: 'C:\wm-builds'

    steps:
      - name: Checkout (Library 캐시 보존 — clean:false)
        uses: actions/checkout@v6
        with:
          # Library/ 를 지우면 매 빌드가 전체 임포트(수십 분)로 돌아간다. 반드시 false.
          clean: false
          fetch-depth: 1

      # The editor version + changeset come from ProjectVersion.txt; if that editor is
      # missing on the laptop the script installs it headlessly (a build machine that
      # needs a human every time the editor is bumped is not a build machine).
      - name: Resolve Unity editor (auto-install when missing)
        id: unity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-unity-resolve.ps1"
          $unity = Resolve-UnityEditor -Platform '${{ inputs.platform }}' -InstallLogDir $env:RUNNER_TEMP
          "version=$($unity.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$($unity.Exe)"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build player (batchmode)
        id: build
        shell: powershell
        # ASCII only in run: blocks. Actions writes them to a BOM-less temp .ps1 and
        # PS 5.1 decodes as cp949 - Korean corrupts and can break parsing outright
        # (run #12: one Korean word killed the notify step after a successful build).
        # Korean text lives in the BOM-ed repo script .github/scripts/wm-build-card.ps1.
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"

          $platform = '${{ inputs.platform }}'
          if ([string]::IsNullOrWhiteSpace($platform)) { $platform = 'windows' }
          $buildType = '${{ inputs.build_type }}'
          if ([string]::IsNullOrWhiteSpace($buildType)) { $buildType = 'release' }
          $version = '${{ inputs.version }}'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          $commit = '${{ github.sha }}'.Substring(0, 8)

          $result = Invoke-WmBuild `
            -UnityExe '${{ steps.unity.outputs.exe }}' `
            -Platform $platform -BuildType $buildType -Version $version `
            -BuildRoot $env:BUILD_ROOT -ProjectPath $PWD.Path `
            -RunNumber $env:GITHUB_RUN_NUMBER -Commit $commit `
            -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          "out_dir=$($result.OutDir)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "report=$($result.Report)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "unity_log=$($result.UnityLog)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($result.CardId) { "card_id=$($result.CardId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }

          Write-Host "Unity exit=$($result.ExitCode)"
          if (Test-Path $result.Report) { Get-Content $result.Report | Write-Host }
          if ($result.ExitCode -ne 0) {
            if (Test-Path $result.UnityLog) { Get-Content $result.UnityLog -Tail 120 | Write-Host }
            throw "Unity build failed (exit=$($result.ExitCode)). log: $($result.UnityLog)"
          }

      # Cancelling kills only the step shell; Unity started via Start-Process
      # survives holding the Library lock and blocks the next build.
      - name: Kill leftover Unity (on cancel or failure)
        if: cancelled() || failure()
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Stop-LeftoverUnity -Workspace $env:GITHUB_WORKSPACE
      - name: Summarize
        if: always()
        shell: powershell
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Write-BuildSummary `
            -Report '${{ steps.build.outputs.report }}' `
            -UnityLog '${{ steps.build.outputs.unity_log }}' `
            -SummaryFile $env:GITHUB_STEP_SUMMARY
      - name: Zip
        if: ${{ success() && (inputs.publish == 'artifact' || github.ref_type == 'tag') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = '${{ steps.build.outputs.out_dir }}'
          $zip = Join-Path $outDir 'WitchMendokusai-windows.zip'
          Compress-Archive -Path (Join-Path $outDir '*') -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "zip → $zip ($([Math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
        id: zip

      - name: Upload artifact
        if: ${{ success() && inputs.publish == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: WitchMendokusai-windows-${{ github.run_number }}
          path: ${{ steps.zip.outputs.zip }}
          retention-days: 14

      # tag 로 찍은 릴리스는 바이너리가 붙어야 릴리스다. release.yml 이 만든 Release 에 zip 첨부.
      - name: Attach zip to GitHub Release (tag 빌드)
        if: ${{ success() && github.ref_type == 'tag' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = '${{ steps.zip.outputs.zip }}'
          $asset = "WitchMendokusai-${{ github.ref_name }}-windows.zip"
          Copy-Item $zip (Join-Path (Split-Path $zip) $asset) -Force
          gh release upload '${{ github.ref_name }}' (Join-Path (Split-Path $zip) $asset) --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed (exit=$LASTEXITCODE)" }

      # ASCII only here (see Build player step). All Korean card text lives in
      # .github/scripts/wm-build-card.ps1, which keeps a UTF-8 BOM.
      - name: Notify Discord (via laptop-ops)
        if: always()
        shell: powershell
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Publish-BuildResult `
            -Status '${{ job.status }}' `
            -Platform '${{ inputs.platform }}' -BuildType '${{ inputs.build_type }}' `
            -OutDir '${{ steps.build.outputs.out_dir }}' `
            -Report '${{ steps.build.outputs.report }}' `
            -UnityLog '${{ steps.build.outputs.unity_log }}' `
            -CardId '${{ steps.build.outputs.card_id }}' `
            -Commit '${{ github.sha }}'.Substring(0, 8) `
            -RefName '${{ github.ref_name }}' `
            -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
            -RunNumber '${{ github.run_number }}' `
            -BuildRoot $env:BUILD_ROOT
      - name: Prune old builds (최근 5개만 보관)
        if: always()
        shell: powershell
        run: |
          $keep = 5
          $dirs = Get-ChildItem $env:BUILD_ROOT -Directory -ErrorAction SilentlyContinue | Sort-Object CreationTime -Descending
          if ($dirs.Count -gt $keep) {
            $dirs | Select-Object -Skip $keep | ForEach-Object {
              Write-Host "prune $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
