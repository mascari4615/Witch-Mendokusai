name: Build (Unity player / laptop)

# TASK-WM-195 — 노트북 빌드머신.
# 데스크톱에서 빌드를 돌리면 작업이 막히고 성능을 다 먹으므로, 플레이어 빌드는
# 노트북 self-hosted runner 에서 돈다.
#
# runner = `karmo-laptop-wm` (labels: self-hosted, unity, windows-build).
#   노트북의 masca *사용자 세션* 에서 Scheduled Task `wm-build-runner` 로 상시 구동.
#   ★ LocalSystem 서비스로 돌리면 안 된다 — Unity 라이선스는 붙지만 Package Manager
#     IPC 가 session-0 에서 죽어서(`Failed to start the Unity Package Manager local
#     server process`) 배치 빌드가 종료코드 1 로 실패한다. 실측 확인함.
#
# 산출물은 기본적으로 *노트북에 남는다* (C:\wm-builds\<run>\). 수 GB 짜리 zip 을 매번
# 가정용 회선으로 GitHub 에 올리는 건 낭비라, 업로드는 publish 입력으로 명시할 때만.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '대상 플랫폼 (android = 폰 설치용 APK, 유니티 디버그 키로 서명)'
        type: choice
        options: [windows, android]
        default: windows
      build_type:
        description: '빌드 종류'
        type: choice
        options: [release, development]
        default: release
      publish:
        description: '산출물 처리 (none=노트북에만 / artifact=GitHub Actions 아티팩트 업로드)'
        type: choice
        options: [none, artifact]
        default: none
      version:
        description: 'bundleVersion 덮어쓰기 (비우면 ProjectSettings 값 유지)'
        type: string
        default: ''
      cancel_running:
        description: '진행 중인 빌드를 취소하고 시작 (끄면 줄 서서 기다린다)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'
  # 밤에 알아서 굽는다. 정각을 피한 건 전 세계 크론이 몰리는 시각이라서.
  #   03:23 KST (18:23 UTC) = 안드로이드 — 아침에 폰으로 바로 설치할 수 있게.
  #   05:23 KST (20:23 UTC) = 윈도우  — **런타임 게이트의 재료**.
  #
  # ★ 왜 둘인가 (실측 2026-08-06): 런타임 스모크(부팅·2인 접속)는 「최근 26시간 안의 윈도우
  #   빌드」를 실행해야 도는데, 야간 빌드는 안드로이드만 구웠다. 즉 사람이 손으로 윈도우
  #   빌드를 걸지 않으면 그 게이트는 **하루가 지나는 순간 반드시 빨개진다** — 그것도
  #   「야간 빌드가 안 나온다」는 엉뚱한 메시지로. 게이트가 스스로 재료를 못 얻는 구조였다.
  #   노트북은 그 시간대에 놀고 있고, 바뀐 게 없으면 아래 게이트가 건너뛴다.
  schedule:
    - cron: '23 18 * * *'
    - cron: '23 20 * * *'

concurrency:
  # 그룹은 하나여야 한다 — 노트북 한 대에서 같은 프로젝트 폴더를 쓰므로 두 빌드가
  # 동시에 돌면 Library 를 서로 뺏는다.
  group: wm-build
  # 기본은 줄서기. 「내가 방금 건 게 더 급하다」일 때만 사람이 체크해서 앞의 것을
  # 끊는다 — 자동으로 끊게 두면 오래 돌던 릴리스 빌드가 말없이 날아갈 수 있다.
  cancel-in-progress: ${{ inputs.cancel_running == true }}

jobs:
  build:
    # This repo's default workflow token is read-only, and the tag path ends with
    # `gh release upload`. Without this the release attach 403s *after* a 40-minute
    # build - the one place a permission mistake costs the most. contents:write is
    # the narrowest grant that covers it (job level is the finest granularity).
    permissions:
      contents: write
    runs-on: [self-hosted, unity, windows-build]
    timeout-minutes: 240

    env:
      BUILD_ROOT: 'C:\wm-builds'
      # TASK-WM-201 — 폰이 실행 로그를 서버로 밀어 넣을 때 쓰는 전용 토큰.
      # 빌드 직전 콜백(WMDeviceLogTokenBuildStep)이 이 값을 읽어 APK 안에만 심고 빌드 후 지운다
      # (공개 저장소라 커밋 불가). 같은 값이 github.io secret DEVICE_LOG_TOKEN 에도 있어야
      # 서버가 받아준다 — 한쪽만 바꾸면 폰 화면에 "막힘 401" 이 뜬다. 비면 빌드는 정상, 로그만 차단.
      WM_DEVICE_LOG_TOKEN: ${{ secrets.WM_DEVICE_LOG_TOKEN }}

    steps:
      - name: Checkout (Library 캐시 보존 — clean:false)
        uses: actions/checkout@v6
        with:
          # Library/ 를 지우면 매 빌드가 전체 임포트(수십 분)로 돌아간다. 반드시 false.
          clean: false
          fetch-depth: 1

      # schedule/tag runs arrive with every input empty. Decide what we are building
      # ONCE here; every later step reads this instead of re-guessing (the editor step
      # used to guess nothing at all and so never checked the Android module).
      - name: Resolve effective platform / build type
        id: cfg
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          # Two nightly crons: the late one exists to feed the runtime gates, which need a
          # WINDOWS player. Decide it here (from which cron fired) instead of teaching the
          # shared helper about schedules - the helper only knows "schedule = android".
          $platform = '${{ inputs.platform }}'
          if ('${{ github.event_name }}' -eq 'schedule' -and '${{ github.event.schedule }}' -eq '23 20 * * *') {
            $platform = 'windows'
          }
          $cfg = Get-EffectiveBuildConfig -Platform $platform `
            -BuildType '${{ inputs.build_type }}' -EventName '${{ github.event_name }}'
          "platform=$($cfg.Platform)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_type=$($cfg.BuildType)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "effective: platform=$($cfg.Platform) buildType=$($cfg.BuildType) event=${{ github.event_name }}"

      # The editor version + changeset come from ProjectVersion.txt; if that editor is
      # missing on the laptop the script installs it headlessly (a build machine that
      # needs a human every time the editor is bumped is not a build machine).
      - name: Resolve Unity editor (auto-install when missing)
        id: unity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-unity-resolve.ps1"
          $unity = Resolve-UnityEditor -Platform '${{ steps.cfg.outputs.platform }}' -InstallLogDir $env:RUNNER_TEMP
          "version=$($unity.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$($unity.Exe)"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      # Nightly builds the same commit twice would burn 40 minutes and 3GB for nothing,
      # so compare against the last built sha and stop early when unchanged.
      - name: Nightly gate (skip when nothing changed)
        id: gate
        if: github.event_name == 'schedule'
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          $needed = Test-BuildNeeded -BuildRoot $env:BUILD_ROOT -Platform '${{ steps.cfg.outputs.platform }}' -Sha $env:GITHUB_SHA
          if (-not $needed) { "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      # TASK-WM-201 — 진단 자산은 *유니티 실행 전에* 써 둔다.
      # 빌드 도중 에셋을 심고 임포트하면 안드로이드 빌드가 네이티브로 죽는다(4연속 실측,
      # 끄자마자 성공). 여기서 미리 써 두면 평범한 시작 임포트로 들어가고 빌드는 무변형.
      - name: Seed diagnostics assets (build info + device-log token)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'Assets/_WitchMendokusai/Core/Resources'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $kst = [DateTime]::UtcNow.AddHours(9).ToString('yyyy-MM-dd HH:mm')
          $branch = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '' }
          $channel = if ('${{ steps.cfg.outputs.build_type }}' -eq 'development') { 'dev' } else { 'release' }
          $info = [ordered]@{
            commit       = $env:GITHUB_SHA
            branch       = $branch
            buildNumber  = [int]$env:GITHUB_RUN_NUMBER
            builtAtKst   = $kst
            channel      = $channel
            platform     = '${{ steps.cfg.outputs.platform }}'
            unityVersion = '${{ steps.unity.outputs.version }}'
            runUrl       = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            dirty        = $false
          }
          $json = $info | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $dir 'BuildInfo.json'), $json, [Text.UTF8Encoding]::new($false))
          Write-Host "[WM-BUILD] seeded BuildInfo.json ($channel #$($info.buildNumber))"

          if ($env:WM_DEVICE_LOG_TOKEN) {
            [IO.File]::WriteAllText((Join-Path $dir 'DeviceLogToken.txt'), $env:WM_DEVICE_LOG_TOKEN.Trim(), [Text.UTF8Encoding]::new($false))
            Write-Host '[WM-BUILD] seeded DeviceLogToken.txt'
          } else {
            Write-Host '[WM-BUILD] WM_DEVICE_LOG_TOKEN empty - phone logs will be rejected (401)'
          }

      # 2026-08-16: 빌드가 간헐적으로 죽는데(exit -1073741819 = Access Violation) 크래시 스택이
      #   MemoryManager::Allocate -> malloc_internal -> BeginPlayerBuilding 이었다. 메모리 고갈로
      #   보이지만 크래시 시점의 커밋을 안 재고 있어서 단정할 수 없었다.
      #   재지 않고 고치면 "고쳤다고 믿는데 또 죽는" 상태가 된다 - 그래서 먼저 잰다.
      #   ASCII only in run: blocks (PS 5.1 cp949 - 위 주석 참조).
      - name: Memory before build
        if: steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $ramTotal = [Math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $ramFree  = [Math]::Round($os.FreePhysicalMemory / 1MB, 1)
          $comTotal = [Math]::Round($os.TotalVirtualMemorySize / 1MB, 1)
          $comFree  = [Math]::Round($os.FreeVirtualMemory / 1MB, 1)
          Write-Host "[MEM-BEFORE] ram ${ramFree}/${ramTotal} GB free | commit ${comFree}/${comTotal} GB free"
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            Write-Host "[MEM-BEFORE] pagefile allocated $($_.AllocatedBaseSize) MB peak $($_.PeakUsage) MB"
          }
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 5 | ForEach-Object {
            Write-Host ("[MEM-BEFORE] {0,-24} {1,7:N0} MB" -f $_.ProcessName, ($_.WorkingSet64 / 1MB))
          }

      - name: Build player (batchmode)
        id: build
        if: steps.gate.outputs.skip != 'true'
        shell: powershell
        # ASCII only in run: blocks. Actions writes them to a BOM-less temp .ps1 and
        # PS 5.1 decodes as cp949 - Korean corrupts and can break parsing outright
        # (run #12: one Korean word killed the notify step after a successful build).
        # Korean text lives in the BOM-ed repo script .github/scripts/wm-build-card.ps1.
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"

          # Decided once in the cfg step - do not re-derive here.
          $platform = '${{ steps.cfg.outputs.platform }}'
          $buildType = '${{ steps.cfg.outputs.build_type }}'
          $version = '${{ inputs.version }}'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          $commit = '${{ github.sha }}'.Substring(0, 8)

          $result = Invoke-WmBuild `
            -UnityExe '${{ steps.unity.outputs.exe }}' `
            -Platform $platform -BuildType $buildType -Version $version `
            -BuildRoot $env:BUILD_ROOT -ProjectPath $PWD.Path `
            -RunNumber $env:GITHUB_RUN_NUMBER -Commit $commit `
            -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          "out_dir=$($result.OutDir)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "report=$($result.Report)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "unity_log=$($result.UnityLog)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # card_id is written the moment the card is created (inside Invoke-WmBuild),
          # so a cancelled build still hands the notify step a usable handle.

          Write-Host "Unity exit=$($result.ExitCode)"
          if (Test-Path $result.Report) { Get-Content $result.Report | Write-Host }
          if ($result.ExitCode -ne 0) {
            if (Test-Path $result.UnityLog) { Get-Content $result.UnityLog -Tail 120 | Write-Host }
            throw "Unity build failed (exit=$($result.ExitCode)). log: $($result.UnityLog)"
          }
          Save-BuiltMarker -BuildRoot $env:BUILD_ROOT -Platform $platform -Sha $env:GITHUB_SHA

      # 실패했을 때가 진짜 증거다 - 성공 판에서는 안 보이는 값이 여기 남는다.
      - name: Memory after build (evidence on failure)
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $ramTotal = [Math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $ramFree  = [Math]::Round($os.FreePhysicalMemory / 1MB, 1)
          $comTotal = [Math]::Round($os.TotalVirtualMemorySize / 1MB, 1)
          $comFree  = [Math]::Round($os.FreeVirtualMemory / 1MB, 1)
          Write-Host "[MEM-AFTER] ram ${ramFree}/${ramTotal} GB free | commit ${comFree}/${comTotal} GB free"
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            Write-Host "[MEM-AFTER] pagefile allocated $($_.AllocatedBaseSize) MB peak $($_.PeakUsage) MB"
          }
          $crashRoot = Join-Path $env:WINDIR 'TEMP\Unity\Editor\Crashes'
          if (Test-Path $crashRoot) {
            $newest = Get-ChildItem $crashRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($newest -and ((Get-Date) - $newest.LastWriteTime).TotalMinutes -lt 60) {
              Write-Host "[MEM-AFTER] fresh crash report: $($newest.FullName)"
              $log = Join-Path $newest.FullName 'unity-build.log'
              if (Test-Path $log) {
                $stack = Select-String -Path $log -Pattern 'OUTPUTTING STACK TRACE' | Select-Object -First 1
                if ($stack) {
                  Write-Host '[MEM-AFTER] crash stack:'
                  Get-Content $log | Select-Object -Skip $stack.LineNumber -First 12 | ForEach-Object { Write-Host "  $_" }
                }
              }
            }
          }

      # Cancelling kills only the step shell; Unity started via Start-Process
      # survives holding the Library lock and blocks the next build.
      - name: Kill leftover Unity (on cancel or failure)
        if: cancelled() || failure()
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Stop-LeftoverUnity -Workspace $env:GITHUB_WORKSPACE
      - name: Summarize
        if: always()
        shell: powershell
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Write-BuildSummary `
            -Report '${{ steps.build.outputs.report }}' `
            -UnityLog '${{ steps.build.outputs.unity_log }}' `
            -SummaryFile $env:GITHUB_STEP_SUMMARY
      - name: Pick the deliverable
        if: ${{ success() && (inputs.publish == 'artifact' || github.ref_type == 'tag') }}
        shell: powershell
        # Android is DIFFERENT: the .apk IS the deliverable - a phone installs that file
        # directly. Zipping it would only make the phone unpack it first.
        # Windows ships a folder, so it has to be zipped. Use the repo helper, not
        # Compress-Archive: it reuses an existing zip, stages outside the build folder
        # and uses the fast level. Zipping twice under different names once left TWO
        # multi-GB archives in one folder (the PC build is ~2GB) and the dashboard then
        # picked whichever sorted first. One policy, one place.
        #
        # This step used to run the Windows path for BOTH platforms and threw
        # "no zip produced (no .exe in build output?)" on every android build that got
        # this far (measured 2026-08-06: a 55-minute android build died right here,
        # after the apk was already on disk). Earlier android runs never reached this
        # step - they were cancelled - so nothing surfaced it.
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          $outDir = '${{ steps.build.outputs.out_dir }}'
          if ('${{ steps.cfg.outputs.platform }}' -eq 'android') {
            $apk = Get-ChildItem -Path $outDir -Filter *.apk -File -ErrorAction SilentlyContinue |
                   Sort-Object Length -Descending | Select-Object -First 1
            if (-not $apk) { throw "no apk in build output ($outDir)" }
            $asset = $apk.FullName
          } else {
            $zipItem = Get-BuildZip -OutDir $outDir
            if (-not $zipItem) { throw "no zip produced (no .exe in build output?)" }
            $asset = $zipItem.FullName
          }
          "zip=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "deliverable -> $asset ($([Math]::Round((Get-Item $asset).Length / 1MB, 1)) MB)"
        id: zip

      - name: Upload artifact
        if: ${{ success() && inputs.publish == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: WitchMendokusai-${{ steps.cfg.outputs.platform }}-${{ github.run_number }}
          path: ${{ steps.zip.outputs.zip }}
          retention-days: 14

      # tag 로 찍은 릴리스는 바이너리가 붙어야 릴리스다. release.yml 이 만든 Release 에 zip 첨부.
      - name: Attach zip to GitHub Release (tag 빌드)
        if: ${{ success() && github.ref_type == 'tag' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = '${{ steps.zip.outputs.zip }}'
          # Keep the produced extension - android ships .apk, windows ships .zip.
          # Hardcoding .zip here would upload an apk named .zip: the phone refuses it.
          $ext = [IO.Path]::GetExtension($zip)
          $asset = "WitchMendokusai-${{ github.ref_name }}-${{ steps.cfg.outputs.platform }}$ext"
          Copy-Item $zip (Join-Path (Split-Path $zip) $asset) -Force
          gh release upload '${{ github.ref_name }}' (Join-Path (Split-Path $zip) $asset) --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed (exit=$LASTEXITCODE)" }

      # ASCII only here (see Build player step). All Korean card text lives in
      # .github/scripts/wm-build-card.ps1, which keeps a UTF-8 BOM.
      - name: Notify Discord (via laptop-ops)
        # Skipped nightlies have nothing to report - a card saying nothing is noise.
        if: always() && steps.gate.outputs.skip != 'true'
        shell: powershell
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          Publish-BuildResult `
            -Status '${{ job.status }}' `
            -Platform '${{ steps.cfg.outputs.platform }}' -BuildType '${{ steps.cfg.outputs.build_type }}' `
            -OutDir '${{ steps.build.outputs.out_dir }}' `
            -Report '${{ steps.build.outputs.report }}' `
            -UnityLog '${{ steps.build.outputs.unity_log }}' `
            -CardId '${{ steps.build.outputs.card_id }}' `
            -Commit '${{ github.sha }}'.Substring(0, 8) `
            -RefName '${{ github.ref_name }}' `
            -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
            -RunNumber '${{ github.run_number }}' `
            -BuildRoot $env:BUILD_ROOT
      - name: Prune old builds (최근 5개만 보관)
        if: always()
        shell: powershell
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          . "$env:GITHUB_WORKSPACE\.github\scripts\wm-build-card.ps1"
          # Keeps the pinned card's target no matter how old, and never lets empty
          # (cancelled/failed) folders eat the retention quota.
          Remove-OldBuilds -BuildRoot $env:BUILD_ROOT -Keep 5 `
            -CurrentOutDir '${{ steps.build.outputs.out_dir }}' | Out-Null
