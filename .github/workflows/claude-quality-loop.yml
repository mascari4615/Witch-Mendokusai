name: Claude Quality Loop (Scheduled)

# 정본: memo/dotfiles/workflows/claude-quality-loop.yml (sync-workflows.ps1 로 배포).
# 본 파일 직접 편집 X — 정본에서 편집 후 `powershell -File memo/dotfiles/sync-workflows.ps1 -Apply`.
#
# 정기 코드 품질 개선 루틴 — 사용자 컴퓨터 꺼져 있어도 GitHub Actions 서버에서 실행.
#
# 동작:
#   1. 매시 정각 (UTC) 실행 — push 없어도 프로액티브 스캔
#   2. Claude 가 .cs 코드베이스 3가지 작업 수행:
#      (A) 자동 fix 가능 위반 → Edit 즉시 수정 → WM commit
#      (B) 자동 fix 불가 위반 → _memo/wm/tasks/ 에 TASK 시드 생성 → memo commit
#      (C) STALE TASK status 감지 (WM git log 기반) → memo TASK frontmatter 갱신 → memo commit
#
# 무한 루프 가드:
#   - 마지막 WM commit 이 quality-loop bot → 전체 skip (변경 없으면 조용히 종료)
#
# push 시 실행되는 claude-audit.yml 과 역할 분리:
#   - claude-audit.yml: 새 commit 의 변경분만 (reactive)
#   - 본 워크플로우: 전체 코드베이스 proactive 스캔 (역사적 위반 포함)
#
# 필요 secrets:
#   - CLAUDE_CODE_OAUTH_TOKEN: Claude API 인증
#   - MEMO_GITHUB_PAT: memo 레포 write 권한 PAT
#     → GitHub: WM repo Settings → Secrets → Actions → MEMO_GITHUB_PAT
#     → PAT 권한: Contents (read+write) for Mascari4615/memo

on:
  schedule:
    - cron: '0 * * * *'  # 매시 정각 (UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-quality-loop
  cancel-in-progress: true  # 이전 루프 실행 중이면 새 것 우선

jobs:
  quality-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WitchMendokusai
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout memo
        uses: actions/checkout@v4
        with:
          repository: Mascari4615/memo
          path: _memo
          token: ${{ secrets.MEMO_GITHUB_PAT }}
          fetch-depth: 0

      - name: Loop guard — quality-loop commit 자기 재실행 방지
        id: guard
        run: |
          SUBJECT=$(git log -1 --format=%s)
          AUTHOR=$(git log -1 --format=%an)
          if [[ "$SUBJECT" == chore\(quality-loop\):* ]] && [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::quality-loop commit — loop guard skip"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Claude CLI
        if: steps.guard.outputs.skip != 'yes'
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.local
            /usr/local/lib/node_modules/@anthropic-ai
          key: claude-code-cli-${{ runner.os }}-v1

      - name: Install Claude CLI (cache miss only)
        if: steps.guard.outputs.skip != 'yes'
        run: |
          if ! command -v claude &> /dev/null; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "claude cached at $(which claude)"
            claude --version
          fi

      - name: Verify Claude auth
        if: steps.guard.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          claude --print "Reply with just OK." || {
            echo "Claude auth 실패"
            exit 1
          }

      - name: Claude scan + fix + seed + stale-sync
        if: steps.guard.outputs.skip != 'yes'
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT='# 임무: WitchMendokusai quality-loop — 스캔 + fix + TASK 시드 + STALE sync

          ## 환경
          - WM 레포 루트: 현재 작업 디렉토리 (Assets/_WitchMendokusai/ 포함)
          - memo 레포: _memo/ 서브디렉토리 (TASK 파일 위치: _memo/wm/tasks/)

          ## 작업 A — .cs 자동 fix
          스캔 범위:
          - 디렉토리: Assets/_WitchMendokusai/
          - 우선순위: 최근 30일 수정 .cs (git log --since="30 days ago" --name-only -- "Assets/_WitchMendokusai/**/*.cs" | sort -u)
          - 본 실행당 최대 10 파일 fix

          룰 정본: WitchMendokusai/CLAUDE.md (§ 코딩 스타일 / § 입력 처리 / § Editor 메뉴)
          본 프롬프트는 요약 — 정본 룰 우선.

          자동 fix 대상:
          1. var x = ... → 명시 타입
          2. if (!x) / while (!x) → if (x == false) / while (x == false)
          3. MenuItem("WitchMendokusai/...") → MenuItem("WM/...")
          4. 한 글자 변수명 (i, j 제외) → 의미 있는 풀네임
          5. const Type lowercaseName → const Type UPPER_SNAKE_CASE (호출처 모두 갱신)
          6. Allman 중괄호 위반 (중괄호 같은 줄) → 새 줄로 분리
          7. 이벤트/델리게이트 null 초기화 누락 → = delegate { } 추가

          원칙: 위반 외 코드 건드리지 마라 / 주석 추가 X / 면적 최소화

          SKIP 대상 (fix X, 작업 B 에서 시드화):
          - Keyboard.current / Mouse.current 직접 접근 (InputManager 외)
          - 수치 하드코딩 (SO/SerializeField 도입 필요)
          - FastFail 위반 (TryGet/null 체크로 증상 덮기)

          ## 작업 B — SKIP 위반 → TASK 시드화
          작업 A 스캔 중 SKIP 위반 발견 시 _memo/wm/tasks/ 에 TASK 시드 작성.

          중복 방지: _memo/wm/tasks/TASK-WM-*.md Grep → 같은 위반 패턴 + status=seed/ready 기존 TASK 있으면 하단 추가 위반 섹션에 append. 없으면 신규 파일.

          신규 TASK ID: ls _memo/wm/tasks/TASK-WM-*.md 최고 번호 +1

          신규 파일 (_memo/wm/tasks/TASK-WM-NNN-<kebab>.md) 형식:
          frontmatter: id/status(seed)/priority(low)/machine(local)/path([wm,quality])/tags([quality-loop,<위반종류>])
          ## 목표 섹션: quality-loop 자동 감지 — 위반 패턴 요약
          ## 위반 목록 섹션: 파일/라인/내용 표

          ## 작업 C — STALE TASK status 감지 + 갱신
          WM git log 탐색: git log --oneline -50
          각 TASK-WM-NNN 에 대해 _memo/wm/tasks/ 의 status 확인.
          status=seed/ready 이고 feat:/fix: 등 실질 구현 커밋 있으면 → status: done 으로 갱신.
          불확실하면 skip.

          ## 출력 마커 (응답 마지막 3줄 — 반드시 이 형식)
          CS_FIX_RESULT: APPLIED|CLEAN
          TASK_SEED_RESULT: SEEDED:<N>|NONE
          STALE_SYNC_RESULT: SYNCED:<N>|NONE

          시작.'

          set +e
          OUTPUT=$(claude --print --permission-mode bypassPermissions "$PROMPT" 2>&1)
          CLAUDE_EXIT=$?
          set -e

          echo "=== Claude output ==="
          echo "$OUTPUT"
          echo "=== /output ==="

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::warning::Claude CLI 호출 실패 (exit=$CLAUDE_EXIT) — 다음 루프 재시도"
            echo "cs_applied=no" >> "$GITHUB_OUTPUT"
            echo "memo_changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CS fix 결과 파싱
          if echo "$OUTPUT" | tail -5 | grep -q "CS_FIX_RESULT: APPLIED"; then
            if ! git diff --quiet; then
              git diff --stat > /tmp/wm_diff_stat.txt
              CS_COUNT=$(git diff --name-only | grep -c '\.cs$' || echo 0)
              echo "cs_applied=yes" >> "$GITHUB_OUTPUT"
              echo "cs_fixed=${CS_COUNT}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::CS_FIX_RESULT: APPLIED 이지만 실제 변경 없음 — 비정합"
              echo "cs_applied=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "cs_applied=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLEAN — CS 위반 없음 또는 모두 SKIP 영역"
          fi

          # memo 변경 감지 (신규 TASK 시드 or STALE 갱신)
          MEMO_DIRTY=$(git -C _memo status --porcelain 2>/dev/null | grep 'wm/tasks/TASK-WM-' || true)
          if [ -n "$MEMO_DIRTY" ]; then
            echo "memo_changed=yes" >> "$GITHUB_OUTPUT"
            SEED_N=$(echo "$OUTPUT" | grep -oE 'SEEDED:[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)
            SYNC_N=$(echo "$OUTPUT" | grep -oE 'SYNCED:[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)
            echo "seed_count=${SEED_N}" >> "$GITHUB_OUTPUT"
            echo "sync_count=${SYNC_N}" >> "$GITHUB_OUTPUT"
          else
            echo "memo_changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push WM (.cs fix)
        if: steps.guard.outputs.skip != 'yes' && steps.claude.outputs.cs_applied == 'yes'
        id: wm_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # .cs / .cs.meta 만 staging
          git add -A -- '*.cs' '*.cs.meta'

          # 비정합: Claude 가 .cs/.cs.meta 외 파일 만짐 → 거부
          EXTRA=$(git status --porcelain | grep -vE '^[AM]  .*\.(cs|cs\.meta)$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::warning::Claude 가 .cs/.cs.meta 외 파일 변경 시도:"
            echo "$EXTRA"
            git reset --hard HEAD
            echo "wm_pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CS_COUNT="${{ steps.claude.outputs.cs_fixed }}"
          DIFF_STAT=$(cat /tmp/wm_diff_stat.txt 2>/dev/null || echo "(없음)")

          git commit -m "chore(quality-loop): Claude scan+fix ${CS_COUNT} .cs

          Auto-fix by Claude scheduled quality-loop (proactive scan).
          룰 정본: WitchMendokusai/CLAUDE.md (스캔+수정 통합).

          diff stat:
          ${DIFF_STAT}

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PUSH_OK=no
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                PUSH_OK=yes
                echo "wm_pushed=yes" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              git rebase --abort
            fi
            echo "::warning::WM push attempt ${attempt} 실패 — retry"
            sleep 3
          done

          if [ "$PUSH_OK" = "no" ]; then
            echo "wm_pushed=no" >> "$GITHUB_OUTPUT"
            echo "::error::WM push 3회 실패"
          fi

      - name: Commit + push memo (TASK 시드 / STALE sync)
        if: steps.guard.outputs.skip != 'yes' && steps.claude.outputs.memo_changed == 'yes'
        id: memo_commit
        env:
          MEMO_GITHUB_PAT: ${{ secrets.MEMO_GITHUB_PAT }}
        run: |
          git -C _memo config user.name "github-actions[bot]"
          git -C _memo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # TASK-WM-*.md 만 staging
          git -C _memo add -- 'wm/tasks/TASK-WM-*.md'

          STAGED=$(git -C _memo status --porcelain | grep -E '^[AM]' || true)
          if [ -z "$STAGED" ]; then
            echo "::notice::memo: staging 후 변경 없음"
            echo "memo_pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SEED="${{ steps.claude.outputs.seed_count }}"
          SYNC="${{ steps.claude.outputs.sync_count }}"

          git -C _memo commit -m "chore(quality-loop): WM TASK 시드 ${SEED}개 + stale sync ${SYNC}개

          WitchMendokusai quality-loop 자동 생성/갱신.
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PUSH_OK=no
          for attempt in 1 2 3; do
            git -C _memo fetch origin main
            if git -C _memo rebase origin/main; then
              if git -C _memo push "https://x-access-token:${MEMO_GITHUB_PAT}@github.com/Mascari4615/memo.git" main; then
                PUSH_OK=yes
                echo "memo_pushed=yes" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              git -C _memo rebase --abort
            fi
            echo "::warning::memo push attempt ${attempt} 실패 — retry"
            sleep 3
          done

          if [ "$PUSH_OK" = "no" ]; then
            echo "memo_pushed=no" >> "$GITHUB_OUTPUT"
            echo "::error::memo push 3회 실패"
          fi

      - name: Discord 알림
        if: steps.guard.outputs.skip != 'yes' && (steps.wm_commit.outputs.wm_pushed == 'yes' || steps.memo_commit.outputs.memo_pushed == 'yes')
        run: |
          WM_PUSHED="${{ steps.wm_commit.outputs.wm_pushed }}"
          MEMO_PUSHED="${{ steps.memo_commit.outputs.memo_pushed }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HEAD_SHA=$(git rev-parse --short HEAD)

          # yawnbot webhook (WM repo secret YAWNBOT_WEBHOOK_URL 박히면 직접 호출)
          # 현재는 main push event 자체가 yawnbot 알림 자동 (TASK-WM-093 정합).
          echo "::notice::quality-loop 완료 — WM=${WM_PUSHED}, memo=${MEMO_PUSHED}, sha=${HEAD_SHA}"
