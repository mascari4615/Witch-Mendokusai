name: Claude Quality Loop (Scheduled)

# 정본: memo/dotfiles/workflows/claude-quality-loop.yml (sync-workflows.ps1 로 배포).
# 본 파일 직접 편집 X — 정본에서 편집 후 `powershell -File memo/dotfiles/sync-workflows.ps1 -Apply`.
#
# 정기 코드 품질 개선 루틴 — 사용자 컴퓨터 꺼져 있어도 GitHub Actions 서버에서 실행.
#
# 동작:
#   1. 매시 정각 (UTC) 실행 — push 없어도 프로액티브 스캔
#   2. Claude CLI 가 .cs 코드베이스 직접 스캔 (Grep/Read 도구) + 위반 발견 즉시 Edit 으로 수정
#   3. 변경 있으면 commit (chore(quality-loop):) + push to main
#   4. yawnbot Discord 알림 (변경 있는 경우만)
#
# 통합 설계 (이전 bash grep + Claude fix 2단계 → Claude 단일 단계):
#   - 룰 추가 시 본 워크플로우 수정 X — WitchMendokusai/CLAUDE.md / memo/rules/code-style.md 갱신만으로 반영
#   - Claude 컨텍스트 이해로 grep 으로 못 잡는 semantic 위반 (Allman / 델리게이트 초기화 / 안티패턴) 검출
#
# 무한 루프 가드:
#   - chore(quality-loop): commit 은 loop guard 로 skip
#   - 변경 없으면 조용히 종료 (알림 X)
#
# push 시 실행되는 claude-audit.yml 과 역할 분리:
#   - claude-audit.yml: 새 commit 의 변경분만 (reactive)
#   - 본 워크플로우: 전체 코드베이스 proactive 스캔 (역사적 위반 포함)

on:
  schedule:
    # cron 문법: 분 시 일 월 요일 (UTC 기준)
    #   '0 * * * *'    = 매시 정각 (1시간마다)
    #   '0 */2 * * *'  = 짝수 시각마다 (2시간마다)
    #   '*/30 * * * *' = 30분마다
    #   '0 18 * * *'   = 매일 UTC 18:00 (KST 03:00)
    - cron: '0 * * * *'  # 매시 정각
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-quality-loop
  cancel-in-progress: true  # 이전 루프 실행 중이면 새 것 우선

jobs:
  quality-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Loop guard — quality-loop commit 자기 재실행 방지
        id: guard
        run: |
          SUBJECT=$(git log -1 --format=%s)
          AUTHOR=$(git log -1 --format=%an)
          if [[ "$SUBJECT" == chore\(quality-loop\):* ]] && [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::quality-loop commit — loop guard skip"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Claude CLI
        if: steps.guard.outputs.skip != 'yes'
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.local
            /usr/local/lib/node_modules/@anthropic-ai
          key: claude-code-cli-${{ runner.os }}-v1

      - name: Install Claude CLI (cache miss only)
        if: steps.guard.outputs.skip != 'yes'
        run: |
          if ! command -v claude &> /dev/null; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "claude cached at $(which claude)"
            claude --version
          fi

      - name: Verify Claude auth
        if: steps.guard.outputs.skip != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          claude --print "Reply with just OK." || {
            echo "Claude auth 실패"
            exit 1
          }

      - name: Claude scan + auto-fix (통합)
        if: steps.guard.outputs.skip != 'yes'
        id: fix
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT='# 임무: WitchMendokusai 정기 quality-loop — 스캔 + 자동 수정 통합

          매시간 실행되는 자동 품질 루프. .cs 코드베이스를 Grep/Read 도구로 직접 스캔해서 룰 위반 찾고 Edit 도구로 즉시 수정.

          ## 스캔 범위

          - 디렉토리: `Assets/_WitchMendokusai/`
          - 우선순위: 최근 30일 수정된 .cs (`git log --since="30 days ago" --name-only -- "Assets/_WitchMendokusai/**/*.cs" | sort -u` 활용)
          - 본 실행 안 최대 10 파일까지만 fix — 더 큰 변경은 다음 hourly 루프에 위임

          ## 룰 출처

          정본: `WitchMendokusai/CLAUDE.md` (§ 코딩 스타일 / § 입력 처리 / § Editor 메뉴 / § 수치 노출 / § 에러 처리 FastFail).
          본 프롬프트는 *룰 요약* — 정본 룰이 우선. 룰 추가/변경되면 본 프롬프트 수정 없이 CLAUDE.md 만 갱신.

          ## 자동 fix 대상 (mechanical + 안전한 semantic)

          1. `var x = ...` → 명시 타입 `Type x = ...` (우변/사용처로 정확한 타입 추론)
          2. `if (!x)` / `while (!x)` → `if (x == false)` / `while (x == false)`
          3. `MenuItem("WitchMendokusai/...")` → `MenuItem("WM/...")`
          4. 한 글자 변수명 (i, j 외) → 의미 있는 풀네임
          5. `const Type lowercaseName` → `const Type UPPER_SNAKE_CASE` (호출처 모두 갱신)
          6. Allman 중괄호 위반 (중괄호 같은 줄) → 새 줄로 분리
          7. 이벤트/델리게이트 `null` 초기화 누락 → `= delegate { }` 추가

          ## SKIP 대상 (human 결정 필요 — 본 루프 fix X)

          - `Keyboard.current` / `Mouse.current` 직접 접근 (InputManager 외) → InputManager.RegisterInputEvent 패턴 변환은 큰 변경
          - 수치 하드코딩 → SO/SerializeField 도입은 큰 변경
          - FastFail 위반 (TryGet/null 체크로 증상 덮기) → 등록 누락 추적 필요

          ## 원칙

          - 위반 *외* 코드 건드리지 마라 (무관 리팩터 X)
          - 주석 추가 X (`// audit-fix` 같은 메타 X)
          - 위반 한 줄에 fix 한 줄 — 면적 최소화
          - 변경 .cs.meta 같이 staging 안 함 — 워크플로우의 git add 가 처리

          ## 출력 형식 (마지막 줄 절대 룰)

          - 한 건이라도 fix 했으면 마지막 줄: `QUALITY_FIX_RESULT: APPLIED`
          - 스캔 결과 위반 0 (또는 모두 SKIP 영역) 이면 마지막 줄: `QUALITY_FIX_RESULT: CLEAN`
          - 마커 외 다른 형식 / 메타 / 부연설명 금지

          시작.'

          set +e
          FIX_OUTPUT=$(claude --print --permission-mode bypassPermissions "$PROMPT" 2>&1)
          CLAUDE_EXIT=$?
          set -e

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::warning::Claude CLI 호출 실패 (exit=$CLAUDE_EXIT) — 다음 루프 재시도"
            echo "applied=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Claude scan+fix output ==="
          echo "$FIX_OUTPUT"
          echo "=== /output ==="

          if echo "$FIX_OUTPUT" | tail -10 | grep -q "QUALITY_FIX_RESULT: APPLIED"; then
            if git diff --quiet; then
              echo "::warning::APPLIED 응답이지만 실제 변경 0 — 비정합"
              echo "applied=no" >> "$GITHUB_OUTPUT"
            else
              echo "applied=yes" >> "$GITHUB_OUTPUT"
              # diff stat 캡처
              git diff --stat > /tmp/diff_stat.txt
              FIXED_COUNT=$(git diff --name-only | grep -c '\.cs$' || echo 0)
              echo "fixed_files=$FIXED_COUNT" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$FIX_OUTPUT" | tail -10 | grep -q "QUALITY_FIX_RESULT: CLEAN"; then
            echo "applied=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLEAN — 위반 없음 또는 모두 SKIP 영역"
          else
            echo "applied=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude 응답에 마커 없음 — 다음 루프 재시도"
          fi

      - name: Commit + push
        if: steps.guard.outputs.skip != 'yes' && steps.fix.outputs.applied == 'yes'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # .cs / .cs.meta 만 staging (audit 영역)
          git add -A -- '*.cs' '*.cs.meta'

          # 비정합: Claude 가 audit 무관 파일 만짐 → 거부
          UNTRACKED=$(git status --porcelain | grep -vE '^[AM]  .*\.(cs|cs\.meta)$' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::warning::Claude 가 .cs/.cs.meta 외 파일 변경 시도:"
            echo "$UNTRACKED"
            git reset --hard HEAD
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FIXED_FILES="${{ steps.fix.outputs.fixed_files }}"
          DIFF_STAT=$(cat /tmp/diff_stat.txt 2>/dev/null || echo "(diff stat 없음)")

          git commit -m "chore(quality-loop): Claude scan+fix ${FIXED_FILES} .cs

          Auto-fix by Claude scheduled quality-loop (proactive scan).
          룰 정본: WitchMendokusai/CLAUDE.md (스캔+수정 통합).

          diff stat:
          $DIFF_STAT

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PUSH_OK=no
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                PUSH_OK=yes
                echo "pushed=yes" >> "$GITHUB_OUTPUT"
                echo "fixed_files=$FIXED_FILES" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              git rebase --abort
            fi
            echo "::warning::push attempt $attempt 실패 — retry"
            sleep 3
          done

          if [ "$PUSH_OK" = "no" ]; then
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            echo "::error::push 3회 실패"
          fi

      - name: yawnbot Discord 알림
        if: steps.guard.outputs.skip != 'yes' && steps.commit.outputs.pushed == 'yes'
        run: |
          FIXED="${{ steps.commit.outputs.fixed_files }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HEAD_SHA=$(git rev-parse --short HEAD)

          # yawnbot webhook (github.io submodule 또는 별도 secret 미정 — 현재 skip)
          # 후속: WM repo secret 으로 YAWNBOT_WEBHOOK_URL 박으면 직접 호출.
          # 현재는 main push event 자체가 yawnbot 알림 자동 (TASK-WM-093 Phase F 정합).
          echo "::notice::push 완료 — yawnbot 알림은 main push event 가 자동 전달 ($HEAD_SHA)"
