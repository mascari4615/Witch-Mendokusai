name: Acquire Unity Activation File

# 임시 workflow — Unity Personal license 의 .alf 발급 (CI runner 머신용).
# 흐름: workflow_dispatch → .alf artifact → license.unity3d.com 에 업로드 → .ulf 다운 → UNITY_LICENSE secret 재등록.
# 사용 후 본 파일 삭제 (재발급 필요 시 재추가).

on:
  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile
        with:
          unityVersion: 6000.4.5f1

      - name: Upload .alf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 1
