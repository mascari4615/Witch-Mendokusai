name: Auto Rebase Open PRs

# main 머지 후 모든 open PR (Draft 포함, base=main) 자동 update — main 의 변경을 PR 브랜치로 merge.
# Draft 도 포함: 사용자 검증 시점 main 신선도 유지 가치. .coderabbit.yaml 의 auto_review.drafts=true 와 같은 정신.
# Draft = 머지 자체는 안 됨 (auto-merge.yml 의 ready_for_review 트리거 별개). rebase 만 받음.
# stack PR (base=다른 feature) 은 GitHub 가 자동 retarget 처리하니 본 워크플로 대상 X.
# conflict 시 PR 코멘트로 @claude 멘션 → claude.yml 의 claude job trigger → Claude 가 자동 conflict 해결.

on:
  # 1. main push event — 사용자 직접 머지 (user actor) 시 trigger.
  push:
    branches: [main]
  # 2. workflow_run — Auto Merge 가 끝난 후 보강. bot enabledBy 머지 케이스 (push event 가 다른 workflow trigger 안 시키는 GitHub 한계) 우회.
  workflow_run:
    workflows: ["Auto Merge"]
    types: [completed]
    branches: [main]
  # 3. schedule cron — 30분마다 안전망. 위 두 trigger 가 모두 놓친 경우 정기 stale 체크.
  schedule:
    - cron: '*/30 * * * *'
  # 4. manual dispatch — 사용자가 GitHub UI 에서 직접 trigger 가능.
  workflow_dispatch:

concurrency:
  group: auto-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Update all open PRs base=main
        env:
          # BOT_TOKEN (PAT) 사용 — GITHUB_TOKEN 으로 만든 코멘트는 GitHub 의 재귀 방지로
          # 다른 workflow (claude.yml) 를 trigger 안 시킴. PAT 으로 만든 코멘트는 정상 trigger.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          # Draft 포함 — main 신선도 유지가 머지 가능성과 직교. Draft 가 머지되는 건 auto-merge.yml 의 ready_for_review 별개 흐름.
          PR_NUMBERS=$(gh pr list --base main --state open --limit 100 \
            --json number \
            --jq '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs to update."
            exit 0
          fi

          for pr in $PR_NUMBERS; do
            echo "::group::Updating PR #$pr"
            if gh pr update-branch "$pr" 2>&1; then
              echo "PR #$pr updated successfully."
            else
              echo "PR #$pr update-branch failed (likely conflict). Adding @claude mention."
              gh pr comment "$pr" --body "@claude main 머지 후 본 PR 업데이트 시도했지만 conflict 발생. main 의 최신 변경을 본 브랜치에 통합하고 conflict 를 해결해주세요.

              **요구**:
              - conflict marker (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`) 모두 제거
              - 본 PR 의 의도 보존 (주제 = PR title)
              - main 의 변경 의미도 보존 (단순 \`ours\` strategy 로 무시 X)
              - 의미 충돌이면 main 의 변경을 우선 (PR description 에 conflict 해결 후 검토 메모 1줄 추가)
              - 해결 후 본 브랜치에 push"
            fi
            echo "::endgroup::"
          done
