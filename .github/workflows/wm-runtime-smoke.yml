name: WM runtime smoke (boot + 2-peer)

# TASK-WM-203 — 마지막 남은 수동 게이트 2종을 자동으로 돌린다.
#
# 배경: 부팅 회귀(wm-boot-smoke)와 2-peer 멀티 동기(wm-net-2peer-smoke)는 실재하고 실제로
# 결함을 잡아온 게이트인데(WM-121 잠복 결함, sync 버그 2건), **호출하는 사람이 없으면 안 돈다**.
# 2026-08-05 실측 = 자동 트리거 0.
#
# 왜 여기서 새로 굽지 않는가: 두 게이트는 standalone 빌드가 필요한데, 노트북 빌드는 수십 분이다.
# 그런데 build.yml 이 이미 **매일 03:23 KST 에 자동으로 굽고**(C:\wm-builds\ 에 최근 5개 보존)
# 있다. 그 결과물에 얹으면 빌드 비용 0 으로 매일 행동 회귀를 잡는다.
#
# 트리거 = 빌드 워크플로가 끝난 직후. 안드로이드 빌드가 끝난 경우에도 돌지만, 그때는
# 「최근 windows 빌드」를 찾아 쓴다 — 없거나 하루보다 낡았으면 **빨간불**이다.
# "게이트가 안 돌았는데 초록" 이 이 프로젝트가 석 달간 당한 바로 그 함정이라, 침묵을 성공으로
# 치지 않는다.

on:
  workflow_run:
    workflows: ["Build (Unity player / laptop)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: boot + 2-peer (laptop runner)
    runs-on: [self-hosted, unity, windows-build]
    timeout-minutes: 45
    # 빌드(wm-build)와 같은 노트북이지만 폴더를 안 쓰므로 별 그룹. 앞선 스모크는 취소해도 된다.
    concurrency:
      group: wm-runtime-smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ clean 을 켜면 (기본값) 체크아웃이 추적 안 되는 파일을 지운다 = **Library 삭제**.
          #   이 러너는 빌드와 작업 폴더를 공유하므로, 여기서 캐시를 날리면 빌드가 매번
          #   전체 임포트로 돌아가고(10~40분) 실제로 임포트 도중 크래시까지 났다(실측:
          #   같은 크래시 2회 연속, Library 사실상 0GB). 유니티 캐시는 지우면 안 되는 자산이다.
          clean: false

      - name: Locate freshest windows standalone
        id: build
        shell: powershell
        run: |
          $buildRoot = 'C:\wm-builds'
          if (-not (Test-Path $buildRoot))
          {
              Write-Host "ERROR: build root not found: $buildRoot"
              exit 1
          }

          $dir = Get-ChildItem $buildRoot -Directory -Filter '*-windows' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $dir)
          {
              Write-Host "ERROR: no windows build under $buildRoot -- runtime gates have no subject."
              exit 1
          }

          # ★ 실측 2026-08-06: 여기가 **게임이 아니라 UnityCrashHandler64.exe 를 골라** 왔다.
          #   유니티 빌드 폴더에는 실행 파일이 둘 있고, 이름 순으로 크래시 핸들러가 먼저다.
          #   그걸 띄우면 즉시 종료(exit=0) 하므로 두 관문 모두 "결과 파일이 없다 / 서버가
          #   ready 전에 죽었다"로 실패했다 — 게임은 멀쩡한데 검사만 계속 빨갰다.
          #   진짜 플레이어는 옆에 `<이름>_Data` 폴더를 갖는다. 그것으로 고른다.
          $exeCandidates = Get-ChildItem $dir.FullName -File -Filter '*.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike 'UnityCrashHandler*' }
          $exe = $exeCandidates |
              Where-Object { Test-Path (Join-Path $dir.FullName ($_.BaseName + '_Data')) } |
              Select-Object -First 1
          if ($null -eq $exe) { $exe = $exeCandidates | Select-Object -First 1 }
          if ($null -eq $exe)
          {
              Write-Host "ERROR: build dir has no player .exe: $($dir.FullName)"
              exit 1
          }

          # Stale build = lost coverage. Say so in red instead of passing on old evidence.
          $ageHours = [Math]::Round(((Get-Date) - $dir.LastWriteTime).TotalHours, 1)
          Write-Host "build: $($exe.FullName)  (age ${ageHours}h)"
          if ($ageHours -gt 26)
          {
              Write-Host "ERROR: freshest windows build is ${ageHours}h old (> 26h)."
              # Name the RIGHT cron. The 03:23 one builds Android; the windows player that
              # these gates actually run comes from the 05:23 one (added 2026-08-06 after
              # this message blamed a nightly that never produced a windows build).
              Write-Host "  the windows nightly (05:23 KST) is not producing -- fix that first."
              exit 1
          }

          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run boot + 2-peer gates
        shell: powershell
        run: |
          $scripts = $env:WM_MEMO_SCRIPTS
          if ([string]::IsNullOrWhiteSpace($scripts))
          {
              $scripts = 'C:\Users\masca\repos\karmoddrine\memo\dotfiles\scripts'
          }
          $gate = Join-Path $scripts 'wm-quality-gate.ps1'
          if (-not (Test-Path $gate))
          {
              Write-Host "ERROR: runtime gate script not found: $gate"
              Write-Host "  set WM_MEMO_SCRIPTS on the runner if the memo checkout lives elsewhere."
              exit 1
          }

          # -Project 를 명시한다 — 하위 게이트의 기본값은 데스크톱 배치라 러너에선 없는 경로다.
          # -SkipNet: FishNet 2-peer 관문은 은퇴했다 (TASK-WM-217/218).
          # 그 자리는 아래 "world 2-peer" 관문이 대신하고, 그쪽은 2026-08-09 초록을 봤다
          # (진짜 판 둘이 같은 세계에서 서로 봄: dolls=2 local=false). 부팅 관문은 그대로 돈다.
          & powershell -NoProfile -ExecutionPolicy Bypass -File $gate `
              -BuildOut '${{ steps.build.outputs.exe }}' `
              -Project $env:GITHUB_WORKSPACE `
              -SkipNet
          $code = $LASTEXITCODE

          # exit 2 = cannot-run. A gate that could not run is not a pass.
          if ($code -eq 2)
          {
              Write-Host "ERROR: runtime gate could not run (exit 2) -- treating as failure."
              exit 1
          }
          exit $code

      # TASK-WM-217 -- 혼자 켠 판도 놀 수 있나(서버 없이). 사람 대부분은 혼자 켠다 —
      # 서버가 있을 때만 재면 「인터넷 끊긴 날 게임이 통째로 죽는」 회귀를 못 잡는다.
      - name: Run solo gate (no server)
        shell: powershell
        run: |
          $scripts = $env:WM_MEMO_SCRIPTS
          if ([string]::IsNullOrWhiteSpace($scripts))
          {
              $scripts = 'C:/Users/masca/repos/karmoddrine/memo/dotfiles/scripts'
          }
          $gate = Join-Path $scripts 'wm-world-solo-smoke.ps1'
          if (-not (Test-Path $gate))
          {
              Write-Host "ERROR: solo gate not found: $gate"
              exit 1
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $gate -BuildOut '${{ steps.build.outputs.exe }}'
          $code = $LASTEXITCODE
          if ($code -eq 2)
          {
              Write-Host "ERROR: solo gate could not run (exit 2) -- treating as failure."
              exit 1
          }
          exit $code

      # TASK-WM-217 -- WS(.NET 서버) 판 2-peer. FishNet 관문의 대체품이라, 지우기 전에
      # 먼저 여기서 초록이 나야 한다. FishNet 관문(위 단계)과 당분간 나란히 돈다.
      - name: Run world 2-peer gate (WS server)
        shell: powershell
        run: |
          $scripts = $env:WM_MEMO_SCRIPTS
          if ([string]::IsNullOrWhiteSpace($scripts))
          {
              $scripts = 'C:\Users\masca\repos\karmoddrine\memo\dotfiles\scripts'
          }
          $gate = Join-Path $scripts 'wm-world-2peer-smoke.ps1'
          if (-not (Test-Path $gate))
          {
              Write-Host "ERROR: world 2-peer gate not found: $gate"
              exit 1
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $gate `
              -BuildOut '${{ steps.build.outputs.exe }}' `
              -Project $env:GITHUB_WORKSPACE
          $code = $LASTEXITCODE

          # exit 2 = cannot-run. A gate that could not run is not a pass.
          if ($code -eq 2)
          {
              Write-Host "ERROR: world 2-peer gate could not run (exit 2) -- treating as failure."
              exit 1
          }
          exit $code
