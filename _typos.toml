[default]
extend-ignore-re = [
    # Git commit hash (SHA-1 hex, 7-40 chars) wrapped in backticks.
    # CHANGELOG / TASK 본문 / commit msg 인용에 다수 등장.
    # 일부 영단어 닮은 hex (dead/face/cafe 등) 가 typos 에 잡히는 것 회피.
    "`[0-9a-f]{7,40}`",
]

[default.extend-words]
# 1. 게임 엔진 고유 명사 (엔진이 제공하는 고정 키워드)
lod = "lod"
navmesh = "navmesh"

# 2. 우리 게임(Witch-Mendokusai) 고유 명사 (세계관 캐릭터, 지명 등)
# (typos가 영어 사전에 없는 이름이라고 걸고 넘어지는 것을 방지)
Yon = "Yon"
Alisa = "Alisa"
Mendokusai = "Mendokusai"
Karmolab = "Karmolab"
KarmoDDrine = "KarmoDDrine"

# 3. 도메인 변수명 — Unity DataSO + 한국식 영문 표현 (의도된 명명, fix 안 함)
Datas = "Datas"          # DataSO 의 plural 변수 (e.g., monsterDatas)
datas = "datas"
equipments = "equipments"
Equipments = "Equipments"
SOID = "SOID"            # ScriptableObject ID 약어
soid = "soid"

# 4. CC 라이선스 약어 (NoDerivatives — 외부 음악 README 등에 자주 등장)
ND = "ND"

[files]
# 3. 절대 검사하면 안 되는 영역 (코드나 텍스트가 아닌 에셋, 빌드 결과물)
# Github의 공식 Unity.gitignore에 기반한 표준 제외 리스트
extend-exclude = [
    "Library/**",
    "Logs/**",
    "Temp/**",
    "obj/**",
    "bin/**",
    "Build/**",
    "UserSettings/**",
    "Packages/**",
    "FMODAssets/**",
    "Assets/PlayFabEditorExtensions/**",
    "Assets/PlayFabSDK/**",
    "Assets/Plugins/**",
    "*.meta",          # Unity 메타데이터 (랜덤 해시값이 오타로 잡힘)
    "*.asset",         # Unity 직렬화 에셋
    "*.prefab",
    "*.unity",         # Scene 파일
    "*.anim",
    "*.controller",
    "*.wlt",
    "*.shadergraph",
    "package-lock.json", # NPM 패키지 락 파일 (해시 덩어리)
    "yarn.lock",
    # CHANGELOG.md — release.yml workflow 자동 생성 (commit msg 인용).
    # 옛 commit message 의 typo 가 자동 생성 결과에 박혀서 매 release 마다 typos CI fail.
    # 검사 의미 약함 (commit msg 가 정본, CHANGELOG 는 derived).
    "CHANGELOG.md",
    # 외부 라이선스 / 외부 자산 텍스트 — 원문 보존 (수정 시 저작권 위반 위험)
    "**/LICENSE",
    "**/LICENSE.*",
    "**/license.*",
    "**/License.*",
    # 외부 자산 폴더 (third-party 스프라이트·아이콘 패키지)
    "Assets/_WitchMendokusai/Component/Item/_Common/Sprite/**",
    # 외부 패키지 (Unity Asset Store / 라이선스 텍스트 / shader)
    "Assets/TextMesh Pro/**",
    "FMODAssets/**",
]