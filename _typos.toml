[default.extend-words]
# 게임 개발/Unity 도메인 특화 단어 오탐지 제외 (왼쪽: 검사 단어, 오른쪽: 원래 단어 유지)
lod = "lod"
LOD = "LOD"
Lod = "Lod"

[files]
# 오타 검사를 수행하지 않을 Unity 특화/자동 생성 폴더와 파일 확장자
extend-exclude = [
    "Library/**",
    "Logs/**",
    "Temp/**",
    "obj/**",
    "UserSettings/**",
    "Packages/**",
    "*.meta",
    "*.asset",
    "*.prefab",
    "*.unity"
]